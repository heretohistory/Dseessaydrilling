el began building settlements, and by 2000 about 200,000 settlers lived in the West Bank and Gaza, with more in East Jerusalem. Palestinians saw this as taking their land, and it was a major cause of the First Intifada in 1987. However, Arab states had refused to recognise Israel since 1948 and declared the ‘Three Noes’ in 1967, so responsibility was shared.","w":["Weigh factors; avoid one-sided blame."]},{"id":"2020-7","t":["x"],"type":"agree","q":"‘The 20th century was characterised more by international cooperation than conflict.’ Do you agree? Explain your view using historical examples from Themes A and B within your history curriculum.","kw":["more by international cooperation than conflict","Themes A and B","20th century"],"focus":"Use examples from BOTH Theme A (Asia) and Theme B (world) and cover the WHOLE century; compare cooperation and conflict.","b":[["Conflict",["Theme B: WWI, WWII, Cold War, Arab-Israeli, Balkans","Theme A: Japanese aggression in China, Korean War, Vietnam, independence wars in SE Asia"]],["Cooperation",["Theme B: League, UN, EEC/EU, WHO, arms control","Theme A: ASEAN, Sino-Japanese normalisation 1972, HK–Mainland cooperation, APEC"]],["Trend",["First half dominated by conflict; second half more cooperation; end of Cold War"]]],"s":[["Introduction","Stand: e.g. first half conflict, second half cooperation; overall balanced/leaning."],["Body 1 · Conflict in the first half",""],["Body 2 · Cooperation in the first half",""],["Body 3 · Conflict in the second half",""],["Body 4 · Cooperation in the second half",""],["Conclusion",""]],"g":["Do you have examples from both Theme A (Asia) and Theme B (world)?","Did you cover both halves of the 20th century?","Which grew over time — cooperation or conflict?","Are you comparing conflict and cooperation, not just listing them?"],"ei":"The 20th century was characterised by both conflict and cooperation. The first half was dominated by conflict, including two world wars and Japanese aggression in Asia; the second half saw more cooperation through the UN, European integration and ASEAN, although the Cold War continued conflict.","ep":"In the second half of the century, cooperation grew in Asia. ASEAN was founded in 1967 and gradually built trust among members that had fought each other, such as Indonesia and Malaysia during Konfrontasi. China and Japan, enemies in the war of 1937-45, normalised relations in 1972 and signed a peace treaty in 1978, after which trade and Japanese aid grew rapidly. However, conflicts such as the Vietnam War and the Cambodian conflict continued until 1989, so cooperation did not fully replace conflict.","w":["Use both Themes A and B; cover the whole century."]},{"id":"2021-1","t":["hke"],"type":"analyse","q":"Analyse the social, economic and cultural roles played by Hong Kong in the Asia-Pacific Rim in the period 1971-97.","kw":["social, economic and cultural roles","Asia-Pacific Rim","1971-97"],"focus":"Name specific roles (e.g. ‘trade middleman’) and explain each with evidence in the region.","b":[["Social roles",["Refugee asylum: Vietnamese boat people (from 1975)","Job provider: Filipino and Indonesian domestic helpers","Charity and relief donor to the region"]],["Economic roles",["Trade middleman & re-export centre for China and Asia","Financial centre: loans, investment across Asia","Investor in SE Asia and China; port and air hub; one of the ‘Four Little Dragons’"]],["Cultural roles",["Culture exporter: Cantopop, films (Jackie Chan, John Woo), TVB dramas","Cultural exchange facilitator between East and West"]]],"s":[["Introduction","State three kinds of roles."],["Body 1 · Social roles",""],["Body 2 · Economic roles",""],["Body 3 · Cultural roles",""],["Conclusion","Which role mattered most?"]],"g":["Can you give each role a label (noun)?","How did boat people make HK a refugee asylum?","Which Asian countries consumed HK pop culture?","How did HK help China's trade with the world?"],"ei":"In the period 1971-97, Hong Kong played important social, economic and cultural roles in the Asia-Pacific Rim. It was a refugee asylum and job provider, a trade middleman and financial centre, and an exporter of popular culture.","ep":"Hong Kong acted as a refugee asylum in the region. After the fall of Saigon in 1975, many Vietnamese fled by sea. Hong Kong became a ‘port of first asylum’, and by 1979 more than 68,000 boat people had arrived. The government set up camps and worked with the UNHCR to resettle refugees in Western countries. This role placed a heavy burden on Hong Kong but showed its importance in dealing with the region's humanitarian crises.","w":["Analyse roles, not just contributions.","Avoid pre-1971 examples."]},{"id":"2021-2","t":["cn1"],"type":"assess","q":"Assess the significance of the 1911 Revolution and the May Fourth Movement in the modernisation of China in the period 1911-37.","kw":["Assess the significance","modernisation","1911-37"],"focus":"Evaluate what each event contributed to China's modernisation (political, socio-economic, cultural) and their limits.","b":[["1911 Revolution",["Ended monarchy; republican ideals","Social: queue cutting, ban on foot binding","Limits: warlordism"]],["May Fourth",["Cultural: decline of Confucianism, vernacular language, science and democracy","Political: CCP, KMT reorganisation, Nanjing","Socio-economic: new classes (workers, students)"]]],"s":[["Introduction",""],["Body 1 · Political",""],["Body 2 · Socio-economic",""],["Body 3 · Cultural",""],["Body 4 · Limits",""],["Conclusion",""]],"g":["What does ‘modernisation’ mean in politics, society, economy and culture?","What did the 1911 Revolution change politically and socially?","What did the May Fourth Movement change in thought and politics?","Did these changes last until 1937?","Which event was more significant, and why?"],"ei":"Both the 1911 Revolution and the May Fourth Movement were significant in China's modernisation from 1911 to 1937. The 1911 Revolution began political modernisation by ending the monarchy, while the May Fourth Movement modernised Chinese thought and culture and led to new political forces. Both had limits, but together they shaped the path of modern China.","ep":"The May Fourth Movement was significant in cultural modernisation. During the New Culture Movement, intellectuals such as Chen Duxiu and Hu Shi attacked Confucianism and promoted ‘Mr Science’ and ‘Mr Democracy’. After 1919, vernacular Chinese replaced classical Chinese in schools and publications, making education accessible to more people. The movement also spread Marxism, leading to the founding of the CCP in 1921. China's way of thinking was therefore modernised far more deeply than by the 1911 Revolution alone.","w":["Focus on modernisation and significance, not only limitations."]},{"id":"2021-3","t":["jp"],"type":"agree","q":"‘Domestic problems were more important than the drive for foreign expansion in leading to the rise of militarism in Japan in the 1930s.’ Do you agree with this statement? Explain your view with reference to Japan's development in the period 1918-37.","kw":["more important","Domestic problems","drive for foreign expansion","1918-37"],"focus":"Compare two named factors: domestic problems vs drive for expansion.","b":[["Domestic problems",["Weak party politics, corruption (1920s)","Economic crises: 1923 earthquake, 1927 financial crisis, Depression","Rural poverty"]],["Drive for expansion",["Ultranationalist ideology (Kita Ikki)","Need for resources/markets; Manchuria","Success of Mukden Incident","Military tradition"]]],"s":[["Introduction",""],["Body 1 · Domestic problems",""],["Body 2 · Expansion drive",""],["Body 3 · Interaction and weighing",""],["Conclusion",""]],"g":["What domestic problems did Japan face in 1918-37 (political and economic)?","What was the ‘drive for foreign expansion’ and where did it come from?","How did success in Manchuria affect militarists' power at home?","Which factor came first, and which made militarism possible?","Are all your examples within 1918-37?"],"ei":"Domestic problems were more important than the drive for foreign expansion in leading to the rise of militarism in Japan in the 1930s. Economic crises and the weakness of party politics destroyed public trust in civilian government and gave militarists their chance. The drive for expansion was important, but it gained support mainly because of these domestic problems.","ep":"Economic problems discredited party governments. After the 1923 Great Kanto Earthquake and the 1927 financial crisis, the Great Depression caused silk prices to fall by about half, ruining many farming families. Party politicians were seen as corrupt and linked to the zaibatsu. Young officers from rural areas blamed the parties, and in 1932 naval officers assassinated Prime Minister Inukai in the May 15 Incident. After this, no party cabinet was formed again before the war.","w":["Analyse relative importance; stay in 1918-37."]},{"id":"2021-4","t":["ww"],"type":"agree","q":"‘The failure of the League of Nations was primarily due to its institutional weaknesses.’ Do you agree with this statement? Explain your view with reference to the historical development in the interwar period.","kw":["primarily","institutional weaknesses","failure of the League of Nations","interwar period"],"focus":"Define institutional weaknesses (membership, decision-making, no army, sanctions) and compare them with external factors (Depression, totalitarianism, self-interest of powers).","b":[["Institutional weaknesses",["Membership: US never joined; Germany (to 1926) and USSR (to 1934) excluded; Japan, Germany, Italy left","Unanimous voting slowed decisions","No army; relied on economic sanctions","Covenant tied to Versailles — seen as ‘victors’ club’"]],["Other factors",["Great Depression made powers unwilling to impose sanctions","Rise of totalitarian states willing to use force","Britain and France put national interest first (Hoare-Laval Pact 1935)"]]],"s":[["Introduction","Stand: agree to a large extent; weaknesses were fatal once aggressive powers appeared."],["Body 1 · Membership","Absence of US; departures."],["Body 2 · Decision-making and enforcement","Unanimity; no army; weak sanctions (Abyssinia: no oil sanction)."],["Body 3 · Other factors","Depression, totalitarianism, self-interest."],["Body 4 · Weighing","Other factors exposed the institutional weaknesses."],["Conclusion",""]],"g":["What is an ‘institutional’ weakness?","Why did oil sanctions on Italy never happen?","How did the Depression make powers selfish?","Would a stronger League have stopped Japan or Italy?"],"ei":"The failure of the League of Nations was primarily due to its institutional weaknesses, such as its incomplete membership, slow decision-making and lack of an army. However, the Great Depression and the rise of totalitarian states exposed these weaknesses in the 1930s.","ep":"The League's lack of military power was a key institutional weakness. When Italy invaded Abyssinia in 1935, the League could only impose economic sanctions, and oil was not included. Britain and France secretly offered Italy part of Abyssinia in the Hoare-Laval Pact. Italy completed its conquest in 1936. Without an army, the League could not stop a determined aggressor.","w":["Focus on institutional weaknesses, not just limitations in general."]},{"id":"2021-5","t":["mc","eco"],"type":"examine","q":"Examine the impact of the North Atlantic Treaty Organisation and the European Community on the historical development of Europe in the second half of the 20th century.","kw":["impact","North Atlantic Treaty Organisation","European Community","second half of the 20th century"],"focus":"NATO is a military alliance; EC is economic. Examine their impact on Europe's politics, security and economy.","b":[["NATO (1949)",["Security for Western Europe; US commitment","Led to Warsaw Pact 1955 — Europe split into two blocs","West Germany rearmed and joined 1955","Deterrence kept peace; arms race; nuclear weapons in Europe","After 1991: expansion, intervention in Bosnia/Kosovo"]],["EC (EEC 1957 → EC 1967)",["Common market; economic growth","Franco-German reconciliation","Enlargement: UK 1973, Greece 1981, Spain/Portugal 1986","Single European Act 1986; Maastricht 1992 → EU","Greater European independence from US"]]],"s":[["Introduction",""],["Body 1 · NATO: security and division",""],["Body 2 · NATO: later impact",""],["Body 3 · EC: economic integration",""],["Body 4 · EC: political unity and EU",""],["Conclusion",""]],"g":["Is NATO a military alliance or an economic body? (Military.)","How did NATO affect the division of Europe and the USSR's response?","How did NATO shape Europe after 1991?","What did the EC do for European economies and politics?","How did the EC lead to the EU?"],"ei":"NATO and the European Community both deeply shaped Europe after 1945: NATO provided security but divided Europe into blocs, while the EC promoted economic integration and laid the foundation of the European Union.","ep":"NATO divided Europe into two military blocs. Formed in 1949 after the Berlin Blockade, NATO committed the US to defending Western Europe. When West Germany joined NATO in 1955, the USSR responded by forming the Warsaw Pact with its Eastern European satellites. Europe became the front line of the Cold War, with US nuclear weapons and hundreds of thousands of troops stationed in West Germany. NATO kept Western Europe secure but made the division of Europe more permanent.","w":["Don't mistake NATO for an economic body; don't just narrate the Cold War."]},{"id":"2021-6","t":["soc"],"type":"assess","q":"Assess the effectiveness of the efforts made by international organisations to tackle the problems of population and resources in the second half of the 20th century.","kw":["Assess the effectiveness","international organisations","population and resources","second half of the 20th century"],"focus":"Evaluate achievements and limitations of both inter-governmental (UN, FAO, WHO, UNFPA, World Bank) and non-governmental (Oxfam, IPPF) organisations.","b":[["Efforts",["UNFPA 1969; World Population Conferences 1974 (Bucharest), 1984, 1994 (Cairo)","FAO: Green Revolution support, World Food Programme 1961","World Bank loans; IPPF family planning; Oxfam relief","UNEP 1972; Earth Summit 1992 (sustainable development)"]],["Achievements",["World population growth rate fell from about 2% (1960s) to 1.3% (1990s)","Food production rose faster than population; famines reduced in Asia","Awareness of sustainable development"]],["Limitations",["Population still rising fast in Africa and South Asia","Famines in Ethiopia 1984, Somalia 1992","Uneven distribution of wealth; debt; funding shortages","Cultural/religious resistance to family planning"]]],"s":[["Introduction","Stand: partly effective."],["Body 1 · Population control: achievements",""],["Body 2 · Food and resources: achievements",""],["Body 3 · Limitations",""],["Body 4 · Reasons for limits",""],["Conclusion",""]],"g":["Name two IGOs and one NGO involved.","What evidence shows population growth slowed?","Why did famines continue in Africa?","Did efforts solve inequality?"],"ei":"The efforts of international organisations to tackle population and resource problems in the second half of the 20th century were partly effective. They helped slow population growth and increase food production, but population growth remained high in developing regions and resources were still unevenly distributed.","ep":"International organisations were effective in increasing food production. The FAO and the World Bank supported the Green Revolution, spreading high-yield rice and wheat, fertilisers and irrigation. India's wheat output more than doubled between 1965 and 1972, and it became self-sufficient in grain. This reduced the risk of famine in Asia.","w":["Assess effectiveness; don't just list efforts."]},{"id":"2021-7","t":["x"],"type":"select","q":"Select one of the following years, and explain why it could be regarded as a turning point in the 20th century world history: (a) 1929 (b) 1945 (c) 1991","kw":["turning point","Select one"],"focus":"Show the world BEFORE and AFTER the chosen year in several aspects to prove a turn.","b":[["1929 (Great Depression)",["Economic: prosperity → depression; protectionism","Political: democracy → rise of Nazism, militarism in Japan","International: cooperation (Locarno, Kellogg-Briand) → aggression, WWII"]],["1945 (End of WWII)",["Power: Europe → US/USSR superpowers","International order: League → UN","Colonies → decolonisation","Weapons: nuclear age; Cold War begins"]],["1991 (End of Cold War)",["Bipolar → unipolar world (US)","USSR collapse → 15 states; end of communism in Europe","Globalisation, EU expansion; ethnic conflicts (Balkans)"]]],"s":[["Introduction","Choose year; define turning point."],["Body 1 · Political turn",""],["Body 2 · Economic turn",""],["Body 3 · International relations turn",""],["Conclusion",""]],"g":["What was the world like before your year?","What changed after it — in politics, economy, international relations?","Were the changes long-lasting?"],"ei":"The year 1945 could be regarded as a turning point in 20th century world history. The end of the Second World War changed the balance of world power, the international order, the colonial system and the nature of warfare.","ep":"1945 was a turning point in world power. Before the war, Britain and France were the leading powers. After 1945, both were exhausted, while the US produced half the world's industrial output and the USSR controlled Eastern Europe. A bipolar world emerged, leading to the Cold War.","w":["Focus on ‘turning point’ — show before vs after."]},{"id":"2022-1","t":["cn1"],"type":"illustrate","q":"‘China attempted different explorations in modernisation in the first half of the 20th century.’ Illustrate this statement with reference to China's political development in the period 1900-49.","kw":["Illustrate","different explorations","political development","1900-49"],"focus":"Show the different political models tried: constitutional monarchy, republic, one-party tutelage, new democracy/socialism.","b":[["Constitutional monarchy",["Late Qing: 1908 outline constitution, provincial assemblies"]],["Republic",["1911 Revolution; Provisional Constitution 1912; parliament; Yuan's monarchy attempt 1915"]],["Party-state tutelage",["Nanjing: Sun's three stages; KMT one-party rule"]],["Socialist/new democracy",["CCP's Soviet regions, Yan'an; PRC 1949"]]],"s":[["Introduction",""],["Body 1 · Constitutional monarchy",""],["Body 2 · Republic",""],["Body 3 · Tutelage",""],["Body 4 · Communist model",""],["Conclusion",""]],"g":["What political systems did China try between 1900 and 1949?","Who led each attempt, and what were its main institutions?","Why did each attempt fail or give way to the next?","How were the explorations different from each other?","Are you staying on political development only?"],"ei":"In the first half of the 20th century, China explored different political paths to modernisation: constitutional monarchy under the late Qing, a republic after 1911, one-party tutelage under the KMT and a socialist system under the CCP.","ep":"The late Qing government explored a constitutional monarchy. After 1905, it sent officials abroad to study constitutions, and in 1908 issued the Outline of the Imperial Constitution, promising a parliament after nine years. Provincial assemblies were set up in 1909 and a National Assembly in 1910. However, the Royal Cabinet of 1911, dominated by Manchu princes, showed that the Qing did not want to share power. This exploration failed, and the 1911 Revolution replaced it with a republican system.","w":["Political development only; don't narrate unrelated events."]},{"id":"2022-2","t":["jp"],"type":"examine","q":"Examine the impact on Japan of its foreign policy from 1931 to 1952.","kw":["impact on Japan","foreign policy","1931 to 1952"],"focus":"Cause-and-effect: foreign policy → impact on Japan (political, economic, military, external), covering both pre- and post-1945.","b":[["Political",["Expansion strengthened militarists; party politics ended 1932","Defeat → occupation; democratisation"]],["Economic",["War economy; control; collapse by 1945","Post-war recovery via US aid"]],["Military",["Expansion in Asia-Pacific; then demilitarisation (Article 9)"]],["External",["Left League 1933; Axis; isolation; San Francisco Treaty 1951; US alliance"]]],"s":[["Introduction",""],["Body 1 · Political",""],["Body 2 · Economic",""],["Body 3 · Military",""],["Body 4 · External",""],["Conclusion",""]],"g":["What were Japan's main foreign policies from 1931 to 1952 (expansion, war, surrender, alliance with the US)?","What was the political impact of each on Japan?","What was the economic impact?","What was the military impact?","Did you cover the period after 1945 as well?"],"ei":"Japan's foreign policy from 1931 to 1952 had a deep impact on the country. Expansion in Asia strengthened militarism and created a war economy, but defeat in 1945 led to occupation, demilitarisation and democratisation, and the San Francisco Peace Treaty of 1951 tied Japan to the United States.","ep":"Japan's expansionist foreign policy led to international isolation. After the Mukden Incident of 1931, the League of Nations' Lytton Report condemned Japan's actions in Manchuria. Instead of withdrawing, Japan left the League in 1933. It then drew closer to Germany and Italy, signing the Anti-Comintern Pact in 1936 and the Tripartite Pact in 1940. This isolation from Western democracies led to the US oil embargo of 1941 and ultimately to the Pacific War.","w":["Show cause and effect; include post-1945."]},{"id":"2022-3","t":["sea"],"type":"discuss","q":"Discuss the characteristics of different stages in regional cooperation in Southeast Asia since 1967.","kw":["characteristics","different stages","regional cooperation","since 1967"],"focus":"Periodise ASEAN's development since 1967 and give the main characteristic of each stage with evidence.","b":[["1967-76 · Inactive, anti-communist start",["Bangkok Declaration 1967: Indonesia, Malaysia, Philippines, Singapore, Thailand","Formed amid Vietnam War fears; loose body, no secretariat until 1976","ZOPFAN 1971: Zone of Peace, Freedom and Neutrality"]],["1976-91 · Promoting harmony and political unity",["Bali Summit 1976: Treaty of Amity and Cooperation, ASEAN Secretariat","United diplomatic front against Vietnam's invasion of Cambodia (1978-89)","Brunei joined 1984; preferential trading arrangements (limited)"]],["1992-2000 · Diversified economic cooperation and enlargement",["AFTA agreed 1992","Expansion: Vietnam 1995, Laos and Myanmar 1997, Cambodia 1999 (ASEAN-10)","ASEAN Regional Forum 1994"]],["Late 1990s · Cooperating with the outside world",["Asian Financial Crisis 1997 → ASEAN+3 with China, Japan, South Korea","Dialogue partnerships; APEC"]]],"s":[["Introduction","State that ASEAN moved from a loose anti-communist grouping to a wider organisation with economic and external cooperation. Name turning points 1976 and 1992."],["Body 1 · 1967-76","Characteristic: inactive and security-driven."],["Body 2 · 1976-91","Characteristic: institution-building and political unity."],["Body 3 · 1992-2000","Characteristic: economic integration and enlargement."],["Body 4 · External cooperation","Characteristic: outward-looking (ASEAN+3, ARF)."],["Conclusion","Summarise how the characteristics changed and why."]],"g":["Why was ASEAN formed in 1967 — what were members afraid of?","What changed at the Bali Summit in 1976?","How did the end of the Cold War change ASEAN's membership?","What is AFTA and why did it matter?","How did the 1997 crisis push ASEAN to cooperate with outside powers?","Does each stage have a clear label?"],"ei":"Regional cooperation in Southeast Asia since 1967 developed through several stages, each with its own characteristics. ASEAN began as a loose, anti-communist grouping, became more unified and institutionalised after 1976, expanded and deepened economic cooperation in the 1990s, and increasingly cooperated with the wider world after the 1997 financial crisis.","ep":"From 1967 to 1976, regional cooperation was inactive and mainly anti-communist. ASEAN was founded by five non-communist states in 1967 when the Vietnam War raised fears of communist expansion. However, it had no permanent secretariat and held no summit meeting in its first nine years. Its main achievement was the 1971 declaration of a Zone of Peace, Freedom and Neutrality. Therefore, cooperation in this stage was mostly symbolic and driven by security concerns rather than practical programmes.","w":["Understand ‘characteristics of stages’ — don't just narrate ASEAN's history."]},{"id":"2022-4","t":["ww"],"type":"relimp","q":"Which factor – the failure of peace-keeping efforts or the Great Depression – was more important in causing the outbreak of the Second World War? Explain your view with reference to the historical development in the interwar period.","kw":["Which factor","failure of peace-keeping efforts","Great Depression","more important"],"focus":"Compare the two factors directly; remember Mussolini rose in 1922, before the Depression.","b":[["Failure of peace-keeping efforts",["Paris Peace Conference created grievances","Collective security failed: Manchuria 1931, Abyssinia 1935","Disarmament failed 1932-34","Appeasement: Rhineland, Munich"]],["Great Depression",["Rise of Nazism (not Fascism — Mussolini 1922)","US isolationism; Neutrality Acts","British and French economic weakness → appeasement","Aggressive expansion for resources"]]],"s":[["Introduction","Stand: e.g. the Depression was more important because it caused many peace-keeping failures."],["Body 1 · How peace-keeping failures led to war",""],["Body 2 · How the Depression led to war",""],["Body 3 · Link: Depression caused the failures",""],["Conclusion",""]],"g":["Which peace-keeping efforts failed, and when?","How did the Great Depression lead to war — politically, economically, internationally?","Did any peace-keeping failures happen before 1929?","Did the Depression cause some of the peace-keeping failures?","Be careful: Mussolini rose in 1922, before the Depression."],"ei":"The Great Depression was more important than the failure of peace-keeping efforts in causing the Second World War. Peace-keeping efforts had weaknesses from the start, but in the 1920s they kept Europe at peace. It was the Depression that brought Hitler to power, made Britain and France unwilling to act, and turned the League's weaknesses into failure.","ep":"The Depression led to the rise of Nazism. After the Wall Street Crash of 1929, American loans to Germany were withdrawn, and by 1932 German unemployment reached six million. Desperate voters turned to extremists, and the Nazi share of the vote rose from 2.6% in 1928 to 37% in July 1932. Hitler became Chancellor in 1933 and began rearmament and expansion. Without the Depression, the Nazis would probably have remained a small party, so the Depression was the more fundamental cause.","w":["Compare the two; avoid factual errors."]},{"id":"2022-5","t":["eco"],"type":"analyse","q":"Analyse the factors that facilitated economic integration in Europe in the period 1946-2000.","kw":["Analyse","factors","facilitated","economic integration","1946-2000"],"focus":"Name specific factors (not ‘French factor’) and link each to specific organisations (OEEC, ECSC, EEC, SEA, EU, Comecon).","b":[["Political factors",["US encouragement via Marshall Plan → OEEC 1948","Soviet threat and Cold War → Western unity; USSR → Comecon 1949","Franco-German reconciliation → ECSC 1951","End of Cold War and USSR collapse → Eastern states turn to EU; Maastricht 1992"]],["Economic factors",["War destruction and need for recovery","Stagnation of trade and small national markets → common market (EEC 1957)","Competition from US and Japan → Single European Act 1986"]],["Social factors",["Shortage of raw materials (coal, steel) → ECSC","Unemployment → desire for growth","Leaders: Monnet, Schuman, Delors"]]],"s":[["Introduction","State key factors and that they worked together."],["Body 1 · Post-war economic needs","Destruction, shortages → OEEC, ECSC."],["Body 2 · Cold War politics","US and USSR influence → OEEC, Comecon, Western unity."],["Body 3 · Economic competition","Common market; SEA 1986."],["Body 4 · End of the Cold War","EU enlargement, euro."],["Conclusion","Which factor mattered most?"]],"g":["For each factor, which organisation does it explain?","Why did France want to cooperate with Germany?","Why did integration speed up in the late 1980s?","How did the end of the Cold War help integration?"],"ei":"Economic integration in Europe from 1946 to 2000 was facilitated by several factors: the destruction of the Second World War and the need for recovery, the political pressures of the Cold War, the desire for Franco-German reconciliation, competition from other economic powers, and the end of the Cold War.","ep":"The need for Franco-German reconciliation and shared raw materials facilitated integration. After three wars in 70 years, France wanted to control German heavy industry. In 1950, French Foreign Minister Robert Schuman proposed placing French and German coal and steel under a common authority. In 1951, six countries formed the ECSC, which removed barriers to trade in coal and steel. This showed that integration could bring both peace and prosperity, and it became the model for the EEC in 1957.","w":["Avoid vague factors like ‘British factor’.","Cite organisations as evidence."]},{"id":"2022-6","t":["mc"],"type":"examine","q":"Examine the roles played by the USA in the development of the Cold War in the period 1946-91.","kw":["roles","USA","development of the Cold War","1946-91"],"focus":"Label each role (e.g. ‘leader of the capitalist bloc’, ‘aid provider’, ‘military organiser’) and show how it affected the Cold War's development.","b":[["Political roles",["Leader of the capitalist bloc: Truman Doctrine","Challenger of communism: containment, Reagan Doctrine","Peace-maker: détente, arms talks, Malta 1989"]],["Economic roles",["Aid provider: Marshall Plan US$13bn","Trade promoter: GATT, Bretton Woods"]],["Military roles",["Military organiser: NATO, SEATO, bases","Competitor: arms race, space race, SDI","Fighter: Korea, Vietnam"]]],"s":[["Introduction",""],["Body 1 · Political roles",""],["Body 2 · Economic roles",""],["Body 3 · Military roles",""],["Conclusion",""]],"g":["Can you give each US role a label (e.g. ‘aid provider’, ‘military organiser’)?","How did each role affect the development of the Cold War?","Did the US ever play the role of peace-maker?","Did your examples cover 1946-91?"],"ei":"The USA played several roles in the development of the Cold War from 1946 to 1991. Politically, it was the leader of the capitalist bloc and the challenger of communism; economically, it was an aid provider and promoter of trade; and militarily, it was an organiser of alliances and a competitor in the arms race. These roles both intensified the Cold War and, at times, helped ease it.","ep":"As an aid provider, the USA shaped the early Cold War. In 1947, the Marshall Plan offered about US$13 billion to help European recovery. Western European countries accepted and formed the OEEC in 1948, but the USSR refused and forced Eastern Europe to reject it, setting up Comecon in 1949 instead. American aid therefore strengthened Western Europe against communism but also deepened the economic division of Europe into two blocs.","w":["Discuss several roles; show their effects."]},{"id":"2022-7","t":["x","cn2","mc"],"type":"select","q":"‘“The ideas of individuals” is the main driving force in bringing about historical changes.’ Do you agree with this statement? Select one of the following to explain your view. (a) ‘Socialism with Chinese characteristics’ of Deng Xiao-ping and the achievement of China's economic modernisation (b) The ‘opposition to the apartheid’ of Nelson Mandela and the end of apartheid in South Africa","kw":["ideas of individuals","main driving force","historical changes"],"focus":"Compare the individual's ideas with other factors in causing the chosen change.","b":[["(a) Deng's ideas",["Seek truth from facts; ‘black cat, white cat’","Household responsibility system, SEZs, socialist market economy (1992 Southern Tour)"]],["(a) Other factors",["Failures of Maoist economy created demand for change","External: Japan's model, Four Little Dragons, HK capital and SE Asian investment","Globalisation, Western investment"]],["(b) Mandela's ideas",["Equality, non-racialism, reconciliation"]],["(b) Other factors",["International sanctions; ANC and mass resistance; Botha and de Klerk reforms; end of Cold War"]]],"s":[["Introduction","Stand."],["Body 1 · The individual's ideas",""],["Body 2 · Other factors",""],["Body 3 · Weighing",""],["Conclusion",""]],"g":["What exactly were the individual's ideas?","How did these ideas lead to specific policies or actions?","What other factors made the change possible (internal and external)?","Could the ideas have worked without these other factors?","Which was the main driving force?"],"ei":"I disagree that ‘the ideas of individuals’ were the main driving force behind China's economic modernisation. Deng Xiaoping's ‘socialism with Chinese characteristics’ opened the door to reform, but the failures of the Maoist economy, the example of Japan and the Four Little Dragons, and investment from Hong Kong and Southeast Asia were also crucial.","ep":"Deng's ideas were important because they gave reform its direction. Deng argued that China should ‘seek truth from facts’ and that it did not matter whether a cat was black or white as long as it caught mice. Based on these ideas, the household responsibility system was introduced from 1978 and SEZs were created in 1980. However, these ideas only succeeded because Hong Kong businesses invested heavily in the Pearl River Delta; by the 1990s, Hong Kong was the largest source of foreign investment in China. This shows ideas needed external support.","w":["Discuss relative importance, not narrate changes."]},{"id":"2023-1","t":["hke"],"type":"elaborate","q":"‘In the 20th century, Hong Kong's economic development brought about urbanisation, and urbanisation further facilitated its economic development.’ Elaborate on this statement.","kw":["Elaborate","economic development","urbanisation","facilitated"],"focus":"Show the two-way cause-and-effect in each stage (entrepôt → industrial → financial).","b":[["Entrepôt stage (1900-50)",["Trade led to reclamation (Praya Reclamation), Kowloon development, KCR 1910","Better port and transport promoted trade"]],["Industrial stage (1950s-70s)",["Factories needed land → Kwun Tong, Tsuen Wan industrial towns; public housing","New towns and MTR (1979) moved labour efficiently, supported industry"]],["Service/finance stage (1980s-90s)",["Finance boom → Central skyscrapers, urban renewal","Cross-harbour tunnels, new airport (Chek Lap Kok) supported finance and logistics"]]],"s":[["Introduction","Agree: a cycle of mutual reinforcement; periodise."],["Body 1 · Entrepôt stage","Both directions."],["Body 2 · Industrial stage",""],["Body 3 · Financial stage",""],["Conclusion",""]],"g":["What are examples of urbanisation (reclamation, new towns, transport)?","For each stage, how did the economy cause urbanisation?","How did the new infrastructure then help the economy?"],"ei":"In the 20th century, economic development and urbanisation reinforced each other in Hong Kong. In each stage — entrepôt, industrial city and financial centre — economic growth created a need for land and transport, and the resulting urban development then supported further growth.","ep":"In the industrial stage, economic development led to urbanisation. From the 1950s, factories needed land and workers, so the government developed Kwun Tong and Tsuen Wan as industrial satellite towns and built resettlement estates nearby. In turn, this urbanisation facilitated economic development: new towns provided a large, concentrated labour force, and the MTR (opened in 1979) connected workers to factories and offices.","w":["Periodise and explain both directions of causation in each period."]},{"id":"2023-2","t":["cn2"],"type":"examine","q":"Examine China's efforts to strengthen its relations with other Asian countries since 1978.","kw":["Examine","efforts","other Asian countries","since 1978"],"focus":"Name types of efforts and illustrate with several Asian countries.","b":[["Diplomatic",["Sino-Japanese Treaty of Peace and Friendship 1978; Deng's visit to Japan","Normalisation with Indonesia 1990, Singapore 1990, South Korea 1992, Vietnam 1991","Ties with USSR/Central Asia 1989"]],["Peaceful negotiation",["Border agreements with Russia, Vietnam","Shanghai Five 1996","ASEAN dialogue partner 1996"]],["Economic and cultural",["Trade and investment with Japan, ASEAN; APEC 1991","Science, education exchanges"]]],"s":[["Introduction",""],["Body 1 · Diplomatic visits and ties",""],["Body 2 · Negotiations and regional bodies",""],["Body 3 · Economic cooperation",""],["Body 4 · Cultural/education",""],["Conclusion",""]],"g":["Which Asian countries did China build or restore relations with after 1978?","What types of efforts did China make: visits, treaties, negotiations, trade, culture?","How did China join regional organisations?","What were the results of these efforts?","Do you cover more than one country and stay after 1978?"],"ei":"Since 1978, China has made many efforts to strengthen its relations with other Asian countries. It used official visits and diplomatic recognition, peaceful negotiations over borders, participation in regional organisations, and economic, scientific and cultural cooperation. These efforts turned many former rivals into partners.","ep":"China strengthened relations through official visits and diplomatic recognition. In 1978, China and Japan signed the Treaty of Peace and Friendship, and Deng Xiaoping visited Japan, where he toured modern factories. In 1990, China established diplomatic relations with Singapore and restored relations with Indonesia, and in 1992 it recognised South Korea. These steps ended years of Cold War hostility and opened the way for trade and investment.","w":["Discuss more than one country; stay after 1978."]},{"id":"2023-3","t":["jp"],"type":"agree","q":"‘The end of the Second World War brought about tremendous changes to Japan.’ Comment on the validity of this statement with reference to Japan's development from the 1920s to the 1960s.","kw":["Comment on the validity","tremendous changes","end of the Second World War","1920s to the 1960s"],"focus":"Compare Japan before 1945 (1920s-30s) with after 1945 (to 1960s) in several aspects, showing change and some continuity.","b":[["Political",["Before: emperor sovereign, militarist domination in 1930s","After: 1947 Constitution — popular sovereignty, emperor as symbol, women's suffrage","Continuity: LDP one-party dominance from 1955; old bureaucrats returned"]],["Military",["Before: expansion, powerful army","After: Article 9 renounced war; Self-Defence Forces 1954 only"]],["Economic",["Before: zaibatsu, rural landlordism, war economy","After: land reform, zaibatsu dissolved (later keiretsu), economic miracle; 10% growth in 1960s"]],["Foreign relations",["Before: Axis, aggression in Asia","After: US ally (1951 Security Treaty), UN member 1956"]]],"s":[["Introduction","Stand: largely valid — 1945 changed politics, military and diplomacy fundamentally, though some economic and bureaucratic continuity remained."],["Body 1 · Political change","Compare 1920s-30s with 1947 onwards."],["Body 2 · Military change","From expansion to pacifism."],["Body 3 · Economic change","Land reform, growth; keiretsu continuity."],["Body 4 · Foreign relations and continuity","US alliance; LDP and bureaucracy continuity."],["Conclusion","Weigh change against continuity."]],"g":["For each aspect, what was Japan like in the 1920s-30s?","What changed after 1945 in the same aspect?","Is anything the same? (keiretsu, bureaucracy, emperor still present)","Was the change ‘tremendous’ or moderate?"],"ei":"The end of the Second World War brought tremendous changes to Japan. Comparing the 1920s-30s with the 1950s-60s, Japan changed from a militarist empire to a pacifist democracy and a US ally, and its economy was reformed and grew rapidly. However, there was some continuity in the bureaucracy and in business groups.","ep":"The end of the war transformed Japan's political system. In the 1930s, sovereignty lay with the emperor and the military dominated the cabinet, especially after the February 26 Incident of 1936. After the war, the 1947 Constitution declared that sovereignty belonged to the people, made the emperor a symbol of the state and gave women the vote. This was a fundamental change from imperial authoritarianism to parliamentary democracy.","w":["Discuss change (compare before and after), not just narrate."]},{"id":"2023-4","t":["ww"],"type":"agree","q":"‘The rise of totalitarianism was a key factor in undermining the decisions made in the Paris Peace Conference (1919).’ Do you agree with this statement? Explain your view.","kw":["key factor","rise of totalitarianism","undermining the decisions","Paris Peace Conference"],"focus":"Identify the Conference's decisions (disarmament, territory, League, reparations), show how totalitarian states undermined them, and compare with other factors.","b":[["Decisions of 1919",["German disarmament (100,000 army, no air force), demilitarised Rhineland","Territorial arrangements: Saar, Austria-Germany union forbidden, new states","League of Nations and collective security","Reparations"]],["Totalitarianism undermined them",["Hitler: rearmament 1935, Rhineland 1936, Anschluss 1938, Sudetenland 1938","Mussolini: Corfu 1923, Abyssinia 1935-36, left League 1937","Japan's militarists: Manchuria 1931 (Asia link)"]],["Other factors",["Great Depression ended reparations (Lausanne 1932) and weakened democracies","Appeasement: Britain and France allowed breaches","US isolationism: League weak; France insecure","Early revisions in the 1920s (Dawes, Locarno) before totalitarianism"]]],"s":[["Introduction","Stand: agree it was a key factor, especially in the 1930s, but the Depression, appeasement and US isolationism made its success possible."],["Body 1 · Totalitarianism undermined military decisions","German rearmament and Rhineland."],["Body 2 · Totalitarianism undermined territorial decisions","Anschluss, Sudetenland, Abyssinia."],["Body 3 · Other factors","Depression, appeasement, US isolationism."],["Body 4 · Weighing","Totalitarian states acted; others allowed it."],["Conclusion","Clear judgement."]],"g":["List three decisions of 1919 that were later broken.","Who broke each one, and when?","Were any decisions undermined before Hitler came to power?","Why didn't Britain and France enforce the treaty?","Is totalitarianism ‘a key factor’ or ‘the key factor’?"],"ei":"I agree that the rise of totalitarianism was a key factor in undermining the decisions made at the Paris Peace Conference. Hitler and Mussolini deliberately broke the disarmament and territorial terms in the 1930s. However, the Great Depression, appeasement and US isolationism were also important because they made it possible for the dictators to succeed.","ep":"Totalitarian Germany directly undermined the military decisions of 1919. The Treaty of Versailles limited Germany's army to 100,000 men and demilitarised the Rhineland. In 1935, Hitler reintroduced conscription and revealed the Luftwaffe, and in 1936 he sent troops into the Rhineland. A democratic Weimar government had not dared such open breaches. This shows that the nature of the Nazi regime was key to destroying the Versailles system.","w":["Don't only explain why totalitarianism rose — link it to undermining specific decisions."]},{"id":"2023-5","t":["mc"],"type":"examine","q":"Examine the factors that influenced Arab-Israeli relations after 1945.","kw":["Examine","factors","Arab-Israeli relations","after 1945"],"focus":"Name factors and analyse how each shaped relations (hostility and peace) — don't just narrate wars.","b":[["Nationalism",["Zionism vs Arab and Palestinian nationalism; competing claims to land and Jerusalem"]],["Religion and history",["Jerusalem holy to Jews and Muslims; historical claims; memory of the Holocaust driving Israel's security focus"]],["Economic resources",["Water (Jordan River, Golan Heights), land, Suez Canal; oil weapon 1973"]],["International intervention and mediation",["Britain's withdrawal; UN partition 1947; superpower arms (US–Israel, USSR–Egypt/Syria)","US mediation: Camp David 1978, Egypt–Israel treaty 1979; Oslo 1993; Jordan–Israel 1994"]],["Leadership and changing interests",["Sadat's visit to Jerusalem 1977; Rabin and Arafat; Rabin's assassination 1995"]]],"s":[["Introduction","State the main factors and that they produced both hostility and, later, partial peace."],["Body 1 · Nationalism","How it caused wars 1948-73 and the Intifada."],["Body 2 · Religion and resources","Jerusalem, water, Golan."],["Body 3 · International intervention","Arms, wars (Suez), ceasefires."],["Body 4 · Mediation and leadership","Camp David, Oslo."],["Conclusion","Which factor mattered most?"]],"g":["Why did the 1948 war happen?","Why were the Golan Heights so valuable to Israel?","How did the 1973 oil embargo affect the conflict?","Why did Egypt make peace in 1979 while others did not?","Is each paragraph built around a factor?"],"ei":"After 1945, Arab-Israeli relations were influenced by nationalism, religion, competition for resources, international intervention and the choices of individual leaders. These factors produced repeated wars from 1948 to 1973, but mediation and changing interests later brought partial peace.","ep":"Competition for economic resources influenced relations. Water was scarce in the region, and Israel's National Water Carrier drew water from the Jordan River system, which Arab states opposed. In the 1967 war, Israel captured the Golan Heights, which controlled important water sources. Israel's refusal to return the Golan to Syria has prevented a peace treaty between the two countries, showing how resources prolonged hostility.","w":["Analyse factors, don't just narrate events."]},{"id":"2023-6","t":["soc"],"type":"analyse","q":"Analyse the obstacles to international social and cultural cooperation in the second half of the 20th century.","kw":["Analyse","obstacles","international social and cultural cooperation","second half of the 20th century"],"focus":"Name obstacles and explain how each hindered cooperation, with examples of specific organisations or programmes.","b":[["Institutional weaknesses of IGOs",["Dependence on member funding; US withheld UN dues, left UNESCO 1984","Bureaucracy; no enforcement power"]],["Cold War politics",["Soviet bloc boycotts; Olympic boycotts 1980, 1984","Aid used for political aims"]],["Economic disparities",["North–South gap; developing states unable to fund programmes","Debt crisis 1980s"]],["Religious and cultural differences",["Opposition to family planning (Cairo 1994 debates)","Differing views on women's rights and human rights"]],["National sovereignty",["States reject interference in domestic affairs"]]],"s":[["Introduction",""],["Body 1 · IGO weaknesses",""],["Body 2 · Politics and the Cold War",""],["Body 3 · Economic disparities",""],["Body 4 · Culture, religion, sovereignty",""],["Conclusion","Which obstacle was most serious?"]],"g":["Why did the US leave UNESCO?","How did the Cold War affect cultural exchanges like the Olympics?","Why was family planning controversial?"],"ei":"International social and cultural cooperation in the second half of the 20th century faced several obstacles: institutional weaknesses of inter-governmental organisations, Cold War politics, economic disparities between countries, and religious and cultural differences.","ep":"Cold War politics hindered cultural cooperation. In 1980, the US and over 60 countries boycotted the Moscow Olympics in protest at the Soviet invasion of Afghanistan, and in 1984 the Soviet bloc boycotted the Los Angeles Olympics. The Olympics, meant to promote international friendship, became a tool of political rivalry.","w":["Focus on obstacles, not the Cold War in general."]},{"id":"2023-7","t":["x"],"type":"illustrate","q":"‘The historical development of the 20th century was progress from hostilities to collaboration.’ Illustrate this statement with relevant historical examples from Themes A and B in the curriculum.","kw":["progress from hostilities to collaboration","Themes A and B","Illustrate"],"focus":"Show the progression over time using Theme A and Theme B examples.","b":[["Theme B",["World wars → League, UN","Franco-German hostility → ECSC, EEC, EU","Cold War confrontation → détente → end 1991"]],["Theme A",["Sino-Japanese wars → normalisation 1972, treaty 1978","SE Asian conflicts (Konfrontasi, Vietnam) → ASEAN 1967, expansion 1990s","Hong Kong and China: strike-boycott → economic cooperation after 1978"]]],"s":[["Introduction",""],["Body 1 · Europe (Theme B)",""],["Body 2 · Global (Theme B)",""],["Body 3 · East Asia (Theme A)",""],["Body 4 · Southeast Asia (Theme A)",""],["Conclusion",""]],"g":["Which pairs of countries or regions moved from war to cooperation?","Do you have examples from both Theme A and Theme B?","Which examples show the progress clearly with dates?","Were there exceptions where hostility continued?"],"ei":"The historical development of the 20th century can be seen as progress from hostilities to collaboration. In Europe, two world wars were followed by the UN and European integration; the Cold War ended in 1991. In Asia, Japanese aggression and regional wars gave way to Sino-Japanese normalisation and ASEAN cooperation. However, the progress was uneven, and conflicts continued in some regions.","ep":"France and Germany show the progress from hostility to collaboration. They fought three wars between 1870 and 1945, and Germany occupied France during the Second World War. Yet in 1951 they founded the European Coal and Steel Community, and in 1957 the EEC, with France and West Germany at its core. In 1963, de Gaulle and Adenauer signed the Élysée Treaty of friendship. By the end of the century, the two countries led the European Union together.","w":["Use both Themes; analyse progress."]},{"id":"2024-1","t":["hkp"],"type":"relimp","q":"How important was the participation of Chinese leaders and Chinese organisations to Hong Kong's administration up to 1941?","kw":["How important","Chinese leaders and Chinese organisations","administration","up to 1941"],"focus":"Assess the importance of Chinese elites and organisations relative to other factors in HK's administration before 1941.","b":[["Chinese leaders",["Ho Kai, Wei Yuk, Chow Shouson, Robert Hotung as LegCo/ExCo unofficial members","Mediated during strikes (1922, 1925-26)"]],["Chinese organisations",["Tung Wah Hospital (1870), Po Leung Kuk (1878): medical care, protection of women, burial","District Watch Force; kaifong associations; chambers of commerce"]],["Other factors",["British executive-led rule and Governor's power","Language barrier and policy of non-interference","China factor (1911 Revolution, strikes)","Population composition: 95% Chinese"]]],"s":[["Introduction","Stand: very important as a bridge, though British retained power."],["Body 1 · Leaders",""],["Body 2 · Organisations",""],["Body 3 · Other factors",""],["Body 4 · Weighing",""],["Conclusion",""]],"g":["Why did the British need Chinese intermediaries?","What services did Tung Wah provide?","Who held real decision power?","Did Chinese participation increase over time?"],"ei":"Up to 1941, the participation of Chinese leaders and organisations was very important to Hong Kong's administration because the British relied on them as a bridge to the Chinese majority. However, real power remained in British hands.","ep":"Chinese organisations helped the government to govern the Chinese community. The Tung Wah Hospital, founded in 1870, provided Chinese medical care, ran free schools and organised famine relief, while the Po Leung Kuk protected kidnapped women and children. Because British officials had little contact with the Chinese and did not speak Cantonese, they relied on these bodies to manage welfare and to explain government policies. Their leaders were often later appointed to the Legislative Council, showing how important they were to administration.","w":["Compare with other factors; don't just describe HK's administration."]},{"id":"2024-2","t":["cn1"],"type":"examine","q":"Examine the features of the different phases of the communist revolution of China in the period 1921-49.","kw":["features","different phases","communist revolution","1921-49"],"focus":"Divide 1921-49 into phases with clear turning points, then give 2-3 features for each phase with evidence. Stay on the CCP's revolution, not the Nanjing government.","b":[["Phase 1: 1921-27 · Founding and cooperation",["CCP founded in Shanghai 1921 with Comintern help; small, intellectual-led party","First United Front (1924): communists joined the KMT as individuals","Focus on urban workers: Hong Kong Seamen's Strike, May Thirtieth Movement","Ended by Chiang's purge in Shanghai, April 1927"]],["Phase 2: 1927-37 · Armed struggle in the countryside",["Nanchang Uprising 1927 → Red Army; urban uprisings failed","Jiangxi Soviet 1931: land redistribution won peasants","KMT encirclement campaigns → Long March 1934-35","Zunyi Conference 1935: Mao takes leadership; Xi'an Incident 1936"]],["Phase 3: 1937-45 · Second United Front and expansion",["Cooperation with KMT against Japan; Eighth Route Army and New Fourth Army","Guerrilla warfare behind Japanese lines; Yan'an as model base","Rectification Movement 1942 strengthened Mao Zedong Thought","Party grew from about 40,000 to 1.2 million members"]],["Phase 4: 1945-49 · Civil War and victory",["Chongqing negotiations failed; full civil war from 1946","Land reform in liberated areas mobilised peasants","Three great campaigns (Liaoshen, Huaihai, Pingjin) 1948-49","PRC founded 1 October 1949"]]],"s":[["Introduction","State that the revolution changed from a small urban movement allied with the KMT into a peasant-based armed revolution that won power. Name the turning points 1927, 1937 and 1945."],["Body 1 · 1921-27","Features: founding under Soviet guidance; cooperation with the KMT; urban labour movement."],["Body 2 · 1927-37","Features: armed struggle; rural bases and land reform; survival through the Long March; Mao's rise."],["Body 3 · 1937-45","Features: united front against Japan; guerrilla expansion; ideological unity."],["Body 4 · 1945-49","Features: open civil war; mass peasant support; military victory."],["Conclusion","Summarise the overall shift: from city to countryside, from alliance to armed struggle, from weakness to victory."]],"g":["Which events mark the start and end of each phase?","In each phase, who were the CCP's main supporters — workers, peasants, or intellectuals?","In each phase, was the CCP cooperating with or fighting the KMT?","Why did the CCP shift its focus to the countryside after 1927?","How did the war against Japan help the CCP grow?","Does each paragraph name features, rather than just tell the story?"],"ei":"Between 1921 and 1949, China's communist revolution passed through four phases. It began as a small urban party cooperating with the KMT, turned into an armed rural revolution after 1927, expanded rapidly during the Second United Front against Japan, and finally won power in the Civil War of 1945-49.","ep":"The main feature of the 1927-37 phase was armed revolution based in the countryside. After Chiang Kai-shek's purge in April 1927, the CCP's urban uprisings, such as the Guangzhou Uprising, were crushed. Mao Zedong therefore built rural bases, and in 1931 the Jiangxi Soviet was established, where land was taken from landlords and given to poor peasants. This won peasant support and gave the Red Army recruits. Even when the fifth encirclement campaign forced the Long March in 1934, the party survived and chose Mao as leader at Zunyi. This phase changed the revolution from a worker-led movement into a peasant-based armed struggle.","w":["Do not write about the Nanjing government's modernisation efforts.","Do not go beyond 1949.","Describe features of each phase, not just narrate events."]},{"id":"2024-3","t":["jp"],"type":"describe","q":"Describe the political, economic and cultural conditions of Japan in the first three decades of the 20th century, and discuss whether these conditions still existed in Japan in the last three decades of the 20th century.","kw":["Describe","political, economic and cultural conditions","first three decades","still existed","last three decades"],"focus":"Two tasks: describe 1900-30 conditions in three aspects, then judge continuity/change in 1970-2000 for each.","b":[["Political",["1900-30: Meiji Constitution, sovereign emperor, genro; Taisho democracy, party cabinets, 1925 suffrage","1970-2000: emperor a symbol; parliamentary democracy continued; LDP dominance until 1993 — partly continued (party politics) but emperor's status changed"]],["Economic",["1900-30: rapid industrialisation; light (textiles) then heavy industry; zaibatsu; railways","1970-2000: advanced industrial economy, electronics, cars; keiretsu; bubble and 1990s recession — industrial strength continued"]],["Cultural",["1900-30: Westernised lifestyle in cities (moga/mobo), Western dress; traditions like Shinto, bushido, emperor loyalty","1970-2000: highly Westernised consumer culture; traditions preserved (festivals, tea ceremony); emperor worship gone"]]],"s":[["Introduction","State that economic and cultural conditions largely continued in modern form, while political conditions changed fundamentally in the status of the emperor."],["Body 1 · Political: describe and compare",""],["Body 2 · Economic: describe and compare",""],["Body 3 · Cultural: describe and compare",""],["Conclusion","Overall continuity vs change."]],"g":["What were Japan's political features in 1900-30?","Did democratisation continue into 1970-2000?","Were zaibatsu and keiretsu the same?","Which traditions survived?"],"ei":"In the first three decades of the 20th century, Japan was a constitutional monarchy with growing party politics, an industrialising economy and a culture mixing Western and traditional elements. In the last three decades of the century, many economic and cultural conditions still existed in more developed forms, but the political position of the emperor had changed fundamentally.","ep":"Economically, rapid industrial development in the early 20th century continued into the late 20th century. Before 1930, Japan developed textile exports and, after the First World War, heavy industries such as shipbuilding under zaibatsu like Mitsui and Mitsubishi. In 1970-2000, Japan remained a leading industrial power, producing cars and electronics through keiretsu groups. Therefore this condition still existed, though in a more advanced form.","w":["Discuss change and continuity, not just two descriptions.","Balance all three aspects."]},{"id":"2024-4","t":["ww"],"type":"analyse","q":"Analyse three political changes to the world brought by the Second World War, and discuss whether these changes could forge a new international order after the Second World War. Explain your view with reference to historical development in the period 1919-60.","kw":["three political changes","forge a new international order","1919-60"],"focus":"Pick exactly three POLITICAL changes, show before (1919-39) vs after (1945-60), then judge if they built a new international order.","b":[["Change 1 · World leadership",["Before: Britain and France led; US isolationist, USSR outcast","After: US and USSR superpowers; bipolar world","New order? Yes — but a divided Cold War order"]],["Change 2 · Inter-governmental organisations",["Before: League without US, collapsed","After: UN 1945 with Security Council, US and USSR members; NATO 1949, Warsaw Pact 1955","New order? Stronger framework but veto paralysis"]],["Change 3 · Formation of new nations",["Before: empires in Asia and Africa","After: India 1947, Indonesia 1949, Ghana 1957; Afro-Asian bloc, Bandung 1955","New order? Yes — end of colonial world, Non-Aligned Movement"]]],"s":[["Introduction","Name the three changes and your judgement (a new but divided order)."],["Body 1 · Leadership change","Before/after; new order?"],["Body 2 · International organisations","Before/after; new order?"],["Body 3 · New nations","Before/after; new order?"],["Conclusion","Did these changes forge a new international order? To what extent?"]],"g":["Are your three changes political (not economic or social)?","What was the situation in 1919-39 for each?","What does ‘international order’ mean — rules, leaders, institutions?","Was the new order stable or divided?"],"ei":"The Second World War brought three major political changes: the rise of the US and USSR as superpowers, the creation of stronger inter-governmental organisations such as the UN, and the independence of many new nations. These changes did forge a new international order after 1945, but it was a divided, bipolar order shaped by the Cold War.","ep":"The first political change was in world leadership. In the interwar years, Britain and France dominated world politics, while the US followed isolationism and the USSR was isolated. After 1945, Britain and France were exhausted, and the US and USSR emerged as superpowers. They divided Europe into two blocs, symbolised by NATO in 1949 and the Warsaw Pact in 1955. This created a new bipolar international order, but one based on confrontation rather than cooperation.","w":["Political changes only.","Discuss whether they formed a new order, not just describe changes."]},{"id":"2024-5","t":["mc"],"type":"extent","q":"To what extent was the development of the Cold War affected by the ‘fear of nuclear war’ in the period 1962-85? Explain your view.","kw":["To what extent","fear of nuclear war","1962-85"],"focus":"Assess how fear of nuclear war shaped the Cold War (mainly toward détente/arms control) vs other factors (Vietnam, Sino-Soviet split, Afghanistan, economics).","b":[["Fear of nuclear war",["Cuban Missile Crisis 1962 → hotline 1963, Partial Test Ban Treaty 1963","Non-Proliferation Treaty 1968; SALT I and ABM 1972; SALT II 1979","MAD prevented direct war","Early 1980s: Able Archer 1983, peace movements; renewed talks 1985 (Geneva summit)"]],["Other factors",["Vietnam War: US overstretch → détente","Sino-Soviet split → US–China rapprochement 1972","Economic costs; Ostpolitik in Europe","Soviet invasion of Afghanistan 1979 → end of détente, ‘Second Cold War’","Reagan's ideology and SDI"]]],"s":[["Introduction","Stand: to a large extent in the 1960s-70s (détente), less so when other factors caused the Second Cold War."],["Body 1 · 1962-72: fear drives arms control",""],["Body 2 · Other factors behind détente","Vietnam, China, economics."],["Body 3 · 1979-85: other factors dominated","Afghanistan, Reagan."],["Body 4 · Fear returns 1983-85","Able Archer, Geneva."],["Conclusion",""]],"g":["What did the Cuban Missile Crisis teach both sides?","Name three agreements caused by fear of nuclear war.","Why did détente end in 1979 despite nuclear fear?","How did the Sino-Soviet split affect US policy?"],"ei":"The ‘fear of nuclear war’ affected the development of the Cold War to a large extent between 1962 and 1985. After the Cuban Missile Crisis, it pushed the superpowers towards arms control and détente. However, other factors such as the Vietnam War, the Sino-Soviet split and the Soviet invasion of Afghanistan also shaped the Cold War, especially the return of tension after 1979.","ep":"The fear of nuclear war directly led to arms control after 1962. During the Cuban Missile Crisis, the world came close to nuclear war for thirteen days. Afterwards, a hotline was set up between Washington and Moscow in 1963, and the Partial Test Ban Treaty was signed the same year. This trend continued with the Non-Proliferation Treaty in 1968 and SALT I in 1972. These agreements show that fear of nuclear war turned confrontation into managed competition.","w":["Weigh fear of nuclear war against other factors; don't just narrate."]},{"id":"2024-6","t":["mc"],"type":"assess","q":"How effective was international intervention in dealing with racial conflicts in the Balkans in the period 1980-99? Explain your view.","kw":["How effective","international intervention","racial conflicts in the Balkans","1980-99"],"focus":"Evaluate achievements and limitations of UN, EC/EU, NATO, US actions in Yugoslavia's wars (Croatia, Bosnia, Kosovo). Not WWI Balkans!","b":[["Achievements",["Recognition of Slovenia, Croatia, Bosnia (1992) — independent states","UNPROFOR delivered humanitarian aid","NATO air strikes 1995 → Dayton Agreement ended Bosnian war","International tribunal (ICTY 1993) prosecuted war criminals","NATO bombing 1999 → Serbian withdrawal from Kosovo; KFOR"]],["Limitations",["Slow and divided: EC and UN plans (Vance-Owen) failed","Arms embargo hurt Bosnian Muslims","Srebrenica 1995: 8,000 killed in a UN ‘safe area’","Refugee crisis: over 2 million displaced","Did not remove ethnic hatred; Bosnia divided; NATO bombing without UN approval"]]],"s":[["Introduction","Stand: limited effectiveness — ended wars late but failed to prevent atrocities or solve ethnic divisions."],["Body 1 · Early intervention 1991-94","Recognition, UNPROFOR, failures."],["Body 2 · Bosnia settlement 1995","NATO strikes, Dayton."],["Body 3 · Kosovo 1998-99",""],["Body 4 · Long-term limits","Refugees, divided societies."],["Conclusion",""]],"g":["Which countries/organisations intervened?","What happened at Srebrenica, and what does it show?","What did the Dayton Agreement achieve?","Did intervention solve the racial problem?"],"ei":"International intervention in the Balkans between 1980 and 1999 was only partly effective. It eventually ended the wars in Bosnia and Kosovo and recognised new states, but it was slow, failed to prevent massacres such as Srebrenica, and could not uproot ethnic hatred.","ep":"International intervention was ineffective in protecting civilians in Bosnia. In 1993, the UN declared Srebrenica a ‘safe area’, guarded by lightly armed Dutch peacekeepers. In July 1995, Bosnian Serb forces overran the town and killed about 8,000 Muslim men and boys. The peacekeepers were too weak to resist. This shows that the UN lacked the will and force to deal with the conflict.","w":["Do not describe the conflicts or pre-WWI Balkans — assess intervention."]},{"id":"2024-7","t":["soc","sea"],"type":"select","q":"‘In the second half of the 20th century, inter-governmental organisations made continuous efforts to address regional and international problems.’ Select one of the following to elaborate on this statement. (i) The Association of Southeast Asian Nations – political and economic problems (ii) The United Nations – population and resources problems","kw":["continuous efforts","inter-governmental organisations","Select one"],"focus":"Show efforts CONTINUING over stages (not one-off), addressing specific problems.","b":[["(i) ASEAN",["Problems: communist threat, regional instability, disputes, uneven development","1967 Bangkok Declaration; 1971 ZOPFAN; 1976 Bali Treaty of Amity; united stand on Cambodia 1979-91","Economic: PTA 1977, AFTA 1992, expansion to ten members, ASEAN+3 after 1997 crisis"]],["(ii) UN",["Problems: population explosion, ageing, food shortage, uneven resources","1960s: WFP 1961, FAO; UNFPA 1969","1970s: World Population Conference 1974; UNEP 1972","1980s-90s: 1984 Mexico, 1994 Cairo; Earth Summit 1992; Madrid Plan on ageing (2002 beyond)"]]],"s":[["Introduction","Name choice; state the continuous efforts."],["Body 1 · Problem and early efforts",""],["Body 2 · Middle stage",""],["Body 3 · Later efforts",""],["Conclusion","Continuity shown?"]],"g":["Is your organisation inter-governmental? (ASEAN and UN are; Oxfam is not.)","What problems did it face in different decades?","What efforts did it make in each stage? Show they continued over time.","What were the results of these efforts?"],"ei":"In the second half of the 20th century, ASEAN made continuous efforts to address political and economic problems in Southeast Asia. From its formation in 1967, it tried to reduce the communist threat and regional conflicts, and from the 1970s to the 1990s it developed economic cooperation, expanded its membership and responded to the Asian Financial Crisis.","ep":"In the 1990s, ASEAN continued its efforts by focusing on economic problems. In 1992, members agreed to set up the ASEAN Free Trade Area, aiming to cut tariffs on most goods to 0-5% within 15 years. After the Cold War, ASEAN also admitted Vietnam (1995), Laos and Myanmar (1997) and Cambodia (1999), reducing political divisions in the region. When the Asian Financial Crisis hit in 1997, ASEAN began cooperating with China, Japan and South Korea through ASEAN+3.","w":["Respond to ‘continuous efforts’; don't confuse IGOs with NGOs."]},{"id":"2025-1","t":["hke"],"type":"assess","q":"Assess the importance of the free trade policy and infrastructure development of Hong Kong in strengthening the connection between the Mainland and Hong Kong in the period 1978-97.","kw":["Assess the importance","free trade policy","infrastructure development","connection","1978-97"],"focus":"Explain how free trade and infrastructure strengthened economic, social and official connections, and judge how important they were.","b":[["Free trade policy",["No tariffs → HK as re-export centre for China","GATT membership (1986) as separate customs territory","Modern banking system for Mainland investment"]],["Infrastructure",["KCR through-train resumed (1979), electrification","China Ferry Terminal, new airport, highways","More border checkpoints (Lok Ma Chau)","Dongjiang water supply agreements"]],["Other factors",["Reform and Opening-up, SEZs (Shenzhen 1980)","Joint Declaration 1984"]]],"s":[["Introduction",""],["Body 1 · Economic connection via free trade",""],["Body 2 · People's interaction via infrastructure",""],["Body 3 · Official cooperation",""],["Body 4 · Other factors",""],["Conclusion",""]],"g":["What does ‘connection’ mean? Economic, social, official?","How did no tariffs help re-export China goods?","Which transport projects linked HK and the Mainland?","Would these matter without Reform and Opening-up?"],"ei":"Between 1978 and 1997, Hong Kong's free trade policy and infrastructure development were important in strengthening its connection with the Mainland, economically, socially and officially. However, their importance depended on China's Reform and Opening-up.","ep":"Infrastructure development increased interaction between people of the two places. In 1979, the KCR resumed its through-train service to Guangzhou, and the line was electrified in 1983. More border checkpoints were opened, such as Lok Ma Chau in 1989, and the China Ferry Terminal opened in 1988. Cross-border passenger trips rose sharply, and many Hong Kong people travelled to invest, work or visit relatives. These transport links strengthened social and economic connections between Hong Kong and the Mainland.","w":["Use concrete examples within 1978-97.","Don't just narrate Reform and Opening-up."]},{"id":"2025-2","t":["cn2"],"type":"examine","q":"From economic perspectives, examine the continuous efforts made by China to develop socialism in the period 1953-78.","kw":["economic perspectives","continuous efforts","develop socialism","1953-78"],"focus":"Show that China kept trying to build a socialist economy throughout 1953-78, and explain the features of each stage — ending with the 1978 turn towards ‘socialism with Chinese characteristics’.","b":[["1953-57 · Soviet-style construction",["First Five-Year Plan: 156 Soviet-aided projects, priority to heavy industry","Socialist transformation: agricultural cooperatives, nationalisation of private business by 1956","Planned economy under central control"]],["1958-60 · Three Red Banners",["General Line for socialist construction; Great Leap Forward (steel targets, backyard furnaces)","People's communes: collective ownership and communal life","Result: famine and economic collapse"]],["1961-65 · Readjustment",["Liu Shaoqi and Deng Xiaoping allowed private plots and material incentives","Agriculture and light industry recovered"]],["1966-76 · Cultural Revolution",["Politics in command; ‘learn from Dazhai in agriculture, Daqing in industry’","Third Front industrialisation in inland provinces","Economy disrupted but some growth in heavy industry"]],["1976-78 · Turning point",["Zhou Enlai's Four Modernisations revived","Third Plenary Session of the 11th Central Committee (Dec 1978): Reform and Opening-up"]]],"s":[["Introduction","Define socialism in economic terms (public ownership, planning). State that China kept adjusting its methods in several stages, always aiming at a socialist economy."],["Body 1 · 1953-57","First Five-Year Plan and socialist transformation."],["Body 2 · 1958-60","Three Red Banners: a faster, mass-mobilisation road to socialism."],["Body 3 · 1961-65","Readjustment: pragmatic corrections within socialism."],["Body 4 · 1966-78","Cultural Revolution models, then the Four Modernisations and the 1978 Third Plenum."],["Conclusion","Stress continuity of the goal and change of methods across the stages."]],"g":["What does ‘socialism’ mean in economic terms?","What did the First Five-Year Plan focus on, and who helped?","How were the Three Red Banners different from the Soviet model?","Why did the government readjust after 1960?","Why is the Third Plenum of 1978 a key moment?","Are you examining ‘efforts’ rather than describing political struggles?"],"ei":"Between 1953 and 1978, China made continuous efforts to build a socialist economy based on public ownership and state planning. It first followed the Soviet model, then tried the faster mass-mobilisation road of the Three Red Banners, readjusted in the early 1960s, and finally, after the Cultural Revolution, turned towards Reform and Opening-up in 1978.","ep":"The first effort was Soviet-style socialist construction in 1953-57. Under the First Five-Year Plan, China built 156 major projects with Soviet aid, focusing on steel, coal and machinery. At the same time, the government carried out socialist transformation: by 1956 most peasants had joined agricultural cooperatives and private businesses had become joint state-private enterprises. Industrial output grew by about 18% a year. These measures laid the foundation of a planned, publicly owned economy, which was the core of socialism.","w":["Do not stop at the Five-Year Plans — cover the whole period.","Do not drift into political movements without linking them to the economy."]},{"id":"2025-3","t":["jp"],"type":"agree","q":"‘The internal conditions in Japan were more important than international circumstances in intensifying the military expansion of Japan in the period 1931-41.’ Comment on the validity of this statement. Explain your answer.","kw":["more important","internal conditions","international circumstances","intensifying the military expansion","1931-41"],"focus":"Compare internal and international factors in intensifying expansion — use examples of expansion (Manchuria 1931, China 1937, Southeast Asia 1940-41, Pearl Harbor).","b":[["Internal conditions",["Decline of party politics after May 15 Incident 1932","Extreme nationalist societies; army's independence","Depression → need for resources and markets","February 26 Incident 1936 → military control of cabinet"]],["International circumstances",["League of Nations ineffective over Manchuria; Japan left 1933","Rise of Nazi Germany: Anti-Comintern Pact 1936, Tripartite Pact 1940","Instability and division in China","Fall of France/Netherlands 1940 → opportunity in SE Asia","US oil embargo 1941 → decision for war"]]],"s":[["Introduction","Stand: internal conditions created the drive; international circumstances gave opportunities and shaped timing."],["Body 1 · Internal: political","Militarists controlled government."],["Body 2 · Internal: economic","Depression and resources."],["Body 3 · International: weak restraint","League, appeasement."],["Body 4 · International: opportunities","Germany's victories, China's division, US embargo."],["Conclusion","Weigh."]],"g":["Which internal changes put militarists in control?","Why did the League fail to stop Japan?","How did Germany's victories in Europe open Southeast Asia?","Did the US embargo push Japan to expand further?","Are you linking each factor to a specific act of expansion?"],"ei":"The statement is largely valid. Internal conditions in Japan, such as the decline of party politics and the economic crisis, created a strong drive for expansion. International circumstances, like the weakness of the League and Germany's success in Europe, provided opportunities, but they only intensified an expansion that internal forces had already started.","ep":"International circumstances gave Japan opportunities to intensify expansion. In 1940, Germany defeated France and the Netherlands, leaving their colonies in Indochina and the East Indies weakly defended. Japan moved into northern Indochina in 1940 and southern Indochina in 1941, and signed the Tripartite Pact with Germany and Italy. However, these moves were based on Japan's internal need for oil and rubber, which shows that international events mostly shaped the timing.","w":["Use examples of military expansion, not only reasons for militarism."]},{"id":"2025-4","t":["ww"],"type":"analyse","q":"Analyse the political, economic and territorial threats to Europe in the 1930s, and discuss whether these threats were resolved after the Second World War. Explain your answer with reference to the historical development during the 1930s and the 1940s.","kw":["political, economic and territorial threats","1930s","resolved after the Second World War","1940s"],"focus":"Part 1: analyse each threat in the 1930s. Part 2: assess whether each was resolved in the 1940s. Don't confuse political and territorial threats.","b":[["Political threats (1930s)",["Ideological conflict: fascism vs democracy vs communism","Arms race and rearmament"]],["Economic threats (1930s)",["Great Depression; unemployment; protectionism and autarky"]],["Territorial threats (1930s)",["German expansion: Rhineland, Austria, Sudetenland, Poland; Italy in Abyssinia"]],["Resolved?",["Resolved: Fascism defeated; wartime conferences (Yalta, Potsdam) settled borders; Paris Peace Treaties 1947; Marshall Plan and OEEC revived economies","Not resolved: new ideological conflict USSR vs West; nuclear arms race (Soviet bomb 1949); Europe divided — Berlin Blockade 1948-49; Eastern Europe under Soviet control"]]],"s":[["Introduction","State the three threats and judgement: partly resolved — fascism and Depression-era problems ended, but new ideological and military threats emerged."],["Body 1 · Political threat and its fate","1930s ideology/arms → 1940s Cold War."],["Body 2 · Economic threat and its fate","Depression → Marshall Plan."],["Body 3 · Territorial threat and its fate","Nazi expansion → Potsdam borders; Soviet sphere."],["Conclusion","Overall assessment."]],"g":["Which threats were political vs territorial?","Which threats disappeared by 1949?","What new threats replaced the old ones?","Was Europe safer in 1949 than in 1939?"],"ei":"In the 1930s, Europe faced political threats from ideological conflict and rearmament, economic threats from the
