<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Paper 2 Essay Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* One bright, friendly look on purpose (light only). */
:root{
  color-scheme:light;
  --bg:#f1f6ff; --surface:#ffffff; --soft:#f6f8fd; --ink:#1e2345; --muted:#5d6488; --line:#dfe5f3;
  --accent:#ff5f45; --accent-2:#3b6cff; --sun:#ffd23f; --mark:#ffe766; --mint:#20c08f; --warn:#ff7a45; --warn-soft:#fff0e8;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --c:var(--accent-2);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.6 var(--body);
  background:var(--bg) radial-gradient(circle at 8% 0%,#ffe9a8 0,transparent 32%) no-repeat,
             radial-gradient(circle at 100% 12%,#cfe0ff 0,transparent 30%) no-repeat;background-color:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:22px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
h1,h2,h3{text-wrap:balance;font-family:var(--display)}
mark{background:var(--mark);color:var(--ink);padding:0 .2em;border-radius:6px;box-shadow:0 2px 0 #f2c800}
svg.i{width:1em;height:1em;flex:none}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;
  background:linear-gradient(120deg,#3b6cff 0%,#7b5cff 55%,#ff5f9e 100%);color:#fff;border-radius:26px;padding:22px 26px;box-shadow:0 10px 30px -12px #3b6cff88}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.logo{width:68px;height:68px;flex:none;background:#fff;border-radius:20px;display:grid;place-items:center;box-shadow:0 6px 0 #00000022;transform:rotate(-6deg)}
.logo svg{width:52px;height:52px}
.brand .eyebrow{font:700 12.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.brand h1{font:700 clamp(28px,5vw,42px)/1.05 var(--display);margin:6px 0 4px}
.brand p{margin:0;opacity:.95;max-width:56ch;font-size:15px}
.stat{background:#ffffff26;border:2px solid #ffffff55;border-radius:18px;padding:10px 16px;text-align:center;font:700 13px/1.2 var(--body)}
.stat b{display:block;font:700 30px/1 var(--display);color:var(--sun)}

/* topics */
.themes{display:grid;gap:22px;margin-top:26px}
.theme h2{display:flex;align-items:center;gap:8px;font:600 15px/1.2 var(--display);color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.theme h2 .pill{white-space:nowrap;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.topic{--c:#3b6cff;display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.topic:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 0 -2px color-mix(in srgb,var(--c) 35%,transparent)}
.topic[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 6px 0 -1px var(--c)}
.ticon{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c)}
.ticon svg{width:30px;height:30px}
.topic .tname{display:block;font:600 16.5px/1.2 var(--display)}
.topic .tmeta{display:inline-block;margin-top:5px;font:800 12px/1 var(--body);color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:999px;padding:4px 9px}
.allbtn{justify-self:start;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-weight:800;font-size:14px}
.allbtn[aria-pressed="true"]{background:var(--accent)}

/* list */
.listhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 14px}
.listhead h2{display:flex;align-items:center;gap:10px;font:700 26px/1.2 var(--display);margin:0}
.listhead h2 .ticon{width:42px;height:42px;border-radius:13px}
.listhead h2 .ticon svg{width:24px;height:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);font:inherit;font-size:14.5px;min-width:0}
.filters input{width:230px;max-width:100%}
.qlist{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.qrow{--c:#3b6cff;display:grid;grid-template-columns:86px 1fr;gap:16px;align-items:start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:transform .15s,border-color .15s}
.qrow:hover{transform:translateX(4px);border-color:var(--c)}
.qcode{display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border-radius:14px;padding:8px 4px;font:800 12px/1.2 var(--body)}
.qcode b{display:block;font:700 22px/1.05 var(--display)}
.qtext{font:600 16.5px/1.5 var(--body)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font:800 11.5px/1 var(--body);border-radius:999px;padding:5px 10px;background:var(--soft);color:var(--muted)}
.tag.type{background:#e8eeff;color:var(--accent-2)}
.tag.done{background:#dcf7ec;color:#0f8a63}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);background:var(--surface)}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);font-weight:800;margin-bottom:16px}
.paper{--c:#3b6cff;position:relative;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px 26px;overflow:hidden}
.paper::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.qhead .ticon{width:44px;height:44px;border-radius:14px}
.qhead .ticon svg{width:26px;height:26px}
.yr{font:700 20px/1 var(--display)}
.tchip{font:800 12px/1 var(--body);color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:999px;padding:5px 10px}
.paper .qtext{font:600 21px/1.5 var(--body)}
.focus{display:flex;gap:12px;margin-top:18px;padding:14px 16px;background:#fff8d6;border:2px solid #ffe27a;border-radius:16px;font-size:15px}
.focus .ic{font-size:24px;line-height:1;color:#e0a800}
.focus b{display:block;font:600 14px/1.2 var(--display);margin-bottom:4px}
.typetip{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14.5px;color:var(--muted)}
.typetip strong{color:var(--accent-2)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 6px}
.step{display:flex;align-items:center;gap:10px;font:700 14px/1.2 var(--body);color:var(--muted);padding:10px 12px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.step .n{font:700 15px/1 var(--display);width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--soft)}
.step.on{color:var(--ink);border-color:var(--mint);background:#effcf6}
.step.on .n{background:var(--mint);color:#fff}
.step.locked{opacity:.6}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px 24px;margin-top:14px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.phead .pi{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff}
.phead .pi svg{width:24px;height:24px}
.phead h3{font:700 21px/1.2 var(--display);margin:0}
.phead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.bcard{border-radius:16px;padding:14px 16px;background:var(--soft);border:2px solid var(--line)}
.bcard:nth-child(4n+1){background:#fff4ef;border-color:#ffd9cc}
.bcard:nth-child(4n+2){background:#eef4ff;border-color:#d3e0ff}
.bcard:nth-child(4n+3){background:#ecfbf4;border-color:#c9f0dd}
.bcard:nth-child(4n+4){background:#f6f0ff;border-color:#e2d4ff}
.bcard h4{margin:0 0 6px;font:600 15.5px/1.3 var(--display)}
.bcard ul{margin:0;padding-left:18px}
.bcard li{margin:3px 0;font-size:14.5px}
.outline{list-style:none;margin:0;padding:0;counter-reset:o;display:grid;gap:8px}
.outline li{counter-increment:o;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--soft)}
.outline li::before{content:counter(o);font:700 15px/1 var(--display);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--accent-2);color:#fff}
.outline li:first-child::before,.outline li:last-child::before{background:var(--accent)}
.outline .h{font-weight:800}
.outline .d{color:var(--muted);font-size:14.5px}
.peel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.peel span.p{font:800 13px/1 var(--body);color:#fff;border-radius:999px;padding:6px 11px}

.guides{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guides label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);cursor:pointer;transition:border-color .15s,background .15s}
.guides label:hover{border-color:var(--accent-2)}
.guides input{margin-top:3px;accent-color:var(--mint);width:20px;height:20px;flex:none}
.guides input:checked + span{color:var(--muted);text-decoration:line-through}
.bar{height:10px;border-radius:999px;background:var(--soft);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#8be36c);border-radius:999px;transition:width .3s}
.progress{font:800 13px/1 var(--body);color:var(--muted);margin-top:8px}

.sample{font:400 16.5px/1.7 var(--body);background:#f4f7ff;border-left:6px solid var(--accent-2);border-radius:12px;padding:14px 16px;margin:0}
.sample.body{border-left-color:var(--mint);background:#effbf6}
.slabel{display:inline-block;font:600 14px/1 var(--display);background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;margin:18px 0 10px}
.slabel:first-of-type{margin-top:0}
.warns{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.warns li{background:var(--warn-soft);border:2px solid #ffd2bd;border-radius:14px;padding:10px 12px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.warns li svg{width:22px;height:22px;color:var(--warn);flex:none}

.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--accent);color:#fff;border-radius:999px;padding:12px 22px;font:700 16px/1 var(--display);box-shadow:0 5px 0 #d13d26;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d13d26}
.hint{font-size:14px;color:var(--muted)}
.cheer{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:#effcf6;color:#0f7a57;font-weight:800}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.qnav button{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 16px;text-align:left;max-width:48%;min-width:0;font:700 16px/1.2 var(--display)}
.qnav button:hover{border-color:var(--accent-2)}
.qnav small{display:block;font:800 11.5px/1.3 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.foot{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:600px){
  .wrap{padding-inline:16px}
  .top{padding:18px;border-radius:22px}
  .logo{width:54px;height:54px;border-radius:16px}.logo svg{width:40px;height:40px}
  .qrow{grid-template-columns:64px 1fr;gap:12px;padding:12px}
  .qcode b{font-size:18px}
  .paper,.panel{padding:18px 16px;border-radius:20px}
  .paper .qtext{font-size:18.5px}
  .steps{grid-template-columns:1fr}
  .qnav button{max-width:100%;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
const QS=[{"id":"2012-1","t":["hkp"],"type":"agree","q":"Do you agree that there was increasing political participation on the part of the Chinese in Hong Kong in the period 1960-97? Explain your answer.","kw":["increasing","political participation","Chinese","1960-97"],"focus":"Show a trend over time. Divide 1960-97 into stages and compare how far the Chinese took part in politics in each stage.","b":[["Stage 1: 1960-67 (very limited)",["LegCo and ExCo fully appointed; only a few Chinese elites (e.g. Kan Yuet-keung) sat as unofficial members","Urban Council had only a few elected seats with a tiny electorate","Most Chinese were politically apathetic refugees focused on survival"]],["Stage 2: 1967-84 (consultative participation)",["1967 Riots showed alienation; government set up City District Officers (1968) and Mutual Aid Committees (1973)","More Chinese appointed to LegCo; pressure groups (e.g. Heung Yee Kuk, Professional Teachers' Union, anti-corruption campaigns) grew","1982 first District Board elections: first real territory-wide elections for ordinary citizens"]],["Stage 3: 1984-97 (rapid increase)",["Sino-British Joint Declaration 1984 promised elected legislature; 1985 indirect elections (functional constituencies, electoral college)","1991 first direct elections to LegCo (18 seats); rise of parties such as United Democrats, DAB, Liberal Party","Basic Law Drafting and Consultative Committees included many HK Chinese","Patten reforms 1995: widened franchise; Provisional Legislative Council 1997"]],["Limits (balance)",["Governor still held final power; Chinese never controlled the executive before 1997","Participation often elite or consultative rather than mass democratic"]]],"s":[["Introduction","Define ‘political participation’ (voting, holding office, being consulted, forming parties, lobbying). State your stand: participation increased, slowly at first then rapidly after 1984."],["Body 1 · 1960-67","Very limited participation: appointed councils, tiny electorate, political apathy."],["Body 2 · 1967-84","Increase through consultation and local bodies: CDOs, MACs, District Boards 1982."],["Body 3 · 1984-97","Sharp increase: LegCo indirect then direct elections, parties, Basic Law consultation."],["Body 4 · Limits","Show balance: colonial executive-led system remained; participation uneven."],["Conclusion","Confirm the trend (increasing, with 1967 and 1984 as turning points) and weigh how far it went."]],"g":["What counts as ‘political participation’? List at least four forms.","What changed after the 1967 Riots in how the government connected with the Chinese?","Which year do you think marks the biggest jump in participation, and why?","How did the Joint Declaration and the Basic Law open new channels for the Chinese?","Can you find one piece of evidence that participation stayed limited even in the 1990s?","Does your conclusion compare the stages, rather than just list events?"],"ei":"Political participation refers to the ways ordinary people take part in public affairs, such as voting, serving on councils, being consulted and forming political groups. From 1960 to 1997, the political participation of the Chinese in Hong Kong clearly increased. It was very limited before 1967, grew through consultative channels from 1967 to 1984, and expanded rapidly after the Sino-British Joint Declaration in 1984. However, the colonial executive-led system meant that this participation still had limits.","ep":"After the Joint Declaration of 1984, Chinese participation increased sharply. The 1984 White Paper introduced indirect elections, so in 1985 twenty-four LegCo seats were returned by functional constituencies and an electoral college. In 1991, eighteen seats were directly elected for the first time, and political parties such as the United Democrats and later the DAB were formed to compete for them. Compared with the 1960s, when LegCo was fully appointed and only a handful of Chinese elites were consulted, ordinary Chinese could now vote for their legislators and join parties. This shows that participation had moved from elite consultation to mass electoral participation.","w":["Do not narrate the whole 20th century — stay within 1960-97.","You must divide the period into stages and compare them; a chronological list will not score well.","Focus on ‘political participation’, not general political development."]},{"id":"2012-2","t":["cn1"],"type":"compare","q":"Compare the 1911 Revolution and the May Fourth Movement in terms of their impact on China's historical development.","kw":["Compare","1911 Revolution","May Fourth Movement","impact"],"focus":"Point-by-point comparison of the two events' impact, using common criteria (political, ideological, social, long-term).","b":[["Similarities",["Both introduced Western ideas (republicanism; science and democracy)","Both anti-traditional and patriotic","Both had limited immediate success"]],["Differences: nature/level",["1911: political change — ended 2,000 years of monarchy, set up a republic","May Fourth: ideological/cultural change — attacked Confucianism, vernacular literature (Hu Shi, Lu Xun)"]],["Differences: long-term impact",["1911 led to warlordism and political chaos","May Fourth spread Marxism → founding of CCP 1921; KMT reorganisation; rise of mass nationalism"]]],"s":[["Introduction","State criteria and overall judgement (e.g. 1911 changed the system; May Fourth changed minds and shaped the rest of the century)."],["Body 1 · Criterion: political impact","Compare both."],["Body 2 · Criterion: ideological/cultural impact","Compare both."],["Body 3 · Criterion: social impact/participation","Compare both."],["Body 4 · Criterion: long-term impact","Compare both."],["Conclusion","Overall comparison."]],"g":["What criteria will you use to compare? Keep them the same for both events.","Which event changed China's political system? Which changed its thinking?","Who took part in each — elites or the masses?","Which event had longer-lasting effects? Why?","Does every paragraph mention BOTH events?"],"ei":"The 1911 Revolution and the May Fourth Movement both brought Western ideas into China and aimed to save the nation. However, the 1911 Revolution mainly transformed China politically by ending the monarchy, while the May Fourth Movement transformed Chinese thought and paved the way for communism and mass nationalism.","ep":"In terms of political impact, the 1911 Revolution was more direct than the May Fourth Movement. The 1911 Revolution overthrew the Qing dynasty and ended over 2,000 years of imperial rule, establishing the Republic of China in 1912. The May Fourth Movement, by contrast, did not change the political system, although it forced the Beijing government to dismiss pro-Japanese officials and refuse to sign the Treaty of Versailles. Therefore, the 1911 Revolution had a greater immediate political impact.","w":["No separate accounts — compare in every paragraph.","Focus on impact on China's development, not causes."]},{"id":"2012-3","t":["jp"],"type":"extent","q":"To what extent was Japan modernised by the late 1920s? Explain your answer.","kw":["To what extent","modernised","by the late 1920s"],"focus":"Weigh modernisation achievements against surviving traditions, up to about 1929 only.","b":[["Political modernisation",["Meiji Constitution 1889; Diet","Party politics: Hara Takashi's party cabinet 1918","Universal Manhood Suffrage Act 1925"]],["Economic modernisation",["Industrialisation; WWI boom; zaibatsu (Mitsui, Mitsubishi)","Railways, shipping, heavy industry"]],["Diplomatic/military modernisation",["Anglo-Japanese Alliance 1902; victory over Russia 1905","Equal treaties 1911; Washington Conference 1921-22; Shidehara diplomacy"]],["Social/cultural",["Compulsory education; Western dress and cities (Taisho culture)"]],["Tradition remained",["Emperor sacred, army answerable to emperor, genro","Peace Preservation Law 1925; bushido, Shinto","Rural poverty, dual economy"]]],"s":[["Introduction","Stand: to a large extent modernised in economy and institutions, but political and social modernisation remained incomplete."],["Body 1 · Political","Constitution, party cabinets, suffrage — and limits."],["Body 2 · Economic","Industrialisation and zaibatsu; dual economy."],["Body 3 · Diplomatic/military","Great-power status, cooperation diplomacy."],["Body 4 · Traditions","Emperor worship, military independence, repression."],["Conclusion","Weigh overall extent."]],"g":["Which modern institutions existed by 1929?","Was Japan a great power by 1920? What proves it?","Which traditional elements still controlled politics?","Why do the traditions matter for what happened in the 1930s? (Mention briefly only.)","Did you stay before 1930?"],"ei":"By the late 1920s, Japan had been modernised to a large extent. It had a constitution, party governments, universal male suffrage, a strong industrial economy and great-power status. However, modernisation was incomplete, because the emperor system, the independence of the military and traditional values continued to limit democracy.","ep":"Politically, Japan was modernised to a considerable extent by the 1920s. In 1918, Hara Takashi formed the first true party cabinet, and in 1925 the Universal Manhood Suffrage Act increased the electorate from about 3 million to 12.5 million. However, the same year the Peace Preservation Law was passed to suppress communists and radicals, and the army and navy ministers still reported directly to the emperor. Therefore, political modernisation was real but limited.","w":["Present both modernisation and tradition in balance.","Don't write at length about the 1930s."]},{"id":"2012-4","t":["ww"],"type":"agree","q":"‘The Paris Peace Settlement (1919-23) was meant to preserve peace; unfortunately, it became an important factor that caused another world war.’ Do you agree? Explain your answer.","kw":["meant to preserve peace","important factor","another world war"],"focus":"Two parts: (1) Was the Settlement designed to preserve peace? (2) Did it become an important cause of WWII? Cover all treaties, not just Versailles.","b":[["Part 1 · Meant to preserve peace",["League of Nations and collective security (Covenant in every treaty)","Disarmament of Germany; demilitarised Rhineland","Self-determination: new states (Poland, Czechoslovakia, Yugoslavia)","But also to punish/weaken Germany (war guilt, reparations) — revenge motive"]],["Part 2 · Became a cause of WWII",["German resentment: ‘diktat’, war guilt, lost land → Hitler's appeal","Italy's ‘mutilated victory’ → Mussolini","Weak new states and minorities (Sudeten Germans) → Hitler's claims","League weak without US"]],["Other factors",["Great Depression","Appeasement","Aggression of dictators"]]],"s":[["Introduction","Stand: agree the aim was largely peace (with punitive elements), and it became an important — but not the only — cause of WWII."],["Body 1 · Aims: preserving peace","League, disarmament, self-determination."],["Body 2 · Aims: punishment weakened the peace","Harshness shows mixed aims."],["Body 3 · How it contributed to WWII","Resentment, revisionism, weak new states."],["Body 4 · Other factors","Depression, appeasement — the Settlement was important but not sufficient."],["Conclusion","Answer both parts."]],"g":["What features of the treaties were designed to prevent war?","Were any terms designed for revenge rather than peace?","How did Hitler use the Treaty of Versailles in propaganda?","Which other treaties (St Germain, Trianon) created problems?","Would WWII have happened without the Depression?"],"ei":"The Paris Peace Settlement was intended mainly to preserve peace through the League of Nations, disarmament and self-determination, although it also aimed to punish Germany. Unfortunately, its harsh and unfair terms created resentment and unstable new states, which made it an important factor in causing the Second World War, together with the Great Depression and appeasement.","ep":"The Settlement became an important cause of war because it created German resentment. Under the Treaty of Versailles, Germany lost 13% of its territory, accepted the war-guilt clause and was ordered to pay 6,600 million pounds in reparations. Germans called it a ‘diktat’. Hitler promised to tear up the treaty, and after 1933 he rearmed Germany (1935) and remilitarised the Rhineland (1936). Each step toward war was justified as undoing Versailles, showing how the Settlement fed aggression.","w":["Discuss the purpose, not just the result.","Don't limit to the Treaty of Versailles."]},{"id":"2012-5","t":["eco"],"type":"trace","q":"Trace and explain the process of European economic integration in the period 1948-2000.","kw":["Trace and explain","European economic integration","1948-2000"],"focus":"Periodise integration in BOTH Western and Eastern Europe; explain why each stage developed as it did.","b":[["1948-57 · Beginnings",["West: OEEC 1948 (Marshall Plan); Benelux; ECSC 1951 (Schuman Plan)","East: Comecon 1949 (Soviet response)","Why: post-war ruin, US aid, Franco-German reconciliation, Cold War"]],["1957-73 · Common market",["EEC and Euratom 1957 (Treaty of Rome); customs union completed 1968; CAP","EFTA 1960 as British alternative","Comecon: ‘socialist division of labour’ under Soviet dominance","Why: growth; de Gaulle's vetoes on UK 1963, 1967"]],["1973-86 · Enlargement and slowdown",["UK, Ireland, Denmark 1973; Greece 1981; Spain, Portugal 1986","Oil crises, ‘Eurosclerosis’; EMS 1979"]],["1986-2000 · Deepening to the EU",["Single European Act 1986 → single market 1993","Maastricht Treaty 1992 → EU; euro 1999","Comecon dissolved 1991; Eastern states apply to EU","Why: global competition, end of Cold War"]]],"s":[["Introduction","Overall: from post-war cooperation to deep integration in the West; Soviet-led cooperation in the East collapsed in 1991."],["Body 1 · 1948-57",""],["Body 2 · 1957-73",""],["Body 3 · 1973-86",""],["Body 4 · 1986-2000",""],["Conclusion",""]],"g":["What are the turning points (1957, 1973, 1986/1992)?","What was happening in Eastern Europe at each stage?","Why did integration slow in the 1970s?","Why did it speed up after 1986?"],"ei":"European economic integration from 1948 to 2000 developed in stages: from post-war recovery cooperation, to a common market, to enlargement, and finally to the European Union with a single currency. In Eastern Europe, Soviet-led integration under Comecon collapsed with the end of the Cold War.","ep":"From 1957 to 1973, integration in Western Europe moved from limited sectoral cooperation to a common market. In 1957, the six members of the ECSC signed the Treaty of Rome, creating the EEC. Tariffs between members were abolished by 1968 and a common external tariff was set up. The Common Agricultural Policy began in 1962. This happened because the success of the ECSC and rapid economic growth encouraged members to go further. In the East, meanwhile, Comecon promoted specialisation among communist states but under Soviet control.","w":["Don't neglect Eastern Europe.","Divide into stages and explain changes."]},{"id":"2012-6","t":["mc"],"type":"relimp","q":"Assess the importance of Nelson Mandela relative to other factors in leading to the end of the apartheid in South Africa.","kw":["Assess the importance","Nelson Mandela","relative to other factors","end of the apartheid"],"focus":"Discuss Mandela in depth first, then other factors, then compare their importance.","b":[["Nelson Mandela",["ANC leader; Defiance Campaign 1952; Freedom Charter 1955","Armed struggle (Umkhonto we Sizwe 1961); Rivonia Trial 1964 made him a symbol","27 years in prison → international ‘Free Mandela’ campaign","Negotiated with de Klerk after release 1990; reconciliation; elected president 1994"]],["Other factors",["ANC and mass resistance: Sharpeville 1960, Soweto 1976, UDF 1980s, strikes","International pressure: UN arms embargo 1977, sanctions (US 1986), sports boycott, disinvestment","Economic crisis in South Africa in the 1980s","De Klerk's reforms: unbanned ANC 1990, repealed apartheid laws 1991","End of Cold War removed ‘communist threat’ excuse"]]],"s":[["Introduction","Stand: Mandela was very important, especially in the negotiation stage, but internal resistance, international pressure and de Klerk's reforms were also necessary."],["Body 1 · Mandela as symbol and leader","Early resistance, trial, prison symbol."],["Body 2 · Mandela as negotiator","1990-94 negotiations, preventing civil war."],["Body 3 · Other factors","Mass resistance, sanctions, de Klerk, Cold War end."],["Body 4 · Weighing","Which factor forced the government to change; which shaped how apartheid ended."],["Conclusion",""]],"g":["What did Mandela do before, during and after prison?","Why did the government release Mandela in 1990?","How did sanctions affect South Africa's economy?","Why was de Klerk willing to reform?","Would apartheid have ended peacefully without Mandela?"],"ei":"Nelson Mandela was very important in ending apartheid in South Africa. He became a symbol of resistance and led the negotiations that brought peaceful change. However, mass resistance, international pressure and de Klerk's reforms were also essential, and Mandela's influence depended on them.","ep":"Mandela was most important during the negotiation stage from 1990 to 1994. After his release in February 1990, he led the ANC in talks with de Klerk's government. When violence threatened the talks, such as after the assassination of Chris Hani in 1993, Mandela appealed for calm on national television. His commitment to reconciliation helped secure the 1994 elections, in which he became the first black president. Without his leadership, the end of apartheid might have involved civil war.","w":["Discuss Mandela in enough depth before moving to other factors.","Compare relative importance."]},{"id":"2012-7","t":["x"],"type":"select","q":"Select any one country within your history course, and discuss why it could be regarded as a ‘power’ in the second half of the 20th century.","kw":["one country","‘power’","second half of the 20th century"],"focus":"First define ‘power’ with criteria (military, economic, diplomatic, soft power), then prove your country meets them in 1950-2000.","b":[["Criteria of a power",["Military strength","Economic strength","Diplomatic influence","Soft power (culture)"]],["Example: Japan",["Economic: world's second largest economy by 1968; leading car/electronics exporter","Diplomatic: G7 member 1975; biggest ODA donor by 1989; UN funding","Soft power: anime, Sony Walkman","Limit: military restricted by Article 9"]],["Example: USA / USSR / China",["USA: superpower in all four","China: nuclear power 1964, UN permanent seat 1971, reform growth"]]],"s":[["Introduction","Define power; name country."],["Body 1 · Economic",""],["Body 2 · Diplomatic",""],["Body 3 · Military",""],["Body 4 · Soft power",""],["Conclusion",""]],"g":["What makes a country a ‘power’?","Which criteria does your country meet?","Is there any weakness in its power?"],"ei":"A ‘power’ is a country with strong influence in the world through its economic, military, diplomatic or cultural strength. Japan could be regarded as a power in the second half of the 20th century mainly because of its economic strength and diplomatic influence, although its military power was limited.","ep":"Japan was an economic power. After the ‘economic miracle’ of the 1950s-60s, Japan's GNP became the second largest in the non-communist world in 1968. Japanese companies such as Toyota and Sony dominated world markets, and by the 1980s Japan was the world's largest creditor nation. Its economic strength gave it great international influence.","w":["Define ‘power’ clearly; don't just narrate the country's modernisation."]},{"id":"2013-1","t":["hkp"],"type":"agree","q":"‘Hong Kong’s political development in the period 1980-2000 was primarily shaped by the China factor.’ Do you agree? Explain your view.","kw":["primarily","China factor","political development","1980-2000"],"focus":"Weigh the China factor against other factors (British policy, local society) to decide whether China was the main force shaping HK politics in 1980-2000.","b":[["China factor",["Reform and Opening-up and PRC's decision to recover sovereignty led to Sino-British talks (1982-84)","Joint Declaration 1984: ‘one country, two systems’, 50 years unchanged","Basic Law drafted 1985-90 under PRC leadership; set the post-1997 political framework","June Fourth 1989 sparked mass protests and the rise of democrats","PRC rejected Patten reform: ‘through train’ derailed, Provisional LegCo set up 1996-97"]],["British factor",["Britain started representative government (1984 White Paper, 1985 indirect elections)","Patten's 1992 reforms widened functional constituencies","Britain's wish for an ‘honourable retreat’"]],["Hong Kong factors",["Rise of educated middle class demanding participation","Growth of HK identity; formation of parties (Meeting Point, United Democrats, DAB, Liberal Party)"]]],"s":[["Introduction","Define ‘China factor’. Stand: agree to a large extent — China set the framework; Britain and local society shaped the pace and detail."],["Body 1 · China set the framework","Sovereignty talks, Joint Declaration, Basic Law."],["Body 2 · China reacted to change","June Fourth; opposition to Patten; Provisional LegCo; HKSAR 1997-2000."],["Body 3 · Other factors","British reforms; middle class and parties."],["Body 4 · Weighing","Show that British and local factors worked within limits set by China (e.g. 1995 LegCo ended in 1997)."],["Conclusion","China was the primary factor because it decided the outcome; others influenced the process."]],"g":["What does ‘primarily’ ask you to do?","Which decisions about HK's political future were made in Beijing, and which in London?","Why could the 1995 LegCo not ‘ride the through train’ in 1997? What does this prove?","Which developments came mainly from HK society itself?","Are the other factors independent of China, or did they react to China?"],"ei":"The China factor refers to the policies and actions of the People's Republic of China that affected Hong Kong. Between 1980 and 2000, Hong Kong's political development was primarily shaped by the China factor. China's decision to recover sovereignty led to the Joint Declaration and the Basic Law, which set the framework of Hong Kong's political system. British policy and the rise of a local middle class also shaped the process, but they operated within the limits that China set.","ep":"The failure of Governor Patten's reforms shows that China was more decisive than Britain. In 1992, Patten widened the franchise of the nine new functional constituencies so that almost all working people could vote. Although the 1995 LegCo was elected under these rules, China condemned the reform as a breach of the Joint Declaration, withdrew the ‘through train’ arrangement and set up a Provisional Legislative Council. The 1995 LegCo therefore ended on 30 June 1997. Britain could start reforms, but China decided whether they survived, which shows that China was the primary factor.","w":["Keep to 1980-2000. Discussion of the 1960s-70s earns no marks.","Discuss other factors too, then compare — do not write only about China."]},{"id":"2013-2","t":["cn1"],"type":"trace","q":"Trace and explain the development of the communist revolution in China in the period 1919-49.","kw":["Trace and explain","communist revolution","1919-49"],"focus":"Periodise the communist revolution and describe + explain the features of each stage.","b":[["1919-27 Founding and First United Front",["May Fourth spread Marxism; CCP founded 1921 with Comintern help","Cooperation with KMT; urban labour movement","Ended with KMT purge 1927"]],["1927-37 Rural revolution and survival",["Nanchang Uprising; Jiangxi Soviet 1931; land reform","Encirclement campaigns; Long March 1934-35; Mao's leadership (Zunyi 1935)"]],["1937-45 Second United Front and expansion",["Anti-Japanese war; Yan'an base; guerrilla warfare; membership grew to 1.2 million"]],["1945-49 Civil War and victory",["Land reform won peasants; KMT corruption and inflation","Huaihai campaign; PRC 1949"]]],"s":[["Introduction","Overview: from a small urban party to national victory."],["Body 1 · 1919-27",""],["Body 2 · 1927-37",""],["Body 3 · 1937-45",""],["Body 4 · 1945-49",""],["Conclusion",""]],"g":["What turning points divide the stages?","What was the strategy in each stage — urban or rural?","Why did the CCP survive the 1930s?","Why did it win in 1949?"],"ei":"Between 1919 and 1949, the communist revolution in China grew from a small intellectual movement into a force that won national power. It went through four stages: founding and cooperation with the KMT, rural revolution, expansion during the Anti-Japanese War, and victory in the Civil War.","ep":"From 1927 to 1937, the communist revolution changed from an urban to a rural revolution. After Chiang Kai-shek's purge in 1927, urban uprisings failed, so Mao Zedong built a base in the countryside. The Jiangxi Soviet (1931) carried out land reform, which won peasant support. Although the KMT's fifth encirclement campaign forced the Long March, the CCP survived and Mao became leader at the Zunyi Conference in 1935.","w":["Present stages with characteristics, not just KMT-CCP relations."]},{"id":"2013-3","t":["sea"],"type":"agree","q":"‘Independence can be achieved only through conflicts and bloodshed.’ Is this statement applicable to the independence movements in Southeast Asia after the Second World War? Explain your view.","kw":["only through conflicts and bloodshed","independence movements","Southeast Asia","after the Second World War"],"focus":"Compare violent and peaceful paths to independence across several SE Asian countries, linking methods to outcomes.","b":[["Through conflict and bloodshed",["Indonesia: war against the Dutch 1945-49 (plus UN and US pressure)","Vietnam: First Indochina War, Dien Bien Phu 1954"]],["Through peaceful means",["Philippines: US granted independence 1946 as promised (Tydings-McDuffie Act)","Malaya: negotiations, Alliance Party, independence 1957","Burma: Aung San–Attlee agreement 1947, independence 1948","Singapore: self-government 1959, via Malaysia 1963, separation 1965"]],["Mixed cases",["Malaya fought the communist Emergency 1948-60, but independence came through negotiation"]]],"s":[["Introduction","Stand: not applicable — independence came through different methods; violence was only one path."],["Body 1 · Violent cases","Indonesia, Vietnam: how armed struggle produced independence."],["Body 2 · Peaceful cases","Philippines, Burma, Malaya: negotiations and constitutional steps."],["Body 3 · Mixed cases / role of outside pressure","Even violent cases needed diplomacy (UN in Indonesia; Geneva 1954)."],["Conclusion","The statement is too absolute."]],"g":["List SE Asian countries and how each became independent.","In Indonesia, was it war alone or also UN/US pressure?","Why did Britain and the US agree to peaceful transfer in some colonies?","Does the word ‘only’ make the statement easier to reject?"],"ei":"The statement is not applicable to all independence movements in Southeast Asia after the Second World War. Indonesia and Vietnam won independence through armed struggle, but the Philippines, Burma and Malaya gained independence mainly through negotiation and peaceful constitutional change.","ep":"The Philippines shows that independence could be achieved peacefully. Under the Tydings-McDuffie Act of 1934, the US had promised independence after a ten-year transition. Despite the Japanese occupation, the US kept its promise, and the Philippines became independent on 4 July 1946 without a war against the colonial power. This proves that bloodshed was not the only path.","w":["Link methods to how independence was actually achieved.","Don't write about reasons for decolonisation instead of methods."]},{"id":"2013-4","t":["ww"],"type":"agree","q":"Do you agree that the Paris Peace Conference (1919) created more problems than it solved? Explain your view with reference to the inter-war period (1919-39).","kw":["created more problems than it solved","inter-war period (1919-39)"],"focus":"Weigh problems solved vs problems created, using evidence across 1919-39.","b":[["Problems solved",["Ended WWI legally; peace treaties","Created League: settled Aaland Islands 1921, Greek-Bulgarian dispute 1925","Self-determination freed nations from empires","Reduced German military threat in the 1920s"]],["Problems created",["German resentment → Hitler","Reparations → hyperinflation 1923, Ruhr occupation","Minorities in new states (Sudetenland, Polish Corridor)","Italy and Japan dissatisfied","US absent from League; League weak (Manchuria, Abyssinia)"]]],"s":[["Introduction","Stand: agree — solved short-term problems but created long-term ones leading to 1939."],["Body 1 · Problems solved","League successes; self-determination."],["Body 2 · Problems created: Germany","Resentment, reparations."],["Body 3 · Problems created: new states and dissatisfied powers",""],["Body 4 · Comparison over time","1920s vs 1930s."],["Conclusion",""]],"g":["What problems existed in 1919 that the Conference aimed to solve?","Which problems did it solve in the 1920s?","Which new problems appeared later?","Are the created problems more serious than those solved?"],"ei":"The Paris Peace Conference solved some immediate problems, such as ending the war and creating an international peace-keeping body. However, it created more problems than it solved, as German resentment, reparations and minority issues eventually undermined peace by 1939.","ep":"The Conference solved the problem of the lack of an international peace-keeping organisation by creating the League of Nations. In the 1920s, the League settled several disputes, such as the Aaland Islands dispute between Sweden and Finland in 1921 and the Greek-Bulgarian border clash in 1925. However, the League could not stop major powers in the 1930s, showing that this solution was only partial.","w":["Compare both kinds of problems; discuss up to 1939."]},{"id":"2013-5","t":["mc","soc"],"type":"assess","q":"How successful was the United Nations in promoting world peace and cooperation?","kw":["How successful","promoting world peace and cooperation"],"focus":"Balanced assessment of successes and limitations in both peace and cooperation, over 1945-2000.","b":[["Peace — successes",["Korean War 1950: UN force repelled invasion","Suez 1956: UNEF peacekeeping","Arab-Israeli ceasefires; Resolution 242 (1967)","Gulf War 1991: coalition liberated Kuwait"]],["Peace — limitations",["Veto paralysis in Cold War (Hungary 1956, Czechoslovakia 1968, Vietnam, Afghanistan)","Failure in Bosnia (Srebrenica 1995) and Rwanda 1994"]],["Cooperation — successes",["WHO: smallpox eradicated 1980","UNICEF, FAO, UNESCO; UNHCR refugees","UNEP, Earth Summit 1992"]],["Cooperation — limitations",["Funding shortages, North–South gap, poverty persisted"]]],"s":[["Introduction","Stand: fairly successful in cooperation, limited in peace."],["Body 1 · Peace successes",""],["Body 2 · Peace limitations",""],["Body 3 · Cooperation successes",""],["Body 4 · Cooperation limitations",""],["Conclusion","Judge overall."]],"g":["Name two peace successes and two failures.","Why did the veto often block action?","What is the UN's greatest success in social cooperation?","Was the UN more successful in peace or cooperation?"],"ei":"The United Nations was fairly successful in promoting world cooperation, especially through its specialised agencies, but its success in promoting peace was limited because superpower rivalry often paralysed the Security Council.","ep":"The UN was successful in promoting international social cooperation. Through the WHO's Intensified Eradication Programme started in 1967, countries on both sides of the Cold War cooperated in vaccination campaigns across Asia, Africa and South America. In 1980, the WHO declared smallpox eradicated, the first disease eliminated by human effort. This achievement shows the UN could unite nations for common goals when political interests did not clash.","w":["Balance success and limitations; cover a long period."]},{"id":"2013-6","t":["mc"],"type":"agree","q":"‘The Cold War brought more benefits than harms to Europe.’ Comment on the validity of this statement with reference to Europe's development in the period 1946-91.","kw":["more benefits than harms","Europe","1946-91"],"focus":"Weigh benefits and harms of the Cold War specifically for Europe, East and West.","b":[["Benefits",["Marshall Plan aid → Western recovery, OEEC","Security under NATO; no major war in Europe (‘long peace’)","Pushed Western European integration (ECSC 1951, EEC 1957)","Comecon aid to Eastern Europe (limited)"]],["Harms",["Division of Europe: Iron Curtain, Germany split, Berlin Wall 1961","Soviet control of Eastern Europe: Hungary 1956, Czechoslovakia 1968","Nuclear threat; military spending; Europe as possible battlefield","Eastern economic stagnation"]]],"s":[["Introduction","Stand: e.g. valid for Western Europe, invalid for Eastern Europe; overall more harm."],["Body 1 · Economic benefits",""],["Body 2 · Security/peace benefits",""],["Body 3 · Political harms: division",""],["Body 4 · Harms in Eastern Europe",""],["Conclusion",""]],"g":["Did the Cold War affect Western and Eastern Europe differently?","How did fear of communism speed up European integration?","What did Eastern Europeans lose?","Was the ‘long peace’ really a benefit of the Cold War?"],"ei":"The statement is only partly valid. The Cold War benefited Western Europe through US aid, security and integration, but it harmed Europe as a whole by dividing it and placing Eastern Europe under Soviet control.","ep":"The Cold War brought serious harm by dividing Europe. After 1946, Europe was split by the Iron Curtain, and in 1949 Germany was divided into two states. In 1961, the Berlin Wall was built, separating families for 28 years. Eastern European uprisings, such as Hungary in 1956, were crushed by Soviet tanks.","w":["Be specific to Europe; balance benefits and harms."]},{"id":"2013-7","t":["x"],"type":"select","q":"Select one country within your History course, and discuss its impact on the continent to which it belonged in the first half of the 20th century.","kw":["one country","impact on the continent","first half of the 20th century"],"focus":"Discuss the COUNTRY's impact (positive and negative) on its continent — not just the impact of the world wars.","b":[["Japan's impact on Asia",["Positive: model of modernisation; victory over Russia 1905 inspired Asian nationalists (Sun Yat-sen, Vietnamese)","Positive: Japanese occupation weakened Western colonial rule → independence","Negative: aggression: Korea 1910, 21 Demands 1915, Manchuria 1931, Sino-Japanese War 1937, Nanjing Massacre; occupation of SE Asia"]],["Germany's impact on Europe",["Caused two world wars; Nazi occupation, Holocaust","Economic/industrial model; destruction and division by 1945"]]],"s":[["Introduction","Country and stand."],["Body 1 · Positive impact",""],["Body 2 · Negative impact: aggression",""],["Body 3 · Long-term impact on the continent",""],["Conclusion",""]],"g":["What did the country do to other countries on its continent?","Were there any positive effects?","How was the continent different by 1950 because of it?"],"ei":"Japan had a great impact on Asia in the first half of the 20th century. It inspired Asian nationalists as a model of modernisation, but its aggression caused huge suffering, and its wartime occupation unintentionally weakened Western colonialism.","ep":"Japan was a model that inspired Asian nationalism. Its victory over Russia in 1905 was the first defeat of a European power by an Asian country in modern times. Chinese revolutionaries such as Sun Yat-sen and Vietnamese nationalists such as Phan Boi Chau went to Japan to study. This showed Asians that they could modernise and resist the West.","w":["Discuss the country's impact, not just the world wars."]},{"id":"2014-1","t":["hkp"],"type":"examine","q":"Choose two of the following issues and examine how the Hong Kong government tackled the problems arising from these issues: (a) The Canton-Hong Kong General Strike and Boycott (1925-26) (b) Struggles between supporters of the Kuomintang [Guomindang] and those of the Chinese Communist Party from the 1940s to the 1960s (c) The influx of mainland Chinese immigrants in the 1950s and the 1960s (d) The question of Hong Kong's future in the 1980s and the 1990s","kw":["Choose two","problems","tackled"],"focus":"For each chosen issue: first state the specific problems (for governance and livelihood), then the government's measures, then how effective they were.","b":[["(a) Strike and Boycott 1925-26",["Problems: 250,000 workers left; food shortage; trade collapsed; threat to colonial order","Measures: emergency regulations, censorship, volunteers kept services running, loan from Britain to support merchants, Chow Shouson and Chinese elites negotiated with Guangzhou","Long-term: first Chinese member of ExCo (Chow Shouson, 1926)"]],["(b) KMT–CCP struggles",["Problems: 1956 Double Tenth Riots; 1967 leftist riots; threat to stability and British neutrality","Measures: curfew, police and army action, deportations, Public Order Ordinance; banned political displays in schools","Post-1967: social reforms — CDOs, Labour laws, 9-year free education, housing"]],["(c) Influx of immigrants",["Problems: population rose from 600,000 (1945) to over 2 million (1950); squatter fires (Shek Kip Mei 1953); unemployment; shortage of schools, water and hospitals","Measures: resettlement estates, border controls and Frontier Closed Area, touch-base policy later (1974), low-cost housing, Plover Cove Reservoir, Dongjiang water"]],["(d) Question of HK's future",["Problems: crisis of confidence 1982-84, HK dollar crash 1983, emigration wave after 1989","Measures: linked exchange rate 1983, representative government, Bill of Rights 1991, new airport (Rose Garden Project), British Nationality Scheme 1990"]]],"s":[["Introduction","Name the two issues chosen and state that the government used short-term control and long-term reform."],["Issue 1 · Problems","Specific problems created."],["Issue 1 · How tackled","Measures and their results."],["Issue 2 · Problems","Specific problems created."],["Issue 2 · How tackled","Measures and their results."],["Conclusion","Compare the approaches (e.g. coercion vs reform) and judge effectiveness."]],"g":["For each issue, can you name at least two concrete problems it created?","For each problem, what exact policy did the government use?","Were the measures short-term (control) or long-term (reform)?","Did the measures solve the problem? Give evidence.","Is there a common pattern in how the colonial government responded?"],"ei":"This essay examines the Canton-Hong Kong General Strike and Boycott (1925-26) and the influx of mainland Chinese immigrants in the 1950s and 1960s. Both issues created serious problems for colonial governance and people's livelihood. The Hong Kong government tackled them first with emergency controls and later with longer-term measures, such as drawing Chinese elites into government and building public housing.","ep":"The influx of immigrants created a serious housing problem. Hong Kong's population rose from about 600,000 in 1945 to over 2 million by 1950, and many newcomers lived in squatter huts on hillsides. On Christmas Day 1953, the Shek Kip Mei fire made about 53,000 people homeless. The government responded by building resettlement estates; the first seven-storey blocks were completed within a year, and by the mid-1960s over one million people lived in public housing. This measure solved the immediate problem of homelessness and also cleared land for development, showing that the government moved from ignoring the refugees to large-scale intervention.","w":["Focus on ‘problems’ and ‘tackled’ — do not just narrate the events.","Only discuss two issues."]},{"id":"2014-2","t":["cn1"],"type":"agree","q":"‘The Qing government failed to transform China in the period 1900-12, whereas the Nanjing government succeeded in transforming the country in the period 1927-37.’ Do you agree? Justify your view.","kw":["failed to transform","succeeded in transforming","1900-12","1927-37"],"focus":"Transformation = fundamental change. Test both halves of the statement; compare before and after each period.","b":[["Qing 1901-12 (Late Qing Reform)",["Abolished civil service exam 1905 — a fundamental change","New Army, modern schools, study abroad","Constitutional preparation; provincial assemblies 1909","But Royal Cabinet 1911, dynasty fell"]],["Nanjing 1927-37",["Nominal unification; tariff autonomy; fabi currency 1935","Railways, roads, industry growth; New Life Movement","But warlords, CCP, Japan; rural poverty; one-party dictatorship"]]],"s":[["Introduction","Stand: partly agree — both made some fundamental changes but neither fully transformed China."],["Body 1 · Qing achievements",""],["Body 2 · Qing failures",""],["Body 3 · Nanjing achievements",""],["Body 4 · Nanjing limitations",""],["Conclusion","Compare both."]],"g":["What counts as ‘transformation’ rather than small change?","Which Qing reform was truly fundamental?","Did Nanjing transform rural China?","Is it fair to call one a failure and the other a success?"],"ei":"I only partly agree with the statement. The Late Qing Reform did make some fundamental changes, such as abolishing the civil service examination, while the Nanjing government's achievements were real but limited, especially in rural areas and politics.","ep":"The Qing government did not completely fail to transform China. In 1905 it abolished the civil service examination, which had existed for 1,300 years. This ended the link between Confucian learning and official careers and led to the spread of modern schools. This was a fundamental change in education and society.","w":["Compare with the situation before each period to show transformation."]},{"id":"2014-3","t":["jp"],"type":"discuss","q":"Discuss the factors that worked for, and those that worked against, the development of the relationship between the People's Republic of China and Japan in the period 1949-2000.","kw":["factors that worked for","worked against","People's Republic of China and Japan","1949-2000"],"focus":"Conceptualise factors (e.g. ‘the US factor’, ‘economic interests’) and show how each helped or hindered relations over time.","b":[["Worked for",["Economic interests: LT trade 1962; Japan's ODA loans from 1979; China's reform needed Japanese capital","US–China rapprochement 1972 allowed Tanaka's normalisation 1972","Shared anti-Soviet concern → Treaty of Peace and Friendship 1978","Cultural ties, people-to-people exchange"]],["Worked against",["Cold War and US alliance (1951 Security Treaty) — Japan recognised Taiwan until 1972","Taiwan issue","Historical issues: textbook controversies 1982, Yasukuni visits (Nakasone 1985)","Territorial disputes: Diaoyu/Senkaku"]]],"s":[["Introduction","State that economic interest and changing international politics pushed relations forward, while the Cold War and history issues held them back."],["Body 1 · International politics","The US factor as hindrance (1950s-60s) then help (1970s)."],["Body 2 · Economic interest","For: trade, ODA."],["Body 3 · History and nationalism","Against: textbooks, Yasukuni."],["Body 4 · Taiwan and territory","Against."],["Conclusion","Overall balance across 1949-2000."]],"g":["Can you name each factor in a few words (not an event)?","Did the US factor change direction after 1972?","Why were both countries keen on trade in the 1980s?","What issues caused tension in the 1980s-90s?","Did you discuss both countries' responses?"],"ei":"The relationship between the PRC and Japan from 1949 to 2000 was shaped by factors that worked both for and against it. Economic interests and changes in the international situation promoted closer ties, while the Cold War alliance system, the Taiwan issue and historical disputes created tension.","ep":"The US factor first worked against, then for, the relationship. In the 1950s, Japan was bound by the US-Japan Security Treaty and recognised the Republic of China in Taiwan, so it could not establish relations with Beijing. However, after Nixon visited China in 1972, Prime Minister Tanaka Kakuei quickly went to Beijing, and the two countries normalised relations in September 1972. This shows that the US was a decisive external factor.","w":["Conceptualise factors; don't just list events.","Treat both China and Japan."]},{"id":"2014-4","t":["ww"],"type":"agree","q":"‘Germany was more aggressive in the 1930s than it was before the First World War.’ Comment on the validity of this statement.","kw":["more aggressive","1930s","before the First World War"],"focus":"Compare German foreign policy in two periods (c.1890-1914 vs 1933-39) on criteria such as aims, methods, results.","b":[["Before WWI (Weltpolitik)",["Naval race with Britain (Tirpitz Plans)","Moroccan Crises 1905, 1911","Blank cheque to Austria-Hungary 1914; Schlieffen Plan invasion of Belgium","But mostly diplomatic pressure; no annexation in Europe before 1914"]],["1930s (Hitler)",["Rearmament 1935; Rhineland 1936","Anschluss 1938; Sudetenland 1938; Czechoslovakia 1939; Poland 1939","Racial ideology: Lebensraum"]],["Criteria",["Aims (limited vs unlimited)","Methods (diplomacy vs force)","Results (annexations)"]]],"s":[["Introduction","Stand: valid — aims and methods more aggressive in 1930s."],["Body 1 · Aims compared",""],["Body 2 · Methods compared",""],["Body 3 · Results compared",""],["Conclusion",""]],"g":["What were Germany's aims before 1914, and what were Hitler's aims in the 1930s?","What methods did Germany use in each period — diplomacy, threats or force?","Did Germany gain territory in Europe before 1914? What did it gain in 1936-39?","Who was responsible for starting war in each period?","Does each paragraph compare both periods?"],"ei":"The statement is largely valid. Before the First World War, Germany pursued an aggressive Weltpolitik and played a major part in the outbreak of war in 1914, but it mainly used pressure diplomacy and did not seek to conquer Europe. In the 1930s, Hitler aimed at unlimited expansion and used force repeatedly, making Germany more aggressive.","ep":"In terms of results, Germany was more aggressive in the 1930s. Before 1914, Germany's challenges, such as the Moroccan Crises of 1905 and 1911, ended in diplomatic defeat without any territorial gain in Europe. By contrast, between 1938 and 1939, Hitler annexed Austria, took the Sudetenland, occupied the rest of Czechoslovakia and invaded Poland. In about 18 months, Germany took more European territory than it had tried to gain in the whole period before 1914.","w":["Compare the two periods; don't write about Hitler's rise."]},{"id":"2014-5","t":["mc"],"type":"agree","q":"‘A characteristic of the Cold War (1946-91) was US response to USSR challenges rather than USSR response to US challenges.’ Do you agree? Justify your view.","kw":["US response to USSR challenges","USSR response to US challenges","1946-91"],"focus":"For each Cold War episode, identify who challenged and who responded. Cover the whole period.","b":[["US responding to USSR",["Soviet control of Eastern Europe → Truman Doctrine, Marshall Plan 1947","Berlin Blockade 1948 → Berlin Airlift, NATO 1949","Soviet bomb 1949, Sputnik 1957 → arms and space race, NASA","Missiles in Cuba 1962 → US quarantine","Afghanistan invasion 1979 → Carter Doctrine, Olympic boycott"]],["USSR responding to US",["Marshall Plan → Molotov Plan, Cominform","West German currency reform → Berlin Blockade","West German NATO entry 1955 → Warsaw Pact","US missiles in Turkey → missiles in Cuba","Reagan's SDI 1983 → Soviet economic strain, Gorbachev reforms"]]],"s":[["Introduction","Stand: disagree — the Cold War was a cycle of mutual challenge and response."],["Body 1 · 1946-53",""],["Body 2 · 1953-62",""],["Body 3 · 1962-79",""],["Body 4 · 1979-91",""],["Conclusion",""]],"g":["For the Berlin Blockade, who challenged whom?","Was the Cuban Missile Crisis a Soviet challenge or response?","How did the US respond to Sputnik?","Did your answer cover the 1980s?"],"ei":"I disagree. The Cold War was not simply a US response to Soviet challenges; both superpowers challenged and responded to each other in a cycle of action and reaction.","ep":"The Cuban Missile Crisis shows that the USSR also responded to US challenges. In 1961, the US placed Jupiter missiles in Turkey, within range of Moscow, and supported the Bay of Pigs invasion. Khrushchev responded by sending missiles to Cuba in 1962. The crisis ended when the USSR withdrew its missiles and the US secretly agreed to remove its missiles from Turkey.","w":["Focus on ‘challenges’ and ‘response’; cover 1946-91."]},{"id":"2014-6","t":["mc"],"type":"relimp","q":"Discuss the relative importance of nationalism and foreign intervention in shaping Arab-Israeli relations in the period 1945-2000.","kw":["relative importance","nationalism","foreign intervention","Arab-Israeli relations","1945-2000"],"focus":"Compare the two factors directly across 1945-2000, not separate stories.","b":[["Nationalism",["Zionism: Jewish homeland; Israel proclaimed 1948","Arab nationalism: Nasser, pan-Arabism; rejected Israel","Palestinian nationalism: PLO 1964, Intifada 1987","Jerusalem and land (West Bank, Gaza) as sacred/national claims"]],["Foreign intervention",["Britain: Balfour Declaration, withdrawal 1948","UN Partition Plan 1947; ceasefires; Resolution 242","US support for Israel; USSR arms to Egypt and Syria","Suez 1956 (Britain, France)","US mediation: Camp David 1978, Oslo 1993"]]],"s":[["Introduction","Stand: nationalism was more important as the root cause; foreign intervention shaped the course and escalation."],["Body 1 · Nationalism created the conflict","Zionism vs Arab nationalism, 1948."],["Body 2 · Foreign intervention escalated it","Cold War arms, Suez."],["Body 3 · Foreign intervention in peace efforts","Camp David, Oslo — limited by nationalism."],["Body 4 · Direct comparison","Nationalism persisted whatever the outsiders did."],["Conclusion",""]],"g":["Which factor started the conflict?","How did the superpowers make wars bigger?","Why did Camp David succeed but Palestinian issues remain?","Could foreign powers ever override nationalist claims to Jerusalem?"],"ei":"Both nationalism and foreign intervention shaped Arab-Israeli relations from 1945 to 2000, but nationalism was more important. It was the root of the conflict, while foreign intervention mainly affected its intensity and the timing of peace efforts.","ep":"Nationalism was the root cause because both sides claimed the same land. Zionists wanted a Jewish state in Palestine, and Israel was declared in May 1948. Arab states rejected this and invaded immediately. Over 700,000 Palestinians became refugees, fuelling Palestinian nationalism and the founding of the PLO in 1964. Even when outside powers arranged ceasefires, these competing national claims kept the conflict alive.","w":["Compare the two factors, don't write two separate accounts."]},{"id":"2014-7","t":["eco","sea"],"type":"explain","q":"Select one regional intergovernmental organisation (such as the Association of Southeast Asian Nations and the European Economic Community) covered in your History course, and explain its formation and development up to the end of the 20th century.","kw":["regional intergovernmental organisation","formation and development","up to the end of the 20th century"],"focus":"Pick a REGIONAL body (not UN/League). Explain why it was formed, then how it developed to 2000.","b":[["EEC/EC/EU: formation",["Post-war devastation; need for recovery","Franco-German reconciliation; Schuman Plan → ECSC 1951","Cold War: strong West; US encouragement","Treaty of Rome 1957"]],["EEC development",["Customs union 1968; CAP","Enlargements 1973, 1981, 1986, 1995","SEA 1986; Maastricht 1992; euro 1999"]],["ASEAN (alternative)",["Formation 1967: fear of communism, end of Konfrontasi, need for stability","Development: Bali 1976; Cambodia issue; AFTA 1992; expansion to 10; ASEAN+3"]]],"s":[["Introduction","Name organisation."],["Body 1 · Reasons for formation",""],["Body 2 · Early development",""],["Body 3 · Expansion",""],["Body 4 · Deepening to 2000",""],["Conclusion",""]],"g":["Is your organisation regional? (Not the UN or League.)","What problems led to its formation? Name at least three reasons.","What were the key stages of its development up to 2000?","How did its membership and functions change?"],"ei":"The European Economic Community (EEC) was formed in 1957 because of the need for post-war recovery, the desire for Franco-German reconciliation and the pressures of the Cold War. It then developed through deeper economic integration and enlargement, becoming the European Union by the end of the 20th century.","ep":"The EEC was formed partly to prevent another war between France and Germany. After three wars in 70 years, France wanted to control German heavy industry. In 1950, Robert Schuman proposed placing French and German coal and steel under a joint authority, and in 1951 six countries formed the ECSC. Its success encouraged the six to go further, and in 1957 they signed the Treaty of Rome, creating the EEC with a common market.","w":["Explain formation, not just development."]},{"id":"2015-1","t":["hkp"],"type":"trace","q":"Trace and explain the political development of Hong Kong in the second half of the 20th century up to 1997.","kw":["Trace and explain","political development","second half of the 20th century up to 1997"],"focus":"Divide 1950-97 into stages using turning points (1967, 1984). For each stage describe the features (trace) and give reasons (explain).","b":[["Stage 1: 1950-67 — conservative colonial rule",["Young Plan (1946) abandoned in 1952; no elected LegCo","Features: executive-led, appointed councils, limited Chinese role","Reasons: Cold War, fear of KMT-CCP struggles, China's opposition to self-government"]],["Stage 2: 1967-84 — administrative reform",["Turning point: 1967 Riots","Features: CDO scheme 1968, ICAC 1974, localisation of civil service, District Boards 1982","Reasons: need to win public support; MacLehose's reforms"]],["Stage 3: 1984-97 — decolonisation & transition",["Turning point: Joint Declaration 1984","Features: representative government, 1985 indirect and 1991 direct elections, parties, Basic Law 1990, Patten's reforms, Provisional LegCo, 1997 handover","Reasons: preparation for handover, June Fourth, China–Britain disputes"]]],"s":[["Introduction","State the overall trend: from conservative colonial rule to representative government and return of sovereignty; name turning points 1967 and 1984."],["Body 1 · 1950-67","Trace features + explain reasons."],["Body 2 · 1967-84","Trace features + explain reasons."],["Body 3 · 1984-97","Trace features + explain reasons."],["Conclusion","Summarise the overall direction and the main forces (British, China, local)."]],"g":["Why do 1967 and 1984 work as turning points?","What were the main features of each stage (keep it to 2-3 per stage)?","For each feature, can you give a ‘because’?","Have you balanced ‘trace’ (what) and ‘explain’ (why)?","Does your conclusion show the overall direction of change?"],"ei":"In the second half of the 20th century, Hong Kong's political development moved from conservative colonial rule towards representative government and finally the return of sovereignty to China in 1997. This development can be divided into three stages, with the 1967 Riots and the Sino-British Joint Declaration of 1984 as turning points.","ep":"From 1967 to 1984, the colonial government carried out administrative reforms to improve its relationship with the people. The 1967 Riots showed that there was a serious gap between the government and the Chinese population. To close this gap, the government introduced the City District Officer scheme in 1968, set up the ICAC in 1974 to fight corruption and created District Boards in 1982. These reforms made the government more responsive but did not give the people real political power, since LegCo remained fully appointed. The main feature of this stage was therefore ‘consultation without democracy’, driven by the government's need to regain legitimacy after 1967.","w":["Do not present just two sub-periods; identify valid turning points like 1967.","Balance tracing and explaining."]},{"id":"2015-2","t":["cn1","cn2"],"type":"agree","q":"Select one of the following historical figures, and discuss whether his impact on China's development was more positive than negative: (a) Sun Yat-sen (b) Chiang Kai-shek (c) Mao Zedong (d) Deng Xiaoping","kw":["more positive than negative","impact on China's development"],"focus":"Choose one figure. Weigh positive and negative impact across several aspects and a long time span.","b":[["Deng Xiaoping (example)",["Positive: Reform and Opening-up, SEZs, household responsibility system, rapid growth, ‘one country, two systems’","Negative: corruption, inequality, June Fourth 1989, environmental damage"]],["Mao Zedong",["Positive: unified China 1949, land reform, First Five-Year Plan, nuclear bomb, national status","Negative: Great Leap Forward famine, Cultural Revolution"]],["Sun Yat-sen",["Positive: 1911 Revolution, Three Principles, KMT reorganisation","Negative: ceded presidency to Yuan, failures, relied on warlords"]],["Chiang Kai-shek",["Positive: Northern Expedition, Nanjing decade, led war vs Japan","Negative: purge, dictatorship, corruption, lost civil war"]]],"s":[["Introduction","Name figure and stand."],["Body 1 · Political",""],["Body 2 · Economic",""],["Body 3 · Social/diplomatic",""],["Conclusion","Weigh overall."]],"g":["Which figure do you know best across a long period of time?","List his main policies or actions in political, economic, social and diplomatic aspects.","For each one, decide: positive, negative, or both?","Which impacts lasted longest?","How will you weigh the positives against the negatives to reach a clear verdict?"],"ei":"Deng Xiaoping's impact on China's development was more positive than negative. His Reform and Opening-up policy transformed China's economy and raised living standards, although it also brought corruption, inequality and political repression.","ep":"Deng's economic reforms had a very positive impact on China's development. From 1978, the household responsibility system allowed peasants to sell surplus crops, and grain output rose from 305 million tonnes in 1978 to 407 million tonnes in 1984. The Special Economic Zones, such as Shenzhen (1980), attracted foreign capital and technology, and China's GDP grew by about 9% a year in the 1980s. Hundreds of millions of people were lifted out of poverty. This long-term, nationwide improvement outweighs many of the negative effects of his rule.","w":["Cover a substantial period and many aspects; weigh positive vs negative."]},{"id":"2015-3","t":["jp"],"type":"why","q":"Why did militarism rise in Japan in the 1930s but not earlier? Justify your view.","kw":["Why","1930s but not earlier"],"focus":"Two tasks: why conditions before 1930 blocked militarism, and why conditions in the 1930s allowed it.","b":[["Before 1930 — unfavourable conditions",["Party politics and Taisho democracy; universal suffrage 1925","Pro-Western cooperative diplomacy (Shidehara); Washington system","Economic boom during WWI; stability"]],["1930s — favourable conditions",["Great Depression hit silk exports, rural poverty","Party governments seen as corrupt and weak; London Naval Treaty 1930 anger","Mukden Incident 1931 success, public support","Assassinations: Hamaguchi 1930, Inukai 1932 (May 15 Incident); Feb 26 Incident 1936","Western democracies weakened; rise of fascism abroad; League failure"]]],"s":[["Introduction","Militarism rose in the 1930s because the Depression destroyed the conditions that had kept it in check."],["Body 1 · Why not earlier","Democracy, diplomacy, prosperity."],["Body 2 · Economic crisis","The Depression."],["Body 3 · Political failure and violence","Assassinations, army's independence."],["Body 4 · International environment","Manchuria success, League weakness."],["Conclusion","Link both halves."]],"g":["What prevented militarists from taking power in the 1920s?","How did the Depression change public opinion?","Which assassinations weakened party government?","Why did success in Manchuria help militarists?","Have you answered BOTH ‘why 1930s’ and ‘why not earlier’?"],"ei":"Militarism rose in Japan in the 1930s but not earlier because the conditions that had held it back in the 1920s — party politics, cooperative diplomacy and prosperity — collapsed with the Great Depression, while new conditions such as military success in Manchuria and political assassinations favoured the militarists.","ep":"Before 1930, conditions were unfavourable to militarism. In the 1920s, party cabinets governed Japan, and Foreign Minister Shidehara followed a policy of cooperation with the West under the Washington system. Japan's economy had grown during the First World War, so there was little public demand for expansion. The army even accepted budget cuts in 1925. Militarists therefore lacked both public support and opportunity.","w":["Answer the ‘not earlier’ part too.","Use concrete facts (assassinations, dates)."]},{"id":"2015-4","t":["ww"],"type":"inwhatways","q":"In what ways was the Second World War a turning point of modern Western history? Limit your discussion up to the 1960s.","kw":["In what ways","turning point","modern Western history","up to the 1960s"],"focus":"For each aspect show before-WWII vs after-WWII to prove a turning point.","b":[["Political",["Europe's dominance ended → US and USSR superpowers","Cold War division of Europe","Decolonisation"]],["International cooperation",["League replaced by UN; NATO; European integration (ECSC, EEC)"]],["Economic/social",["Welfare state (Britain's NHS 1948)","Women's roles and rights","Marshall Plan; economic boom"]],["Technological",["Nuclear weapons; jet engines; computers"]]],"s":[["Introduction",""],["Body 1 · Political power",""],["Body 2 · International order",""],["Body 3 · Social",""],["Body 4 · Technology",""],["Conclusion",""]],"g":["In each aspect, what was the Western world like before 1939?","How was it different after 1945? Is the change fundamental?","Which aspects will you choose: politics, international order, economy, society, technology?","Were any changes already happening before the war?","Do you stop at the 1960s?"],"ei":"The Second World War was a turning point in modern Western history. Comparing the Western world before 1939 and after 1945, the war ended Europe's world dominance and created two superpowers, replaced the failed League with the UN and new alliances, brought welfare states and new roles for women, and started the nuclear age.","ep":"The war was a turning point in world power. Before 1939, Britain and France were the leading world powers with large empires, while the US followed isolationism. After 1945, Britain was nearly bankrupt and dependent on US loans, and France had been occupied. The US produced about half the world's industrial output and had the atomic bomb, while the USSR controlled Eastern Europe. This bipolar world was fundamentally different from the Europe-centred world before the war.","w":["Compare before and after — show the ‘turn’."]},{"id":"2015-5","t":["mc"],"type":"compare","q":"Who – Yasser Arafat or Nelson Mandela – do you think was a greater leader? Justify your view.","kw":["greater leader","Yasser Arafat","Nelson Mandela"],"focus":"Define criteria for ‘greatness’ and compare both leaders under each.","b":[["Criteria",["Aims and vision","Methods (violence vs negotiation)","Achievements","Legacy / international recognition"]],["Arafat",["Led Fatah and PLO (1969-2004); made Palestinian cause internationally known","Used armed struggle and terrorism in the 1970s","Recognised Israel; Oslo Accords 1993; Nobel Peace Prize 1994","Failed to achieve Palestinian state; corruption in PA"]],["Mandela",["Led ANC resistance; 27 years in prison","Shifted to negotiation and reconciliation","Ended apartheid; President 1994; Truth and Reconciliation Commission","Nobel Peace Prize 1993; worldwide moral authority"]]],"s":[["Introduction","Stand: Mandela was greater."],["Body 1 · Aims",""],["Body 2 · Methods",""],["Body 3 · Achievements",""],["Body 4 · Legacy",""],["Conclusion",""]],"g":["What makes a leader ‘great’?","Did both use violence at some stage?","Which one achieved his main goal?","How are they remembered?"],"ei":"Judged by aims, methods, achievements and legacy, Nelson Mandela was a greater leader than Yasser Arafat. Both fought for their people's rights, but Mandela achieved his goal peacefully and united his country, while Arafat failed to create a Palestinian state.","ep":"In terms of achievements, Mandela was greater. Mandela's negotiations with de Klerk ended apartheid, and he became president after the first multi-racial election in 1994. Arafat signed the Oslo Accords in 1993, which created the Palestinian Authority, but a Palestinian state was not established and violence resumed.","w":["Compare both leaders; don't pick one and narrate."]},{"id":"2015-6","t":["eco"],"type":"agree","q":"‘In the period 1945-2000, European countries became less dependent on the superpowers and more autonomous in their economic cooperation.’ Do you agree? Justify your view.","kw":["less dependent on the superpowers","more autonomous","economic cooperation","1945-2000"],"focus":"Track dependence vs autonomy over time, in BOTH Western (US) and Eastern (USSR) Europe.","b":[["W
