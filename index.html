estern Europe",["Dependent: Marshall Plan and OEEC 1948 US-driven","Growing autonomy: ECSC 1951, EEC 1957 European-led; CAP; EMS 1979","High autonomy: SEA 1986, EU 1992, euro 1999 rivals the dollar","But security still US-dependent (NATO)"]],["Eastern Europe",["Dependent: Molotov Plan, Comecon 1949 Soviet-dominated","Limited autonomy: Romania resisted specialisation 1960s","After 1991: Comecon dissolved; turned to EU"]]],"s":[["Introduction","Stand: agree overall."],["Body 1 · West 1945-57",""],["Body 2 · West 1957-2000",""],["Body 3 · East 1945-89",""],["Body 4 · East after 1989",""],["Conclusion",""]],"g":["Who led the OEEC, and who led the EEC?","How much autonomy did Comecon members have?","Did Western Europe still depend on the US in any way (e.g. security)?","What changed in Eastern Europe after 1991?"],"ei":"I agree to a large extent. In the late 1940s, both halves of Europe depended on a superpower: Western Europe on US Marshall aid and Eastern Europe on the USSR through Comecon. Over time, Western Europe built its own institutions such as the EEC and the EU, and after 1991 Eastern Europe was freed from Soviet control, so economic cooperation became much more autonomous by 2000.","ep":"In Eastern Europe, economic cooperation depended on the USSR for most of the period. Comecon was created by Moscow in 1949, and members had to follow Soviet economic plans. In the 1960s, Khrushchev pushed a ‘socialist division of labour’ that made some countries mainly agricultural; only Romania openly resisted. However, when communism collapsed, Comecon was dissolved in 1991, and countries such as Poland and Hungary applied to join the EU.","w":["Discuss both Eastern and Western Europe; go beyond the 1940s."]},{"id":"2015-7","t":["x"],"type":"select","q":"Select any two countries, and discuss the factors that affected their relationship in the first half of the 20th century.","kw":["two countries","factors","relationship","first half of the 20th century"],"focus":"Generalise FACTORS (e.g. territorial ambition, nationalism, economics, international situation) that shaped the relationship — not separate histories.","b":[["Example: China and Japan",["Japan's territorial ambition and need for resources: 21 Demands 1915, Manchuria 1931, war 1937","Chinese nationalism: May Fourth 1919, boycotts, united front 1937","Economic interests: Japanese investment and trade in China","International situation: WWI distracted Western powers; League's weakness 1931","Internal weakness of China: warlords, KMT-CCP conflict"]],["Other pairings",["Germany and France: territorial disputes (Alsace-Lorraine), security, reparations, Locarno","Britain and Germany: naval race, colonies, appeasement"]]],"s":[["Introduction","Name countries and main factors."],["Body 1 · Factor: Japan's expansionism",""],["Body 2 · Factor: Chinese nationalism",""],["Body 3 · Factor: International environment",""],["Body 4 · Factor: China's internal weakness",""],["Conclusion","Which factor mattered most?"]],"g":["Can you label each factor in a few words?","How did each factor change the relationship (better or worse)?","Is every paragraph about the relationship between BOTH countries?","Did you stay within 1900-50?"],"ei":"The relationship between China and Japan in the first half of the 20th century was mainly hostile. It was affected by Japan's expansionism and need for resources, the rise of Chinese nationalism, the international environment and China's internal weakness.","ep":"China's internal weakness affected the relationship by inviting Japanese aggression. In 1915, while Yuan Shikai's government was weak and Western powers were busy with the First World War, Japan presented the Twenty-One Demands. Later, during the KMT-CCP civil war, Japan seized Manchuria in 1931 because it believed China could not resist. China's disunity thus encouraged Japan to pursue its ambitions.","w":["Discuss the relationship, not each country separately.","Keep to 1900-50."]},{"id":"2016-1","t":["hkp"],"type":"extent","q":"To what extent was the political development of Hong Kong in the period 1967-97 a result of the China factor? Explain your view.","kw":["To what extent","China factor","political development","1967-97"],"focus":"Assess how much of HK's political change came from China, compared with British and local factors.","b":[["China factor",["Cultural Revolution spread to HK → 1967 Riots → reforms (CDOs, MACs)","China's opposition to self-government kept HK colonial until 1984","Recovery of sovereignty → Joint Declaration, Basic Law","June Fourth 1989 → rise of democrats, 1991 direct elections","Reaction to Patten → Provisional LegCo"]],["Other factors",["British decolonisation policy and MacLehose reforms (ICAC 1974)","Rise of middle class and education (9-year free education 1978)","Cold War: Britain wanted stable HK","Local pressure groups"]]],"s":[["Introduction","Stand: to a large extent — China set limits and turning points; others shaped detail."],["Body 1 · China 1967-84","Cultural Revolution, 1967 Riots, China blocking self-government."],["Body 2 · China 1984-97","Joint Declaration, Basic Law, June Fourth, Patten dispute."],["Body 3 · Other factors","British policy, middle class, education."],["Body 4 · Weighing","Show interrelation: most turning points began from China."],["Conclusion","Give your extent clearly."]],"g":["Which events in China affected HK politics directly?","Which reforms came from British initiative?","How did a more educated middle class change politics?","Which factor started the major turning points?","Have you stated your ‘extent’ clearly?"],"ei":"The political development of Hong Kong between 1967 and 1997 was to a large extent a result of the China factor. Events in China triggered the 1967 Riots, and China's decision to recover sovereignty set the course of politics after 1984. However, British colonial policy and the rise of an educated middle class also played important roles.","ep":"The rise of the middle class was an important factor besides China. After the introduction of nine-year free education in 1978 and the expansion of tertiary education, a generation of educated professionals grew up in Hong Kong. They formed pressure groups such as Meeting Point (1983) and demanded a say in public affairs. However, their demands became significant only after the Joint Declaration opened the question of HK's future, so this factor was less important than the China factor.","w":["Discuss both the China factor and other factors, then assess relative importance."]},{"id":"2016-2","t":["cn1","cn2"],"type":"agree","q":"‘Modernisation efforts in China had different programmes to achieve similar aims.’ Do you agree? Explain your view with reference to any two modernisation efforts of China in the 20th century.","kw":["different programmes","similar aims","any two modernisation efforts"],"focus":"Pick two modernisation efforts (e.g. Late Qing Reform and Four Modernisations). Compare their aims and their programmes.","b":[["Possible efforts",["Late Qing Reform 1901-11","Nanjing government's reconstruction 1928-37","First Five-Year Plan / socialist construction","Four Modernisations / Reform and Opening-up"]],["Aims (similar?)",["Both: national wealth and power (fuqiang)","But Qing also aimed to save the dynasty; Deng to uphold CCP rule/socialism"]],["Programmes (different?)",["Qing: constitutional preparation, New Army, abolish exams","Deng: market reforms, SEZs, opening to foreign capital"]]],"s":[["Introduction","Name two efforts; stand."],["Body 1 · Aims compared",""],["Body 2 · Programmes: political",""],["Body 3 · Programmes: economic",""],["Conclusion",""]],"g":["Which two modernisation efforts will you choose? Are they whole programmes, not single events?","What were the specific aims of each? Avoid only saying ‘strengthen China’.","What were the political, economic, military and educational programmes of each?","Where are the aims similar, and where do they differ?","Where are the programmes different, and are there any similarities?"],"ei":"Using the Late Qing Reform and Deng Xiaoping's Four Modernisations as examples, I largely agree. Both aimed to make China rich and strong, yet their programmes differed greatly; however, their aims were not identical.","ep":"The aims of the two efforts were similar in pursuing wealth and power, but they differed in political purpose. The Late Qing Reform began after the humiliation of the Boxer Protocol in 1901 and aimed to strengthen China while preserving the Qing dynasty; its constitutional plan of 1908 kept supreme power with the emperor. The Four Modernisations, launched in 1978, aimed to modernise agriculture, industry, national defence and science and technology by 2000, while upholding socialism and CCP leadership. Both wanted China to catch up with advanced countries, but each also aimed to protect the existing regime.","w":["Compare, don't narrate separately. Focus on aims and programmes, not effectiveness."]},{"id":"2016-3","t":["sea"],"type":"compare","q":"Select any two Southeast Asian countries, and compare the ways by which they achieved independence.","kw":["two Southeast Asian countries","compare","ways"],"focus":"Pick two SE Asian countries (e.g. Indonesia and Malaya) and compare METHODS point by point.","b":[["Indonesia",["Proclamation by Sukarno and Hatta 17 Aug 1945","Armed struggle against Dutch ‘police actions’ 1947-48","Diplomacy: Linggadjati 1946, Renville 1948, UN pressure, US threat to cut Marshall aid; Hague agreement 1949"]],["Malaya",["Negotiation with Britain; multi-racial Alliance Party (UMNO, MCA, MIC)","Elections 1955; London talks 1956; independence 1957","Emergency against communists — not against Britain"]],["Criteria",["Violence or negotiation","Leadership and unity","Role of international factors","Speed"]]],"s":[["Introduction","Name countries; overall: Indonesia by armed struggle plus diplomacy, Malaya by peaceful negotiation."],["Body 1 · Use of force",""],["Body 2 · Negotiation and diplomacy",""],["Body 3 · International support",""],["Body 4 · Internal unity",""],["Conclusion","Summarise similarities and differences."]],"g":["Are both countries in Southeast Asia? (Not Japan or Korea!)","What was the main method in each?","Did either use international organisations?","How did the colonial power's attitude affect the method?"],"ei":"Indonesia and Malaya both achieved independence after the Second World War, but by different ways. Indonesia combined armed struggle with international diplomacy, while Malaya gained independence mainly through peaceful negotiation with Britain.","ep":"The two countries differed in their use of force. Indonesia fought the Dutch after they returned in 1945; the Dutch launched two ‘police actions’ in 1947 and 1948. In Malaya, however, nationalists did not fight Britain. The Alliance Party won the 1955 election and negotiated independence in London in 1956.","w":["Compare in each paragraph; focus on ‘ways’ not general history."]},{"id":"2016-4","t":["ww"],"type":"agree","q":"Was the Second World War unavoidable? Explain your view with reference to developments in Europe in the period 1919-39.","kw":["unavoidable","developments in Europe","1919-39"],"focus":"Two steps: identify the causes, then judge whether they were strong enough to make war unavoidable — were there real chances to avoid it?","b":[["Arguments for ‘unavoidable’",["Versailles created lasting German revisionism","Great Depression destroyed the 1920s recovery and brought Hitler to power (1933)","Hitler's ideology (Lebensraum, Mein Kampf) required expansion in the east","Nazi-Soviet Pact 1939 removed the last restraint"]],["Arguments for ‘avoidable’",["‘Spirit of Locarno’ 1925, Germany in League 1926, Kellogg-Briand Pact 1928 — peace was possible","Dawes and Young Plans eased reparations","Britain and France could have stopped Hitler in the Rhineland 1936 (German army weak)","Appeasement was a choice; a Soviet alliance was possible in 1939"]]],"s":[["Introduction","Stand: avoidable in the 1920s, increasingly unavoidable after 1933 and especially after Munich 1938."],["Body 1 · 1919-29: chances for peace","Locarno, Dawes Plan, League successes."],["Body 2 · 1929-33: Depression changed everything","Economic crisis, rise of Hitler."],["Body 3 · 1933-38: missed chances","Rhineland, Anschluss, appeasement as a choice."],["Body 4 · 1938-39: war became unavoidable","Hitler's aims, Nazi-Soviet Pact."],["Conclusion","Give a time-based judgement."]],"g":["What does ‘unavoidable’ mean — could any decision have prevented war?","What evidence shows peace was possible in the 1920s?","When could Britain and France have stopped Hitler most easily?","After which event did war become almost certain?","Is your answer more than a list of causes?"],"ei":"The Second World War was not unavoidable throughout 1919-39. In the 1920s, the Locarno Treaties and the Dawes Plan showed that peace was possible. However, the Great Depression brought Hitler to power, and after Britain and France failed to act in 1936 and 1938, war became increasingly unavoidable by 1939.","ep":"War was still avoidable in 1936. When Hitler sent troops into the demilitarised Rhineland in March 1936, the German army was far weaker than the French army, and German officers had orders to retreat if France resisted. However, France was in political crisis and Britain regarded the Rhineland as Germany's ‘own back garden’, so neither acted. This shows that decisions by the democracies, not fate, allowed Hitler to become stronger, so the war was not yet unavoidable.","w":["Go beyond listing causes: assess whether they made war inevitable."]},{"id":"2016-5","t":["mc"],"type":"trace","q":"Trace and explain the relationship between the US and the USSR during the period 1943-91.","kw":["Trace and explain","relationship","US and the USSR","1943-91"],"focus":"Start in 1943 (wartime alliance!). Periodise and explain the character of each stage.","b":[["1943-45 · Wartime cooperation",["Tehran 1943, Yalta 1945: joint war against Nazi Germany","Tensions over Poland appearing"]],["1946-53 · Confrontation begins",["Iron Curtain; Truman Doctrine; Marshall/Molotov Plans","Berlin Blockade; NATO; Korean War"]],["1953-62 · Peaceful coexistence and crises",["Khrushchev's coexistence; Geneva summit 1955","U-2 1960; Berlin Wall 1961; Cuban Missile Crisis 1962"]],["1963-79 · Détente",["Hotline, Test Ban 1963; SALT I 1972; Helsinki 1975","Vietnam War tensions"]],["1979-85 · Second Cold War",["Afghanistan; Olympic boycotts; Reagan's ‘evil empire’, SDI"]],["1985-91 · End of the Cold War",["Gorbachev: INF Treaty 1987; Malta 1989; USSR collapse 1991"]]],"s":[["Introduction","Overall: from allies to rivals, through cycles of tension and détente, ending in cooperation."],["Body 1 · 1943-45",""],["Body 2 · 1946-62",""],["Body 3 · 1963-79",""],["Body 4 · 1979-91",""],["Conclusion",""]],"g":["What was the relationship like in 1943?","What caused the switch to confrontation?","Why did détente begin after 1962?","Why did tension return in 1979?","Why did the Cold War end?"],"ei":"The relationship between the US and the USSR from 1943 to 1991 changed from wartime alliance to Cold War confrontation, went through cycles of crisis and détente, and ended with cooperation as the Soviet Union collapsed.","ep":"From 1943 to 1945, the US and the USSR cooperated as allies. They shared the common goal of defeating Nazi Germany. At the Tehran Conference in 1943, Roosevelt agreed to open a second front in France, and at Yalta in 1945 the Allies planned post-war Germany and the United Nations. However, disagreements over Poland showed the limits of cooperation once the common enemy was defeated.","w":["Begin in 1943, not 1945.","Balance tracing and explaining; periodise."]},{"id":"2016-6","t":["eco"],"type":"agree","q":"‘Economic cooperation in Eastern and Western Europe adopted different models: while economic cooperation in Eastern Europe was dominated by a superpower, that was not the case in Western Europe.’ Do you agree? Explain your view with reference to the period 1945-2000.","kw":["different models","dominated by a superpower","Eastern and Western Europe","1945-2000"],"focus":"Test both halves: Was the East dominated by the USSR? Was the West free of US domination? Consider change over time.","b":[["Eastern Europe — Soviet domination",["Molotov Plan 1947, Comecon 1949 set up by Moscow","‘Socialist division of labour’ imposed (Khrushchev 1960s)","Soviet oil and raw materials at controlled prices; trade tied to USSR","Limits: Romania resisted; Comecon collapsed 1991"]],["Western Europe — US influence at first",["Marshall Plan conditions; OEEC set up at US request","US encouraged integration for Cold War reasons"]],["Western Europe — European-led",["ECSC 1951 and EEC 1957 created by Europeans (Monnet, Schuman)","EEC competed with US (CAP, trade disputes, euro)","Supranational institutions, voluntary membership"]]],"s":[["Introduction","Stand: largely agree — East dominated throughout; West was US-influenced only at the start."],["Body 1 · Eastern model: Soviet domination",""],["Body 2 · Limits to Soviet domination",""],["Body 3 · Western model: early US influence",""],["Body 4 · Western model: European autonomy",""],["Conclusion",""]],"g":["Who decided policy in Comecon?","Were Western European countries forced to join the EEC?","Was the Marshall Plan a form of US domination?","Did the models change after 1991?"],"ei":"I largely agree. Economic cooperation in Eastern Europe was dominated by the USSR through Comecon, while in Western Europe the US influenced early cooperation through the Marshall Plan, but later cooperation through the EEC was led by Europeans themselves.","ep":"Economic cooperation in Eastern Europe was dominated by the USSR. Comecon was created in 1949 as Moscow's answer to the Marshall Plan, and Eastern European states were forbidden to accept American aid. In the 1960s, Khrushchev tried to impose a ‘socialist division of labour’, making some states specialise in agriculture. Trade was largely bilateral with the USSR, which supplied oil in exchange for manufactured goods. Members had little freedom to choose partners, so the Eastern model was one of superpower domination.","w":["Focus on superpower domination, not general economic cooperation.","Cover Eastern Europe properly."]},{"id":"2016-7","t":["x"],"type":"elaborate","q":"‘Human-made disasters usually lead to new policies and developments.’ Elaborate on this statement with reference to one example of a human-made disaster from your History syllabus.","kw":["Human-made disasters","new policies and developments","one example"],"focus":"Explain why your example is a human-made disaster, then show causal links to new policies and developments.","b":[["Example: Great Leap Forward famine (1959-61)",["Disaster: caused by policies (unrealistic targets, communes, false reports); 15-30 million deaths","New policies: Readjustment 1961-65 (private plots, incentives), Liu and Deng","Developments: Mao's retreat → power struggle → Cultural Revolution 1966"]],["Other examples",["World War II → UN, welfare states, European integration","Great Depression (partly human-made) → New Deal","Holocaust → Universal Declaration of Human Rights 1948, Genocide Convention","Cultural Revolution → Reform and Opening-up 1978"]]],"s":[["Introduction","Define human-made disaster; name example."],["Body 1 · Why it was a human-made disaster",""],["Body 2 · New policies",""],["Body 3 · New developments",""],["Conclusion",""]],"g":["What makes a disaster human-made rather than natural?","What policies were introduced as a result?","What longer-term developments followed?","Is the link cause → effect clear?"],"ei":"A human-made disaster is a catastrophe caused mainly by human decisions rather than nature. The Great Leap Forward famine of 1959-61 was such a disaster, and it led to new policies of economic readjustment and to political developments that shaped China for decades.","ep":"The famine led to new economic policies. After tens of millions died, Mao stepped back from daily affairs, and Liu Shaoqi and Deng Xiaoping introduced readjustment from 1961. Communes were reduced in size, peasants were allowed private plots, and material incentives returned. By 1965, grain output had recovered to 1957 levels. This shows the disaster directly caused a policy change.","w":["Discuss the concept of ‘human-made disaster’ and show causation."]},{"id":"2017-1","t":["hkp","hke"],"type":"discuss","q":"Discuss the characteristics of the relationship between Hong Kong and mainland China in the first half of the 20th century.","kw":["characteristics","relationship","first half of the 20th century"],"focus":"Identify 3-4 features of the HK–China relationship (1900-49), each backed by examples.","b":[["Close economic links",["HK as entrepôt for China trade","Chinese merchants in HK invested in China"]],["Political influence of China on HK",["1911 Revolution: HK a base for Tongmenghui","1922 Seamen's Strike, 1925-26 Strike-Boycott organised with Guangzhou","KMT and CCP activities in HK"]],["HK as refuge",["Refugees after 1911, during Sino-Japanese War 1937 onward; population rose to 1.6 million by 1941"]],["Cultural/national bond",["Anti-Japanese fundraising, patriotic support","HK Chinese elites acted as mediators (e.g. Robert Hotung)"]],["Tension",["Sovereignty disputes: Kowloon Walled City, China's demands to recover HK"]]],"s":[["Introduction","State characteristics: close interdependence and interaction despite colonial separation."],["Body 1 · Economic interdependence",""],["Body 2 · Political interaction / influence",""],["Body 3 · HK as refuge and base",""],["Body 4 · Tension",""],["Conclusion","Summarise overall nature."]],"g":["Can you name one example each for economic, political, social links?","Which events show China's politics affecting HK?","How did war in China change HK's population?","Were there moments of conflict between HK and China?","Did you only narrate events, or name characteristics?"],"ei":"In the first half of the 20th century, Hong Kong was a British colony, yet it remained closely tied to mainland China. The relationship had several characteristics: economic interdependence, strong political influence from China, Hong Kong's role as a refuge and base for Chinese people, and periodic tension over sovereignty.","ep":"One characteristic was that political changes in China strongly affected Hong Kong. In 1925, after the May Thirtieth Incident, the Guangzhou government supported the Canton-Hong Kong General Strike and Boycott. About 250,000 workers left Hong Kong and trade collapsed for over a year. This shows that although Hong Kong was under British rule, it could not isolate itself from Chinese nationalism.","w":["Keep to 1900-49.","Name characteristics, not just events."]},{"id":"2017-2","t":["cn1","cn2"],"type":"compare","q":"Compare reform and revolution as means of transformation in China in the 20th century, using one reform and one revolution within your History curriculum as examples.","kw":["Compare","reform and revolution","means of transformation"],"focus":"E.g. Late Qing Reform vs 1911 Revolution. Compare effectiveness, breadth, depth, ideology.","b":[["Criteria",["Speed and method: gradual vs violent","Depth of change: system preserved vs overthrown","Breadth: aspects affected","Ideology and leadership","Effectiveness and costs"]],["Late Qing Reform",["Top-down, gradual; kept the monarchy","Changed education, military, some politics"]],["1911 Revolution",["Bottom-up, violent; ended monarchy","Political change deep but social change shallow"]]],"s":[["Introduction",""],["Body 1 · Method",""],["Body 2 · Depth",""],["Body 3 · Breadth",""],["Body 4 · Effectiveness",""],["Conclusion",""]],"g":["Which reform and which revolution will you use?","Compare their methods: gradual or sudden, peaceful or violent, top-down or bottom-up?","Which one changed China more deeply? In which aspects?","Which one brought wider changes across many aspects?","What were the costs and limits of each?"],"ei":"Using the Late Qing Reform and the 1911 Revolution, this essay compares reform and revolution as means of transformation. Reform was gradual and preserved the existing order, while revolution was violent and overthrew it; yet neither fully transformed Chinese society.","ep":"Revolution brought deeper political change than reform. The Late Qing Reform promised a constitution only after nine years of preparation, and in 1911 it formed a ‘Royal Cabinet’ in which most ministers were Manchu princes. The political system remained a monarchy. By contrast, the 1911 Revolution overthrew the Qing, ended over 2,000 years of imperial rule and created a republic with a provisional constitution and a parliament. However, the revolution's changes were shallow in society, as warlords soon seized power, which shows that deeper political change did not guarantee lasting transformation.","w":["Make effective comparisons with concrete facts."]},{"id":"2017-3","t":["jp"],"type":"agree","q":"‘In the period 1952-2000, Japanese diplomacy with other Asian countries aimed primarily at compensating its war guilt.’ Do you agree? Explain your view.","kw":["primarily","compensating its war guilt","1952-2000","other Asian countries"],"focus":"Weigh war guilt against economic interest, US/Cold War interest and regional leadership as aims of Japan's Asian diplomacy.","b":[["War guilt",["Reparations to Burma 1954, Philippines 1956, Indonesia 1958","ODA to China from 1979","Apologies: Murayama Statement 1995"]],["Economic interest",["Reparations often as goods and services → opened markets","Fukuda Doctrine 1977; investment in SE Asia after Plaza Accord 1985"]],["US and Cold War",["Treaty with Taiwan 1952; delayed ties with PRC till 1972","Normalisation with South Korea 1965 under US encouragement"]],["Regional leadership",["Asian Development Bank 1966; APEC"]]],"s":[["Introduction","Stand: disagree — economic interest was primary; war guilt was the form, not the main aim."],["Body 1 · War guilt",""],["Body 2 · Economic interest",""],["Body 3 · US/Cold War",""],["Body 4 · Weighing",""],["Conclusion",""]],"g":["Why were reparations paid in goods and services?","Why did Japan wait until 1972 to recognise the PRC?","What did the Fukuda Doctrine aim at?","Did Japan's apologies satisfy Asian countries?"],"ei":"Japanese diplomacy with other Asian countries from 1952 to 2000 was not primarily aimed at compensating war guilt. Although reparations and apologies were part of it, the main aims were economic interest and following US Cold War strategy.","ep":"Japan's reparations served economic interest more than guilt. Under the 1954 agreement with Burma, Japan paid about US$200 million mostly in Japanese goods and services. These payments created demand for Japanese products and helped Japanese companies enter Southeast Asian markets.","w":["Discuss relative importance; not just narrate diplomacy."]},{"id":"2017-4","t":["ww"],"type":"agree","q":"‘The Great Depression was a more important factor than the Paris Peace Settlement (1919-23) in causing the Second World War.’ Do you agree? Explain your view with reference to Europe's development in the period 1919-39.","kw":["more important factor","Great Depression","Paris Peace Settlement","1919-39"],"focus":"Compare two named factors directly. Europe only (no Japan).","b":[["Paris Peace Settlement",["German resentment; war guilt; reparations","Italy's grievance","Weak new states; minorities","League without US; French insecurity → Ruhr 1923"]],["Great Depression",["Unemployment in Germany 6 million (1932) → Nazi vote 37%","Weakened Britain/France → appeasement, slow rearmament","US isolationism; collapse of cooperation (Young Plan ended)","Autarky and search for Lebensraum"]],["Linking",["Depression turned Versailles grievances into action","Without the Depression, 1920s showed the Settlement could be revised peacefully"]]],"s":[["Introduction","Stand: agree — the Settlement created the grievances, but the Depression triggered war."],["Body 1 · Settlement as long-term cause",""],["Body 2 · Depression as the trigger: Hitler",""],["Body 3 · Depression weakened the democracies",""],["Body 4 · Direct comparison","1920s peace despite Settlement; 1930s collapse after Depression."],["Conclusion",""]],"g":["What did the Settlement create that Hitler used later?","Why did Nazi votes rise sharply after 1929?","How did the Depression affect Britain and France's willingness to fight?","Why is the peaceful 1920s strong evidence in this comparison?"],"ei":"I agree that the Great Depression was a more important factor than the Paris Peace Settlement. The Settlement created German grievances, but in the 1920s these were managed peacefully. It was the Depression that brought Hitler to power and weakened the democracies, turning grievances into war.","ep":"The peaceful 1920s show that the Settlement alone did not make war likely. Although Germans resented Versailles, Stresemann accepted the western borders at Locarno in 1925, and Germany joined the League in 1926. Reparations were reduced by the Dawes and Young Plans. Only after the Depression struck in 1929, when German unemployment reached six million, did the Nazis become the largest party in 1932. Therefore, the Depression was the decisive factor.","w":["Compare, don't narrate separately.","Leave out Japan."]},{"id":"2017-5","t":["mc"],"type":"inwhatways","q":"In what ways did the USSR affect the development of the Cold War in the period 1946-91?","kw":["In what ways","USSR","affect the development","1946-91"],"focus":"Identify ways (roles) the USSR shaped the Cold War — intensifying AND easing it — across the whole period. Not a ‘to what extent’ question.","b":[["Intensifying",["Expansion in Eastern Europe; Cominform; Berlin Blockade 1948","Nuclear bomb 1949; Sputnik 1957; arms race","Crushing Hungary 1956, Czechoslovakia 1968","Missiles in Cuba 1962; invasion of Afghanistan 1979"]],["Easing",["Khrushchev's peaceful coexistence 1956","Détente: SALT I 1972, Helsinki 1975","Gorbachev: New Thinking, INF 1987, withdrawal from Afghanistan 1989, non-intervention in Eastern Europe"]],["Ending",["Collapse of USSR 1991"]]],"s":[["Introduction","The USSR affected the Cold War by starting, intensifying, easing and finally ending it."],["Body 1 · Starting confrontation",""],["Body 2 · Intensifying through arms/space race",""],["Body 3 · Easing through coexistence and détente",""],["Body 4 · Ending the Cold War",""],["Conclusion",""]],"g":["In what ways did the USSR make the Cold War worse?","In what ways did it make it better?","Did you cover 1980s?"],"ei":"The USSR affected the development of the Cold War in several ways: it started the confrontation by expanding into Eastern Europe, intensified it through the arms race and crises, eased it through coexistence and détente, and finally ended it under Gorbachev.","ep":"The USSR ended the Cold War through Gorbachev's reforms. From 1985, Gorbachev introduced ‘New Thinking’ in foreign policy, signed the INF Treaty in 1987 and withdrew Soviet troops from Afghanistan in 1989. When Eastern Europeans overthrew communism in 1989, he did not send troops.","w":["‘In what ways’ — don't discuss the US's role at length.","Cover the whole period."]},{"id":"2017-6","t":["soc","mc"],"type":"agree","q":"Do you agree that the United Nations served as an ideal platform for international cooperation? Explain your view with reference to its attempts at solving international conflicts and promoting international social and cultural cooperation in the period 1945-2000.","kw":["ideal platform","international cooperation","solving international conflicts","social and cultural cooperation","1945-2000"],"focus":"Focus on ‘platform’: did the UN provide a place and mechanism where states could work together? Judge in two areas.","b":[["Platform for solving conflicts",["Strengths: forum for dialogue (Security Council, General Assembly); Korea 1950; Suez 1956 UNEF; Cuban crisis debate; Gulf War 1991","Weaknesses: veto paralysis (e.g. Hungary 1956, Afghanistan 1979); failures in Rwanda, Bosnia; superpowers bypassed UN"]],["Platform for social/cultural cooperation",["Strengths: WHO (smallpox 1980), UNESCO (World Heritage 1972), UNICEF, FAO, UNHCR, UNEP, Earth Summit 1992","Weaknesses: funding shortage, US withdrawal from UNESCO 1984, North–South divisions"]]],"s":[["Introduction","Define ‘ideal platform’. Stand: a useful but not ideal platform."],["Body 1 · Conflict: strengths as a platform",""],["Body 2 · Conflict: weaknesses",""],["Body 3 · Social/cultural: strengths",""],["Body 4 · Social/cultural: weaknesses",""],["Conclusion",""]],"g":["What does ‘platform’ mean?","Why could the Security Council often not act?","Which agencies made the UN a good platform for cooperation?","Why did some members leave UNESCO?"],"ei":"The United Nations served as a useful platform for international cooperation, especially in social and cultural fields, but it was not an ideal platform, because superpower rivalry often paralysed its efforts to solve conflicts.","ep":"As a platform for social cooperation, the UN was very successful. Through the WHO, countries on both sides of the Cold War cooperated in the smallpox eradication campaign, with the USSR supplying vaccines and the US providing funding. Smallpox was declared eradicated in 1980. This shows the UN could bring rival states together for common goals.","w":["Address the key word ‘platform’ with enough facts."]},{"id":"2017-7","t":["x"],"type":"explain","q":"Suppose you were living in the 1960s in a country/region covered in your History curriculum, and had a strong urge to migrate to another country/region under a different regime. State the country/region in which you were living and that to which you planned to migrate, and explain the problems you were facing in the current country/region and the attractions of the new one.","kw":["1960s","different regime","problems","attractions"],"focus":"Push factors (problems) and pull factors (attractions) — political, economic, social — with solid 1960s evidence.","b":[["Example: mainland China → Hong Kong",["Push: aftermath of Great Leap famine (1959-61); Cultural Revolution from 1966 — persecution, Red Guards, class labels; shortage and rationing; restricted freedoms","Pull: HK industrial boom → jobs in factories; public housing and education expanding; relative freedom and rule of law; family networks; touch-base possibility"]],["Example: East Germany → West Germany",["Push: Stasi surveillance, shortages, Berlin Wall 1961","Pull: Wirtschaftswunder, higher wages, freedom"]]],"s":[["Introduction","State both places and main reasons."],["Body 1 · Political problems vs attractions",""],["Body 2 · Economic problems vs attractions",""],["Body 3 · Social problems vs attractions",""],["Conclusion",""]],"g":["What was happening in your country in the 1960s specifically?","What could you gain in the new place?","Did you balance push and pull?"],"ei":"If I were living in Guangdong in the 1960s, I would have had a strong urge to move to British Hong Kong. I faced hunger and political persecution under the Great Leap Forward's aftermath and the Cultural Revolution, while Hong Kong offered jobs, better living conditions and greater freedom.","ep":"Economically, life in China was very hard, while Hong Kong offered jobs. After the Great Leap Forward famine, food and goods were rationed. In contrast, Hong Kong's manufacturing boomed; textile, plastics and electronics factories employed hundreds of thousands. Even as a factory worker I could earn wages to support my family.","w":["Use concrete 1960s facts; handle both push and pull."]},{"id":"2018-1","t":["hke"],"type":"agree","q":"‘In the last two decades of the 20th century, Hong Kong was an international city with a strong Chinese identity and an increasing Hong Kong identity.’ Do you agree? Explain your view.","kw":["last two decades","international city","strong Chinese identity","increasing Hong Kong identity"],"focus":"Test three parts: international city, strong Chinese identity, increasing HK identity — in 1980-2000 only.","b":[["International city",["Global financial centre; container port","Western lifestyles, English, multinational firms"]],["Chinese identity",["Chinese festivals, customs, Cantonese culture","Support for China: donations for 1991 East China floods, 1989 support","Economic integration with Mainland after 1978"]],["HK identity",["Cantopop, HK films (golden age 1980s-90s), TVB","Pride in economic success, rule of law","Concern for HK's future; emigration; 1997 anxiety"]],["Complications",["Fear of Communist rule may weaken Chinese political identity","Identity can be dual"]]],"s":[["Introduction","Stand: largely agree — dual identity in an international city."],["Body 1 · International city",""],["Body 2 · Strong Chinese identity",""],["Body 3 · Increasing HK identity",""],["Body 4 · Limits","e.g. Chinese cultural vs political identity"],["Conclusion",""]],"g":["What evidence proves HK was an international city in 1980-2000?","How did Hongkongers show a Chinese identity?","What popular culture shows a distinct HK identity?","Did HK identity ‘increase’? Compare with earlier.","Could Chinese and HK identities co-exist?"],"ei":"In the 1980s and 1990s, Hong Kong was an international city in which a strong Chinese identity and an increasing Hong Kong identity co-existed. I largely agree with the statement, although the Chinese identity was stronger in culture than in politics.","ep":"Hong Kong identity grew in these two decades. Hong Kong films and Cantopop reached their peak, with stars such as the ‘Four Heavenly Kings’ becoming symbols of local culture. As the 1997 handover approached, people became more concerned about protecting Hong Kong's way of life, rule of law and freedoms. This sense of being different from the Mainland shows an increasing Hong Kong identity.","w":["Use 1980-2000 evidence only.","Discuss identities, not general history."]},{"id":"2018-2","t":["cn1","cn2"],"type":"compare","q":"Who – Sun Yat-sen (Sun Yixian) or Mao Zedong – do you think was a greater Chinese leader? Explain your view.","kw":["greater Chinese leader","Sun Yat-sen","Mao Zedong"],"focus":"Set criteria for ‘greatness’ (leadership, ideology, achievements, positive/negative impact), then compare both.","b":[["Criteria",["Vision/ideology","Achievements","Leadership skills","Positive vs negative impact"]],["Sun",["Three Principles; led 1911 Revolution; founded KMT; first United Front","But failed to unify; limited power"]],["Mao",["Sinicised Marxism; won 1949; unified China, land reform, national status","But Great Leap famine, Cultural Revolution"]]],"s":[["Introduction","Criteria + stand."],["Body 1 · Ideology",""],["Body 2 · Achievements",""],["Body 3 · Negative impact",""],["Conclusion",""]],"g":["What criteria will you use to judge ‘greatness’ (e.g. vision, achievements, leadership, impact)?","What were Sun's and Mao's ideologies, and which influenced China more?","What did each achieve in practice?","What negative impact did each have?","On balance, which leader scores higher on your criteria?"],"ei":"Measured by ideology, achievements and overall impact, Sun Yat-sen was a greater leader than Mao Zedong. Although Mao achieved more in power, his policies caused enormous suffering, while Sun laid the ideological foundation of modern China.","ep":"On achievements, Mao achieved more than Sun. Sun Yat-sen led the revolutionary movement that ended the monarchy in 1911, but he held power only briefly and failed to unify China, as power passed to Yuan Shikai and then the warlords. Mao Zedong, however, led the CCP to victory in 1949, unified mainland China, ended foreign privileges and carried out land reform that gave land to about 300 million peasants. But Mao's Great Leap Forward caused a famine that killed tens of millions, so his greater achievements came at a far greater human cost.","w":["Balance both leaders; compare instead of separate accounts."]},{"id":"2018-3","t":["jp"],"type":"agree","q":"Was Japan's development in the period after the Second World War up to the end of the 1960s primarily due to the US factor? Explain your view.","kw":["primarily","US factor","after the Second World War up to the end of the 1960s"],"focus":"Include SCAP as part of the US factor. Compare it with Japanese government and business initiatives.","b":[["US factor",["SCAP reforms: 1947 Constitution, land reform, zaibatsu break-up, labour unions","Reverse course; Dodge Line 1949","Korean War special procurement 1950-53","US security umbrella; low defence spending; US market and technology"]],["Japanese factors",["MITI industrial policy; income-doubling plan (Ikeda 1960)","High savings, educated workforce, work ethic","Enterprises: Toyota, Sony; keiretsu; lifetime employment"]]],"s":[["Introduction",""],["Body 1 · SCAP reforms",""],["Body 2 · Cold War support",""],["Body 3 · Japanese government",""],["Body 4 · Japanese enterprises and people",""],["Conclusion","Weigh."]],"g":["Is SCAP part of the US factor? (Yes — include it.)","Which US policies helped Japan's recovery in 1945-52?","How did the Korean War and the security treaty help Japan's economy?","What did the Japanese government (e.g. MITI, Ikeda) do?","What did Japanese enterprises and workers contribute? Which factor was primary?"],"ei":"Japan's development from 1945 to the end of the 1960s was largely but not primarily due to the US factor. The US created favourable conditions, but Japan's government and enterprises made the most of them.","ep":"The US factor laid the foundation for Japan's development. During the occupation, SCAP introduced the 1947 Constitution, carried out land reform that turned tenant farmers into owners, and broke up the zaibatsu. The Dodge Line of 1949 stopped inflation. Then, during the Korean War, the US placed special procurement orders worth about US$2.4 billion, which revived Japanese industry. However, the US only created the conditions; it was Japanese policies and enterprises that turned them into sustained growth in the 1960s.","w":["Treat SCAP as part of the US factor; compare explicitly."]},{"id":"2018-4","t":["ww"],"type":"assess","q":"Assess the effectiveness of international peace-keeping efforts in Europe in the period 1919-39.","kw":["Assess the effectiveness","international peace-keeping efforts","Europe","1919-39"],"focus":"Evaluate achievements AND limits of each effort (Paris Conference, League, Locarno, disarmament, Kellogg-Briand, appeasement).","b":[["Achievements",["League settled small disputes (Aaland 1921, Greece-Bulgaria 1925)","Locarno 1925 guaranteed western borders; Germany joined League 1926","Kellogg-Briand Pact 1928 signed by 65 nations","Dawes/Young Plans eased reparations; peace in 1920s"]],["Limits",["Geneva Disarmament Conference failed 1932-34; Germany left","League failed over Abyssinia 1935-36","Locarno did not cover eastern borders","Appeasement: Munich 1938 only delayed war"]]],"s":[["Introduction","Stand: effective in the 1920s, ineffective in the 1930s."],["Body 1 · Peace settlement and League (1920s)",""],["Body 2 · Locarno and Kellogg-Briand",""],["Body 3 · Disarmament and League failure (1930s)",""],["Body 4 · Appeasement",""],["Conclusion",""]],"g":["Which peace-keeping efforts will you assess (Paris Conference, League, Locarno, Kellogg-Briand, disarmament, appeasement)?","What did each achieve in the 1920s?","Why did they fail in the 1930s?","Did appeasement keep peace at all, even for a short time?","Is your judgement balanced between achievements and failures?"],"ei":"International peace-keeping efforts in Europe from 1919 to 1939 were effective in the 1920s, when the League of Nations, the Locarno Treaties and the Kellogg-Briand Pact reduced tension. However, they were ineffective in the 1930s, when disarmament talks collapsed and collective security and appeasement failed to stop aggression.","ep":"In the 1920s, the Locarno Treaties were an effective peace-keeping effort. In 1925, Germany, France and Belgium accepted their common borders, with Britain and Italy as guarantors. Germany joined the League of Nations in 1926, and Stresemann, Briand and Chamberlain received the Nobel Peace Prize. The ‘spirit of Locarno’ reduced Franco-German hostility. However, Locarno did not guarantee Germany's eastern borders, a weakness Hitler later exploited.","w":["Assess both achievements and shortcomings."]},{"id":"2018-5","t":["mc"],"type":"extent","q":"How ‘cold’ was the Cold War? Explain your view.","kw":["How ‘cold’"],"focus":"‘Cold’ = no large-scale direct fighting between the US and USSR. ‘Hot’ = actual wars. Assess the balance over 1946-91.","b":[["Evidence it was cold",["The superpowers never fought each other directly","Competition by other means: propaganda, arms race, space race, espionage, aid (Marshall Plan)","Crises ended without war: Berlin 1948-49, Cuba 1962","Diplomacy: summits, hotline 1963, SALT"]],["Evidence it was ‘hot’",["Proxy wars: Korea 1950-53 (Chinese vs US forces), Vietnam 1965-73 (58,000 US dead), Afghanistan 1979-89","Soviet pilots secretly flew in Korea","Conflicts in Africa, Middle East with superpower arms","Near-war moments: Cuban Missile Crisis, Able Archer 1983"]]],"s":[["Introduction","Define ‘cold’ vs ‘hot’. Stand: cold between the superpowers, but hot in the Third World."],["Body 1 · Cold: no direct war; non-military competition","Arms, space race, propaganda."],["Body 2 · Cold: crises managed peacefully","Berlin, Cuba, hotline."],["Body 3 · Hot: proxy wars","Korea, Vietnam, Afghanistan."],["Body 4 · Hot moments: near nuclear war","Cuba 1962, 1983."],["Conclusion","Give a clear degree of ‘coldness’."]],"g":["What does ‘cold’ mean in ‘Cold War’? (Not ‘bad relations’.)","Did US and Soviet soldiers ever fight each other directly?","Name three proxy wars and who backed each side.","Why did nuclear weapons keep the war ‘cold’?","Is the answer the same for Europe and for Asia?"],"ei":"The term ‘Cold War’ describes a conflict in which the two superpowers did not fight each other directly. In this sense, the Cold War was quite cold: the US and the USSR competed through arms, propaganda and crises that were resolved without war. However, it was ‘hot’ in the developing world, where proxy wars such as Korea, Vietnam and Afghanistan killed millions.","ep":"The Cold War was ‘hot’ in Asia through proxy wars. In the Korean War (1950-53), US-led UN forces fought North Korea and Chinese volunteers supplied with Soviet weapons, and Soviet pilots secretly took part in air battles. About three million people died. Similarly, in the Vietnam War, the US sent over 500,000 troops while the USSR and China supplied North Vietnam. Although the superpowers avoided open war with each other, their rivalry produced large-scale fighting elsewhere.","w":["Understand ‘cold’ as the opposite of ‘hot war’, not simply bad relations."]},{"id":"2018-6","t":["mc"],"type":"agree","q":"Do you agree that foreign intervention was the major factor in causing racial conflicts in the Balkans and Arab-Israeli conflicts after the Second World War? Explain your view.","kw":["foreign intervention","major factor","racial conflicts in the Balkans","Arab-Israeli conflicts"],"focus":"Test foreign intervention against internal factors (nationalism, religion, history, economics) for BOTH regions.","b":[["Balkans",["Foreign: Tito's Yugoslavia held together under Cold War; end of Cold War removed support; Germany's early recognition of Croatia/Slovenia 1991; NATO bombing 1999","Internal: ethnic nationalism (Milosevic, Tudjman), religious differences (Orthodox, Catholic, Muslim), historical grievances (WWII Ustaše), economic crisis 1980s"]],["Arab-Israeli",["Foreign: British Mandate, Balfour; UN Partition 1947; superpower arms; Suez 1956","Internal: Zionism vs Arab/Palestinian nationalism, religion (Jerusalem), land and water"]]],"s":[["Introduction","Stand: disagree — internal factors were the root causes; foreign intervention worsened them."],["Body 1 · Balkans: internal causes",""],["Body 2 · Balkans: foreign intervention",""],["Body 3 · Arab-Israeli: internal causes",""],["Body 4 · Arab-Israeli: foreign intervention",""],["Conclusion","Compare across both."]],"g":["What held Yugoslavia together before 1980?","Who were the nationalist leaders in the 1990s?","Did the UN partition plan cause or reflect the conflict?","In both regions, what would remain if foreign powers had stayed out?"],"ei":"Foreign intervention contributed to the racial conflicts in the Balkans and the Arab-Israeli conflicts, but it was not the major factor. In both regions, nationalism, religious differences and historical grievances were the root causes, while foreign powers mainly worsened or shaped the conflicts.","ep":"In the Balkans, internal nationalism was more important than foreign intervention. After Tito's death in 1980 and economic crisis, leaders such as Slobodan Milosevic stirred up Serbian nationalism. When Slovenia and Croatia declared independence in 1991, Serb minorities, backed by the Yugoslav army, fought to stay united with Serbia. In Bosnia, ethnic cleansing culminated in the Srebrenica massacre of 1995. These conflicts came from ethnic and religious hatreds within Yugoslavia, while foreign recognition of new states only sped them up.","w":["Cover both regions; weigh factors."]},{"id":"2018-7","t":["x"],"type":"agree","q":"‘Development in the first half of the 20th century was characterised more by change than continuity.’ Do you agree? Explain your answer with reference to the development of one country/region within your history course.","kw":["more by change than continuity","one country/region","first half of the 20th century"],"focus":"Pick one country (e.g. China). Compare change and continuity in several aspects (political, economic, social, cultural, foreign relations) 1900-50.","b":[["China — change",["Political: monarchy → republic 1912 → KMT → PRC 1949","Cultural: exam abolished 1905; May Fourth; vernacular","Social: new classes (workers, students), women's status","Foreign: end of extraterritoriality 1943"]],["China — continuity",["Authoritarian rule persisted (Yuan, warlords, KMT tutelage)","Rural poverty, landlordism until land reform","Foreign aggression (Japan) and weakness","Confucian values in rural society"]],["Alternative: Japan",["Change: party politics → militarism → occupation democracy","Continuity: emperor, bureaucracy, zaibatsu"]]],"s":[["Introduction","Country + stand."],["Body 1 · Political",""],["Body 2 · Socio-economic",""],["Body 3 · Cultural",""],["Body 4 · Foreign relations",""],["Conclusion","Weigh overall."]],"g":["In each aspect, what changed and what stayed the same?","Were changes deep or superficial?","Were changes mostly in cities while countryside stayed the same?"],"ei":"In China, development in the first half of the 20th century was characterised more by change than continuity. Its political system, culture and international position changed fundamentally, although authoritarian rule and rural poverty continued.","ep":"Politically, China changed dramatically. In 1900 it was ruled by the Qing emperor; by 1912 it was a republic; from 1928 it was a one-party state under the KMT; and in 1949 the CCP established the People's Republic. Yet authoritarian rule was a continuity: none of these governments allowed real democracy.","w":["Don't narrate; focus on change vs continuity within 1900-50."]},{"id":"2019-1","t":["hkp","hke"],"type":"extent","q":"To what extent did Hong Kong undergo transformation in the period 1967-97? Explain your view with reference to its socio-economic and political developments in that period.","kw":["To what extent","transformation","1967-97","socio-economic","political"],"focus":"Transformation = fundamental change. Weigh change vs continuity in socio-economic and political areas.","b":[["Economic transformation",["From manufacturing to services, finance and trade after 1978","Northward shift of factories to Pearl River Delta"]],["Social transformation",["Public housing, 9-year free education, new towns, MTR","Rise of middle class, HK identity, Westernised lifestyle"]],["Political transformation",["From appointed to partly elected LegCo (1985, 1991, 1995)","Parties formed; handover 1997"]],["Continuity",["British colonial rule until 1997; Governor's power","Executive-led system; free market; Chinese traditions"]]],"s":[["Introduction","Stand: great extent of transformation, especially economic/social; political change significant but partial."],["Body 1 · Economic",""],["Body 2 · Social",""],["Body 3 · Political",""],["Body 4 · Continuity",""],["Conclusion",""]],"g":["What is the difference between change and transformation?","Compare HK in 1967 and 1997 — what's fundamentally different?","What stayed the same?","Which area changed the most?"],"ei":"Between 1967 and 1997, Hong Kong underwent transformation to a great extent. Its economy shifted from manufacturing to services, society became more affluent and educated, and politics moved towards representative government. However, colonial rule and the executive-led system continued until 1997.","ep":"Hong Kong's economy was transformed between 1967 and 1997. In the late 1960s, manufacturing was the largest sector and employed over 40% of the workforce. After China's Reform and Opening-up in 1978, factories moved north to the Pearl River Delta to use cheaper land and labour. By 1997, services made up over 80% of GDP, and Hong Kong had become a leading international financial and trading centre. This was a fundamental change in the structure of the economy, not just growth.","w":["Discuss continuity to address ‘to what extent’.","Do not write at length about pre-1967."]},{"id":"2019-2","t":["cn1"],"type":"agree","q":"‘Both the late Qing Government (1901-12) and the Nanjing Nationalist Government (1928-37) aimed to promote economic more than political development.’ Do you agree? Explain your view.","kw":["aimed","economic more than political","1901-12","1928-37"],"focus":"Focus on AIMS. Judge each government separately then compare.","b":[["Late Qing",["Political aims: preparatory constitutionalism, abolish Six Boards, provincial assemblies — to save the dynasty","Economic aims: Ministry of Commerce, Ta Ching Bank, railways"]],["Nanjing",["Political aims: political tutelage, one-party rule, unification","Economic aims: tariff autonomy, fabi 1935, Central Bank, infrastructure"]]],"s":[["Introduction","Stand: disagree for Qing (political prime); partly agree for Nanjing."],["Body 1 · Qing political aims",""],["Body 2 · Qing economic aims",""],["Body 3 · Nanjing political aims",""],["Body 4 · Nanjing economic aims",""],["Conclusion",""]],"g":["What was the main worry of each government when it started reforms?","Which reforms show political aims, and which show economic aims?","Were economic reforms serving political goals (e.g. to fund the army or keep power)?","Is it fair to judge by counting reforms? What is a better way?","Do you give equal attention to both governments?"],"ei":"I disagree with the statement. The late Qing government mainly aimed at political survival through constitutional reform, while the Nanjing government pursued both economic development and political consolidation, with political control as its priority.","ep":"The late Qing government aimed to promote political more than economic development. After Japan's victory over Russia in 1905, many Chinese believed that constitutional government made Japan strong. To keep the dynasty in power, the Qing sent officials abroad to study constitutions, abolished the Six Boards and set up modern ministries in 1906, and announced a nine-year plan for constitutional government in 1908. Economic reforms such as setting up the Ministry of Commerce were real but secondary. The main aim was political survival.","w":["Do not confuse aims with background.","Balance both governments."]},{"id":"2019-3","t":["sea"],"type":"agree","q":"‘Decolonisation in Southeast Asia was primarily caused by the Japanese occupation during the Second World War.’ Do you agree? Explain your view.","kw":["primarily","Japanese occupation","Decolonisation in Southeast Asia"],"focus":"Compare the Japanese occupation with other factors (nationalist leaders, weakened colonial powers, international pressure).","b":[["Japanese occupation",["Destroyed myth of Western superiority (fall of Singapore 1942)","‘Asia for the Asians’; trained local armies (PETA in Indonesia, Burma Independence Army)","Granted nominal independence to Burma, Philippines 1943; Indonesia proclaimed 1945"]],["Other factors",["Nationalist movements before the war (Sukarno, Ho Chi Minh, Aung San)","Colonial powers weakened after WWII","US and UN anti-colonialism; Atlantic Charter","Cold War considerations"]]],"s":[["Introduction",""],["Body 1 · Japanese occupation",""],["Body 2 · Local nationalism",""],["Body 3 · Decline of colonial powers",""],["Body 4 · International pressure",""],["Conclusion","Weigh."]],"g":["What did the Japanese occupation do that encouraged independence?","Did nationalist movements exist before 1941? Give examples.","Why were the colonial powers too weak to hold on after 1945?","How did the US and the UN influence decolonisation?","Which factor was more fundamental?"],"ei":"The Japanese occupation during the Second World War was an important cause of decolonisation in Southeast Asia, because it destroyed the prestige of the Western colonial powers and gave nationalists political and military experience. However, it was not the primary cause. Nationalist movements had existed long before the war, and the weakness of the colonial powers and international pressure after 1945 were also crucial.","ep":"The Japanese occupation destroyed the myth of Western superiority. In early 1942, Japan quickly defeated the British in Malaya and Singapore, capturing about 80,000 troops, and drove the Dutch from Indonesia and the Americans from the Philippines. Southeast Asians saw that Europeans could be beaten by an Asian army. The Japanese also trained local forces, such as PETA in Indonesia, which later fought the Dutch. This made it much harder for the colonial powers to return after 1945.","w":["Compare factors; avoid general narration."]},{"id":"2019-4","t":["ww"],"type":"agree","q":"‘Nazi aggression was more important than the appeasement policy in causing the Second World War.’ Do you agree? Explain your view.","kw":["more important","Nazi aggression","appeasement policy"],"focus":"Compare the two factors directly, with correct understanding of appeasement (Britain and France, 1930s).","b":[["Nazi aggression",["Ideology: Lebensraum, destroy Versailles","Rearmament 1935; Rhineland 1936; Anschluss 1938; Sudetenland 1938; Prague 1939; Poland 1939"]],["Appeasement",["Britain (Chamberlain) and France gave in to demands","Anglo-German Naval Agreement 1935; no action on Rhineland; Munich 1938","Encouraged Hitler; made USSR distrust West → Nazi-Soviet Pact"]]],"s":[["Introduction",""],["Body 1 · Nazi aggression as the active cause",""],["Body 2 · Appeasement as the enabling cause",""],["Body 3 · Direct comparison",""],["Conclusion",""]],"g":["What is appeasement, and who carried it out? (Britain and France, not the USA.)","List Hitler's aggressive acts from 1935 to 1939.","Would war have happened without Hitler's aims, even with appeasement?","Would Hitler have gone as far without appeasement?","Is each paragraph comparing the two factors?"],"ei":"Nazi aggression was more important than the appeasement policy in causing the Second World War. Hitler's aims of destroying the Treaty of Versailles and gaining Lebensraum made war likely, and he took the active steps that led to war. Appeasement made his aggression easier, but it was a response to Hitler rather than a cause on its own.","ep":"Appeasement encouraged Hitler but did not create his aims. At the Munich Conference in September 1938, Chamberlain and Daladier agreed to give the Sudetenland to Germany without consulting Czechoslovakia. This convinced Hitler that Britain and France would not fight, and in March 1939 he occupied the rest of Czechoslovakia. However, Hitler had already planned expansion in Mein Kampf, so appeasement only affected the speed of his aggression, not its direction.","w":["Correct understanding of appeasement; compare throughout."]},{"id":"2019-5","t":["mc"],"type":"extent","q":"To what extent was the end of the Cold War due to Mikhail Gorbachev's liberalisation policy? Explain your view.","kw":["To what extent","end of the Cold War","Gorbachev's liberalisation policy"],"focus":"Focus on LIBERALISATION (glasnost, democratisation, non-intervention in Eastern Europe) vs other factors.","b":[["Liberalisation policy",["Glasnost 1986: openness, criticism allowed","Democratisation: 1989 elections to Congress of People's Deputies","Abandoned Brezhnev Doctrine (‘Sinatra Doctrine’) → 1989 revolutions in Eastern Europe, Berlin Wall fell","Nationalities demanded independence → USSR collapsed 1991"]],["Other factors",["Soviet economic stagnation; Afghanistan cost","Reagan's pressure: arms build-up, SDI","Solidarity in Poland; people's movements in Eastern Europe","Pope John Paul II; Western economic success"]]],"s":[["Introduction","Stand: to a large extent — liberalisation was the immediate trigger, but economic decline and US pressure made reform necessary."],["Body 1 · Glasnost and democratisation",""],["Body 2 · Liberalising Eastern Europe policy",""],["Body 3 · Other factors",""],["Body 4 · Weighing",""],["Conclusion",""]],"g":["Which of Gorbachev's policies were ‘liberalisation’ (not perestroika's economic parts)?","How did glasnost weaken the Communist Party?","Why didn't Gorbachev send tanks in 1989?","Why did Gorbachev need reforms in the first place?"],"ei":"The end of the Cold War was to a large extent due to Gorbachev's liberalisation policy, which allowed free expression in the USSR and freedom for Eastern Europe. However, the Soviet economic crisis and US pressure were the reasons Gorbachev had to reform.","ep":"Gorbachev's decision to stop controlling Eastern Europe directly ended the Cold War division of Europe. In 1989, he made it clear that the USSR would not use force to keep communist governments in power. Poland held semi-free elections in June 1989, Hungary opened its border, and the Berlin Wall fell in November 1989. By 1990, Germany was reunited.","w":["Stick to liberalisation, not every Gorbachev policy."]},{"id":"2019-6","t":["mc","soc"],"type":"agree","q":"‘The United Nations was more successful in solving the apartheid in South Africa than the conflicts between Israel and the Arabs.’ Do you agree? Explain your view.","kw":["more successful","apartheid in South Africa","conflicts between Israel and the Arabs"],"focus":"Compare the UN's effectiveness in two cases using the same criteria.","b":[["Apartheid",["General Assembly condemnations from 1946; apartheid a ‘crime against humanity’ 1973","Special Committee against Apartheid 1962","Arms embargo 1977 (mandatory); sports and cultural boycotts; suspension from GA 1974","Contributed to isolation and pressure → reforms 1990-94"]],["Arab-Israeli",["Partition plan 1947 rejected by Arabs → war","UNEF 1956-67; UNTSO; UNIFIL 1978","Resolutions 242 and 338 not implemented","Peace came via US mediation (Camp David 1978, Oslo 1993 via Norway)"]]],"s":[["Introduction","Stand: agree."],["Body 1 · Methods compared",""],["Body 2 · Results compared",""],["Body 3 · Limits in both",""],["Conclusion",""]],"g":["What actions did the UN take against apartheid?","What actions did the UN take in the Arab-Israeli conflict?","What were the outcomes in each case by the 1990s?","Who brokered the main Arab-Israeli peace agreements?","Is your comparison using the same criteria for both cases?"],"ei":"I agree that the United Nations was more successful in solving apartheid in South Africa than the Arab-Israeli conflict. Its long campaign of condemnation, embargoes and boycotts helped isolate South Africa and contributed to the end of apartheid in 1994. In the Arab-Israeli conflict, however, the UN could only arrange ceasefires, and real peace agreements were brokered by the United States.","ep":"In the Arab-Israeli conflict, the UN's success was limited. After the Six-Day War of 1967, the Security Council passed Resolution 242, calling for Israel's withdrawal from occupied territories and recognition of all states in the region. However, it was never fully implemented, and war broke out again in 1973. The most important peace deal, the Egypt–Israel treaty of 1979, was brokered by US President Carter at Camp David, not by the UN.","w":["Compare both cases equally."]},{"id":"2019-7","t":["x"],"type":"elaborate","q":"‘National interest may lead to war; it may also lead to mutual cooperation.’ Elaborate this statement with two examples within your history course, one for each scenario.","kw":["National interest","lead to war","mutual cooperation","two examples"],"focus":"Define national interest. Example 1: how it led to war. Example 2: how it led to cooperation. Keep linking to ‘national interest’.","b":[["National interest → war",["Japan's need for resources/markets → Manchuria 1931, Pacific War 1941","Germany's Lebensraum → invasion of Poland 1939"]],["National interest → cooperation",["France and West Germany: security and coal/steel → ECSC 1951, EEC 1957","ASEAN 1967: common security against communism and economic growth","China–Japan 1972/1978: economic and strategic interests"]]],"s":[["Introduction","Define national interest (security, economic, territorial, prestige)."],["Body 1 · Example of war",""],["Body 2 · Example of cooperation",""],["Body 3 · Why the same factor produced different results",""],["Conclusion",""]],"g":["What is national interest?","In your war example, which interest was pursued?","In your cooperation example, which interest was shared?","Why did one lead to war and the other to cooperation?"],"ei":"National interest refers to what a country considers important for its security, economy and status. Japan's pursuit of resources and markets led to war in Asia in the 1930s, while France and West Germany's shared interests in security and recovery led to cooperation through the ECSC and EEC.","ep":"National interest led France and West Germany to cooperate. After the war, France wanted security against a revived Germany, while West Germany wanted equality and recovery. The Schuman Plan of 1950 served both interests by placing their coal and steel under a joint authority, creating the ECSC in 1951.","w":["Relate both examples closely to national interest."]},{"id":"2020-1","t":["hke"],"type":"how","q":"How was Hong Kong's economic development during British rule up to 1997 affected by the China factor? Explain your view.","kw":["How","economic development","China factor","up to 1997"],"focus":"Explain the ways China affected HK's economy (positive and negative) across the whole colonial period. Not a relative-importance question.","b":[["Entrepôt era (to 1950)",["China trade made HK an entrepôt","Strike-Boycott 1925-26 damaged the economy","Refugees brought capital and labour"]],["Industrialisation (1950s-70s)",["UN embargo (1951) ended entrepôt trade, forced industrialisation","Shanghai industrialists and refugees brought capital, skills, cheap labour","China supplied food and water cheaply"]],["Reform era (1978-97)",["Reform and Opening-up: factories moved north; HK became service/finance centre","Re-export trade boomed; HK as gateway to China","1982-84 sovereignty crisis: HK dollar crash 1983"]]],"s":[["Introduction","Stand: China affected HK's economy fundamentally, both positively and negatively, in every stage."],["Body 1 · Before 1950",""],["Body 2 · 1950-78",""],["Body 3 · 1978-97",""],["Conclusion",""]],"g":["How did the Korean War embargo change HK's economy?","What did refugees bring?","What effect did Reform and Opening-up have?","Was the China factor always positive?"],"ei":"During British rule, Hong Kong's economic development was deeply affected by the China factor. China's trade made Hong Kong an entrepôt, the embargo and refugee influx pushed it to industrialise, and Reform and Opening-up turned it into a service and financial centre.","ep":"The China factor forced Hong Kong to change from an entrepôt into an industrial city in the 1950s. After China joined the Korean War, the UN imposed an embargo on China in 1951, and Hong Kong's entrepôt trade collapsed. At the same time, industrialists from Shanghai brought capital and technology, and refugees provided cheap labour. As a result, textile and garment factories grew rapidly, and by the 1960s manufactured goods were Hong Kong's main exports.","w":["Do not compare with ‘other factors’ — the question asks ‘how’."]},{"id":"2020-2","t":["cn2"],"type":"extent","q":"How far were the methods of economic development adopted in the Maoist period different from those in the post-Mao period? Explain your view.","kw":["How far","methods","Maoist period","post-Mao period"],"focus":"Compare METHODS (not effectiveness): ownership, planning, foreign links, mobilisation, role of experts.","b":[["Maoist",["Soviet aid only; self-reliance after 1960","Collectivisation, communes; planned economy; heavy industry","Mass movements (Great Leap)"]],["Post-Mao",["Opened to capitalist countries, FDI, SEZs","Household responsibility system; socialist market economy","Respect for experts; Four Modernisations"]],["Similarities",["State-owned enterprises remained; CCP leadership; Five-Year Plans continued"]]],"s":[["Introduction",""],["Body 1 · Ownership and planning",""],["Body 2 · External relations",""],["Body 3 · Mobilisation vs expertise",""],["Body 4 · Continuities",""],["Conclusion",""]],"g":["What methods did the Maoist period use (ownership, planning, mobilisation, foreign links)?","What methods did the post-Mao period use?","Which methods changed completely, and which continued?","Did state-owned enterprises disappear after Mao? (No — be careful.)","What is your judgement on ‘how far’?"],"ei":"The methods of economic development in the Maoist and post-Mao periods were different to a large extent, especially in ownership, planning and opening to the world, but continuity remained in state ownership and party leadership.","ep":"The methods differed greatly in agriculture. Under Mao, land was collectivised, and in 1958 about 700 million peasants were organised into 26,000 people's communes, where work and income were shared. After 1978, the household responsibility system allowed families to farm contracted plots and sell surplus on the market. Grain output rose rapidly and the communes were dissolved by 1984. This was a clear shift from collective to household-based production, although land remained collectively owned, showing some continuity.","w":["Methods, not effectiveness. Avoid factual errors."]},{"id":"2020-3","t":["jp"],"type":"agree","q":"‘The USA facilitated more than hindered Japan's development after the Second World War.’ Do you agree? Explain your view with reference to Japan's development in the period 1945-2000.","kw":["facilitated more than hindered","1945-2000"],"focus":"Weigh US help and hindrance across the whole 1945-2000 period, not only the 1950s.","b":[["Facilitated",["SCAP democratisation, peace constitution","Security treaty: low defence spending","Korean and Vietnam War procurement; open US market; technology transfer"]],["Hindered",["Okinawa under US control till 1972; bases","Trade friction: textile, auto quotas 1981","Plaza Accord 1985: yen appreciation → bubble","Nixon shocks 1971"]]],"s":[["Introduction",""],["Body 1 · Political",""],["Body 2 · Security",""],["Body 3 · Economic help",""],["Body 4 · Hindrances (1970s-90s)",""],["Conclusion",""]],"g":["What did the US do for Japan politically and militarily after 1945?","How did the US help Japan's economy in the 1950s-60s?","In what ways did the US hinder Japan (Okinawa, trade friction, Nixon shocks, Plaza Accord)?","Did the balance change after 1970?","Is your final judgement clear about ‘more than’?"],"ei":"The USA facilitated more than hindered Japan's development from 1945 to 2000. It gave Japan a democratic constitution, military protection and access to its market, which made the economic miracle possible. However, from the 1970s, US pressure over trade and currency increasingly hindered Japan's economy.","ep":"From the 1970s, the US increasingly hindered Japan's economic development. In 1971, the ‘Nixon shocks’ ended the fixed yen–dollar rate and imposed a surcharge on imports. In the 1980s, the US forced Japan to accept voluntary export restraints on cars. In 1985, the Plaza Accord led to a sharp rise in the yen, which hurt exports and encouraged easy credit, contributing to the asset bubble that burst in the early 1990s. These show that US policy could seriously harm Japan.","w":["Cover up to 2000, not just the 1950s."]},{"id":"2020-4","t":["ww"],"type":"extent","q":"To what extent was the Second World War a consequence of the Paris Peace Settlement (1919-23)? Explain your view with reference to Europe's historical development in the period 1919-39.","kw":["To what extent","consequence","Paris Peace Settlement","1919-39"],"focus":"Explain the causal link from the Settlement to WWII, then weigh it against other factors (Depression, League's weakness, appeasement, dictators).","b":[["Settlement as cause",["Harsh terms → German revisionism and rise of Nazism","Italy's ‘mutilated victory’ → Fascism","New democracies in Central Europe weak and full of minorities → easy targets (Czechoslovakia)","Terms so harsh that Britain later felt guilty and would not enforce them → appeasement"]],["Other factors",["Great Depression: economic collapse, Hitler's rise, isolationism","League of Nations had no army; failed over Manchuria/Abyssinia","Appeasement policy of Britain and France","Nazi ideology and aggression"]]],"s":[["Introduction","Stand: to a considerable extent — it created the conditions, but other factors turned them into war."],["Body 1 · Settlement → totalitarian regimes","Germany and Italy."],["Body 2 · Settlement → weak new states and weak enforcement","Czechoslovakia, Poland; British guilt."],["Body 3 · Other factors","Depression; League; appeasement."],["Body 4 · Weighing","The Settlement was necessary but not sufficient."],["Conclusion","Clear extent."]],"g":["Explain HOW the Settlement caused each outcome — don't just state it.","Why did British leaders feel Versailles was unfair?","Which new states did Hitler later attack, and why were they weak?","Would the Settlement alone have led to war without the Depression?","What is your final ‘extent’?"],"ei":"The Second World War was to a considerable extent a consequence of the Paris Peace Settlement. The Settlement created resentful powers, weak new states and treaties that even Britain did not want to enforce. However, the Great Depression, the weakness of the League and appeasement were also necessary to turn these problems into war.","ep":"The Settlement created weak new democracies that could not resist Nazi aggression. Czechoslovakia was created in 1919, but it contained over three million Germans in the Sudetenland. In 1938, Hitler used these Germans as an excuse to demand the Sudetenland, and at Munich Britain and France agreed. Czechoslovakia was left defenceless and was occupied in March 1939. This shows a clear causal link between the territorial terms of the Settlement and Hitler's expansion.","w":["Explain causal links.","Weigh the Settlement against other factors."]},{"id":"2020-5","t":["mc"],"type":"relimp","q":"Assess the relative importance of ideological difference and national interest with respect to the development of the Cold War in the period 1946-91.","kw":["relative importance","ideological difference","national interest","1946-91"],"focus":"Make the two FACTORS the subject of each paragraph (not the crises). Compare them across stages.","b":[["Ideological difference",["Capitalism/democracy vs communism; mutual suspicion","Truman Doctrine framed as free vs totalitarian world","Soviet support for world revolution; domino theory → Korea, Vietnam","Reagan's ‘evil empire’; ideology collapsed with Gorbachev → Cold War ended"]],["National interest",["USSR wanted a security buffer in Eastern Europe","US wanted open markets and allies (Marshall Plan)","Détente for economic/security reasons; Sino-Soviet split shows interest over ideology (Nixon in China 1972)","Arms control when costs too high"]]],"s":[["Introduction","Stand: e.g. national interest was more important; ideology was the language that justified it and intensified mistrust."],["Body 1 · Ideology in the origins and escalation",""],["Body 2 · National interest in the origins",""],["Body 3 · National interest overriding ideology (détente, China)",""],["Body 4 · Ideology's return and end (1980s)",""],["Conclusion",""]],"g":["Can you find a case where a country acted against its ideology for its interests?","Why did the USSR want Eastern Europe?","Did ideology or interest end the Cold War?","Is each paragraph about a factor, not a crisis?"],"ei":"Both ideological difference and national interest drove the Cold War, but national interest was more important. Ideology shaped how each side saw the other, while decisions to confront or compromise were mostly based on security and economic interests.","ep":"National interest sometimes overrode ideology. Although China and the USSR were both communist, they split in the 1960s over border disputes and leadership, fighting along the Ussuri River in 1969. The US, despite being anti-communist, then improved relations with China; Nixon visited Beijing in 1972 to put pressure on the USSR. This shows that both superpowers put national interest before ideological unity.","w":["Make factors, not crises, the subject of your paragraphs.","Discuss both factors across the period."]},{"id":"2020-6","t":["mc"],"type":"agree","q":"‘Israel should be primarily held responsible for its long-lasting conflicts with the Arabs after the Second World War.’ Do you agree? Explain your view.","kw":["primarily","held responsible","Israel","long-lasting conflicts"],"focus":"Weigh Israel's responsibility against other factors (Arab states, Palestinians, history, foreign powers).","b":[["Israel's responsibility",["Pre-emptive war 1967; occupation of West Bank, Gaza, Golan, Sinai","Settlements in occupied territories","Invasion of Lebanon 1982","Refusal to accept right of return"]],["Other factors",["Arab states rejected partition, invaded 1948; Egypt/Syria attacked 1973","Arab League's ‘Three Noes’ (Khartoum 1967)","PLO terrorism; Hamas","Historical roots: Balfour, British Mandate","Foreign powers' arms and Cold War"]]],"s":[["Introduction","Stand: disagree — responsibility shared."],["Body 1 · Israel's actions",""],["Body 2 · Arab states' actions",""],["Body 3 · Palestinian groups",""],["Body 4 · External and historical factors",""],["Conclusion",""]],"g":["Which wars did Israel start, and which were started by Arab states?","How did Israel's occupation and settlements prolong the conflict?","What was the Arab states' attitude towards Israel's existence before 1977?","What role did Palestinian groups and foreign powers play?","Is ‘primarily’ answered with a clear comparison?"],"ei":"Israel should not be held primarily responsible. Its occupation and settlements prolonged the conflict, but Arab rejection of Israel, Palestinian violence and foreign intervention were equally important.","ep":"Israel's settlement policy made the conflict long-lasting. After capturing the West Bank, Gaza and the Golan Heights in 1967, Isra
