Great Depression, and territorial threats from German and Italian expansion. After the Second World War, some of these threats were resolved, such as fascist expansion and economic collapse, but others reappeared in a new form in the Cold War.","ep":"The economic threat was largely resolved in Western Europe. In the 1930s, the Great Depression caused mass unemployment and protectionism, which helped extremists gain power. After the war, the USA launched the Marshall Plan in 1947, giving about US$13 billion to Western Europe, and the OEEC was set up in 1948 to coordinate recovery. However, Eastern Europe was excluded and tied to the USSR through Comecon, so the economic threat was only partly resolved.","w":["Don't just narrate causes of WWII.","Keep political and territorial threats distinct."]},{"id":"2025-5","t":["mc"],"type":"extent","q":"‘The development of the Cold War was dominated by the roles played by the USSR in the period 1979-90.’ To what extent do you agree with this statement? Explain your answer.","kw":["To what extent","dominated","roles played by the USSR","1979-90"],"focus":"Name the USSR's roles in 1979-90 (aggressor, competitor, economic dominator, peacemaker) and compare with other factors (US, Western Europe, Eastern European peoples).","b":[["USSR's roles",["Aggressor: invasion of Afghanistan 1979 → end of détente","Competitor: SS-20 missiles; arms race; space","Dominator of Eastern Europe: Comecon, pressure on Poland (martial law 1981)","Reformer and peacemaker: Gorbachev's New Thinking, INF 1987, withdrawal from Afghanistan 1988-89, non-intervention 1989"]],["Other factors",["US: Reagan's arms build-up, SDI 1983, Reagan Doctrine aid to mujahideen","Western Europe: deployment of Pershing missiles 1983; economic success","Eastern European peoples: Solidarity, 1989 revolutions","Pope John Paul II"]]],"s":[["Introduction","Stand: to a large extent — the USSR's actions started the Second Cold War and its reforms ended it, but US pressure and popular movements were also important."],["Body 1 · USSR as aggressor and competitor (1979-85)",""],["Body 2 · USSR as peacemaker (1985-90)",""],["Body 3 · US role",""],["Body 4 · Other actors",""],["Conclusion",""]],"g":["What did the USSR do in 1979 that changed the Cold War?","How did Gorbachev's roles differ from Brezhnev's?","How did Reagan's policies pressure the USSR?","Who actually brought down communism in Eastern Europe?"],"ei":"From 1979 to 1990, the development of the Cold War was dominated to a large extent by the roles of the USSR. Its invasion of Afghanistan began the ‘Second Cold War’, and Gorbachev's reforms ended it. However, American pressure and the actions of Eastern European peoples also shaped events.","ep":"The USSR acted as an aggressor that renewed Cold War tension. In December 1979, Soviet troops invaded Afghanistan to support a communist government. The US responded with the Carter Doctrine, a grain embargo and a boycott of the 1980 Moscow Olympics, and the Senate refused to ratify SALT II. Détente ended. This shows that a Soviet action determined the direction of the Cold War at the start of the period.","w":["Assess importance of USSR roles, don't just narrate Soviet events."]},{"id":"2025-6","t":["mc","soc"],"type":"assess","q":"Assess the effectiveness of the actions taken by the United Nations on the Arab-Israeli conflict in the period 1947-91.","kw":["Assess the effectiveness","actions taken by the United Nations","Arab-Israeli conflict","1947-91"],"focus":"Evaluate UN actions: what they achieved (ceasefires, humanitarian aid) vs limits (no lasting settlement, reliance on others).","b":[["Achievements (relaxed tension)",["Partition Plan 1947 (Resolution 181) gave Israel legitimacy","Mediation: Bernadotte, Bunche → 1949 armistices","UNTSO observers; UNEF 1956-67 kept Egypt–Israel border quiet","UNRWA 1949: relief for Palestinian refugees","Resolutions 242 (1967) and 338 (1973) as basis of later peace; UNDOF on Golan 1974; UNIFIL Lebanon 1978"]],["Limitations (fragile peace)",["Partition rejected by Arabs; war 1948","UNEF withdrawn on Nasser's request 1967 → Six-Day War","Resolutions not enforced; US vetoes","Peace deals made outside UN (Camp David 1978)","Refugee problem unsolved; Intifada 1987"]]],"s":[["Introduction","Stand: limited effectiveness — ceasefires and relief, but no settlement."],["Body 1 · Creating ceasefires and armistices",""],["Body 2 · Peacekeeping forces",""],["Body 3 · Humanitarian actions",""],["Body 4 · Limitations",""],["Conclusion",""]],"g":["Which UN actions stopped fighting?","Why did UNEF's withdrawal matter?","Who brokered actual peace treaties?","Did UNRWA solve the refugee problem?"],"ei":"The actions of the United Nations on the Arab-Israeli conflict from 1947 to 1991 were only partly effective. The UN arranged ceasefires, deployed peacekeepers and helped refugees, which temporarily relaxed tension, but it could not settle the core issues, and lasting peace deals were made mainly through US mediation.","ep":"The UN was effective in temporarily ending fighting. After the first Arab-Israeli war, UN mediator Ralph Bunche negotiated armistice agreements between Israel and Egypt, Jordan, Lebanon and Syria in 1949, for which he won the Nobel Peace Prize. After the Suez Crisis in 1956, the UN Emergency Force was stationed in Sinai and kept the Egypt–Israel border quiet for ten years.","w":["Analyse both achievements and limitations; don't write about the Cold War generally."]},{"id":"2025-7","t":["x","sea","eco"],"type":"select","q":"‘External force was a decisive factor in leading to an enormous change in a region.’ To what extent do you agree with this statement? Select one of the following to explain your answer. (i) An enormous change in Southeast Asia in the first half of the 20th century (ii) An enormous change in Western Europe in the second half of the 20th century","kw":["External force","decisive factor","enormous change","To what extent"],"focus":"Identify the enormous change (SE Asia: decolonisation/rise of nationalism; W. Europe: economic integration). Weigh external forces against internal factors.","b":[["(i) SE Asia — external forces",["Oppressive colonial rule (Dutch, French, British, US)","Influence of the 1911 Revolution, Russian Revolution, Japan's rise","Second World War and Japanese occupation (1941-45): destroyed colonial prestige, trained local armies"]],["(i) SE Asia — other factors",["Efforts of nationalists: Sukarno (PNI 1927), Ho Chi Minh (ICP 1930), Aung San, Quezon","Religious/cultural identity: Sarekat Islam, Buddhist groups","Western education creating an elite"]],["(ii) W. Europe — external forces",["US-USSR dominance: Marshall Plan, Soviet threat","Competition from the US and Japan"]],["(ii) W. Europe — other factors",["Economic difficulties after the war","Decline of Europe's world leadership; loss of empires","Leaders: Monnet, Schuman, Adenauer, Delors"]]],"s":[["Introduction","Define the enormous change; stand (e.g. external force important but not decisive)."],["Body 1 · External force 1",""],["Body 2 · External force 2",""],["Body 3 · Internal/other factors",""],["Body 4 · Weighing",""],["Conclusion",""]],"g":["What exactly was the ‘enormous change’ in your chosen region?","Which external forces pushed it?","What did local people or leaders contribute?","Would the change have happened without the external force?"],"ei":"The enormous change in Western Europe in the second half of the 20th century was economic integration, from the OEEC to the European Union. External forces, such as US aid and the Soviet threat, were very important, especially at the start, but they were not decisive: Europe's own economic needs and the vision of its leaders drove integration forward.","ep":"External force was important at the beginning of integration. In 1947, the USA offered Marshall Aid on condition that European countries cooperate, which led to the OEEC in 1948. The Soviet threat, shown by the Berlin Blockade of 1948-49, also pushed Western European states to unite. However, later steps such as the Treaty of Rome in 1957 and the Single European Act in 1986 were driven by Europeans' own interests, which shows external force was not decisive throughout.","w":["Don't just narrate events; weigh external force vs other factors."]},{"id":"2026-1","t":["hke"],"type":"agree","q":"‘From the 1950s to the 1970s, the industrial development of Hong Kong was mainly influenced by international circumstances.’ Do you agree with this statement? Explain your view.","kw":["mainly","international circumstances","industrial development","1950s to the 1970s"],"focus":"Compare international circumstances with other factors (China factor, local factors) in shaping HK's industrial growth.","b":[["International circumstances",["UN embargo 1951 ended entrepôt trade","Western demand and markets; Commonwealth preference","Cold War; oil crisis 1973; protectionism (textile quotas)"]],["China factor",["Refugees with capital (Shanghai industrialists) and labour","Cheap food and water from China"]],["Local factors",["Laissez-faire, low tax, infrastructure","Hard-working labour, entrepreneurs"]]],"s":[["Introduction",""],["Body 1 · International circumstances",""],["Body 2 · China factor",""],["Body 3 · Local factors",""],["Body 4 · Weighing",""],["Conclusion",""]],"g":["What international events changed HK's economy in the 1950s?","Where did HK export its products?","Where did capital and labour come from?","Which factor was the trigger, which the fuel?"],"ei":"From the 1950s to the 1970s, Hong Kong's industrial development was influenced by international circumstances, the China factor and local conditions. I partly agree: international circumstances triggered industrialisation and provided markets, but the China factor supplied capital and labour.","ep":"International circumstances triggered Hong Kong's industrialisation. After China entered the Korean War, the UN imposed an embargo on China in 1951, and Hong Kong's entrepôt trade collapsed. At the same time, Western markets, especially the US and Britain, were growing and bought cheap consumer goods. Hong Kong factories produced textiles, garments, plastic flowers and toys for export, and by 1959 domestic exports had overtaken re-exports. This shows that international circumstances both pushed Hong Kong into industry and provided its markets.","w":["No official comment yet — plan carefully around ‘mainly’."]},{"id":"2026-2","t":["cn1"],"type":"relimp","q":"How important was the Late Qing Reform to the modernisation of China? Explain your view with reference to the historical development of China up to 1919.","kw":["How important","Late Qing Reform","modernisation","up to 1919"],"focus":"Weigh the Late Qing Reform's contribution to modernisation against other forces (1911 Revolution, early Republic, New Culture and May Fourth) up to 1919.","b":[["Education",["Abolition of the civil service examination 1905","Modern schools; thousands of students sent to Japan","Created a new educated class"]],["Military",["New Army trained on Western lines (Yuan Shikai's Beiyang Army)","Irony: New Army officers started the Wuchang Uprising 1911"]],["Political",["Nine-year constitutional plan 1908; provincial assemblies 1909; National Assembly 1910","Gave gentry and merchants political experience"]],["Economic & social",["Ministry of Commerce, chambers of commerce, railways","Ban on opium and foot binding"]],["Limits & other forces",["Royal Cabinet 1911 showed insincerity; dynasty fell","1911 Revolution: republic","New Culture Movement / May Fourth: modernised thought"]]],"s":[["Introduction","Stand: very important as the foundation of modernisation, though other forces carried it further."],["Body 1 · Education and society","Exam abolition and new schools created modern-minded elites."],["Body 2 · Military and politics","New Army and assemblies; their role in 1911."],["Body 3 · Limits","Delay, insincerity, Manchu privilege."],["Body 4 · Other forces","1911 Revolution and May Fourth made deeper political and cultural change."],["Conclusion","Judge overall importance: the base layer on which later modernisation built."]],"g":["Which reforms of 1901-11 made a lasting change?","How did the Late Qing Reform unintentionally help the 1911 Revolution?","What did the 1911 Revolution and May Fourth achieve that the reform did not?","Is ‘foundation’ the same as ‘most important’?"],"ei":"The Late Qing Reform was very important to China's modernisation up to 1919. It abolished the examination system, created a modern army and introduced constitutional institutions, laying foundations that later reformers and revolutionaries built on. However, the 1911 Revolution and the May Fourth Movement took modernisation further in politics and thought.","ep":"The abolition of the civil service examination in 1905 was one of the most important modernising steps. It ended the system that had tied education to Confucian classics for 1,300 years. Modern schools spread rapidly, and by 1909 there were over 50,000 new-style schools. Many students also studied in Japan, where they met revolutionary ideas. These new intellectuals later led the 1911 Revolution and the New Culture Movement, so the reform shaped modernisation long after the Qing fell.","w":["Cover the period up to 1919, not just 1901-11.","Compare with other forces to answer ‘how important’."]},{"id":"2026-3","t":["jp"],"type":"extent","q":"To what extent were the relations between Japan and other Asian countries in the period 1945-85 influenced by the USA? Explain your view.","kw":["To what extent","relations between Japan and other Asian countries","influenced by the USA","1945-85"],"focus":"Weigh US influence against other factors (Japan's economic interests, war legacy, Asian countries' own policies) in Japan–Asia relations.","b":[["US influence",["San Francisco Treaty 1951 excluded PRC; Japan–Taiwan treaty 1952","US pushed Japan–South Korea normalisation 1965","Nixon's China visit 1972 → Japan–PRC normalisation","Cold War alliance limited ties with communist Asia"]],["Other factors",["Japan's economic interests: reparations, trade, ODA, Fukuda Doctrine 1977","War legacy: anti-Japanese feeling, textbook issue 1982","China's own policies: Reform and Opening-up","ASEAN's development"]]],"s":[["Introduction","Stand: to a large extent before the 1970s; less after as Japan pursued its own economic diplomacy."],["Body 1 · US and China/Taiwan",""],["Body 2 · US and Korea/SE Asia",""],["Body 3 · Japan's economic interests",""],["Body 4 · War legacy and Asian actors",""],["Conclusion",""]],"g":["Which Japan–Asia agreements happened because of US pressure?","Which initiatives came from Japan itself?","Did US influence decline over time?"],"ei":"The relations between Japan and other Asian countries from 1945 to 1985 were influenced by the USA to a large extent, especially in the Cold War decades, but Japan's own economic interests and the legacy of the war became increasingly important after the 1970s.","ep":"The USA strongly influenced Japan's relations with China. Under US pressure, Japan signed a peace treaty with Taiwan in 1952 and did not recognise the PRC. Only after Nixon's visit to Beijing in 1972 did Prime Minister Tanaka normalise relations with the PRC in September 1972. This shows that US policy decided the timing of Japan–China relations.","w":["Weigh US vs other factors; cover the whole period to 1985."]},{"id":"2026-4","t":["ww"],"type":"extent","q":"To what extent was the year of 1929 a watershed for the development of peace and prosperity of Europe? Explain your view with reference to the inter-war period (1919-39).","kw":["To what extent","1929","watershed","peace and prosperity","1919-39"],"focus":"Compare Europe before 1929 (1919-29) and after (1929-39) in both peace and prosperity. Also test whether change began before 1929 or after.","b":[["Before 1929",["Prosperity: recovery after 1924, Dawes Plan US loans, ‘Golden Twenties’ in Germany","Peace: Locarno 1925, Germany in League 1926, Kellogg-Briand 1928","But: hyperinflation 1923, Ruhr crisis, Mussolini's Corfu"]],["After 1929",["Wall Street Crash → Depression; US loans recalled; unemployment","Nazi rise 1933; Japan in Manchuria 1931; Abyssinia; rearmament; war 1939"]],["Limits of 1929 as watershed",["Weaknesses already existed (dependence on US loans, Versailles grievances)","Some peace efforts continued (Stresa Front 1935)","Turn to aggression was gradual; 1933 also a turning point"]]],"s":[["Introduction","Stand: to a large extent a watershed — from recovery and conciliation to depression and aggression — though problems existed before."],["Body 1 · Prosperity before and after 1929",""],["Body 2 · Peace before and after 1929",""],["Body 3 · Continuity and limits",""],["Conclusion",""]],"g":["What does ‘watershed’ mean?","How was Europe's economy in 1925-29?","What changed in 1929 and why?","Were there cracks before 1929?","Was 1933 a more important turning point?"],"ei":"The year 1929 was to a large extent a watershed for peace and prosperity in Europe. Before 1929, Europe enjoyed economic recovery and the ‘spirit of Locarno’. After the Wall Street Crash, depression led to extremism and aggression. However, the weaknesses that caused the collapse, such as dependence on US loans, already existed before 1929.","ep":"In terms of prosperity, 1929 marked a clear turning point. After the Dawes Plan of 1924, American loans helped Germany recover, and by 1928 German industrial output had passed its 1913 level. After the Wall Street Crash in October 1929, US banks recalled their loans, and by 1932 German unemployment reached six million. Prosperity had become depression within three years.","w":["No official comment yet — make sure to compare before vs after 1929 for both peace and prosperity."]},{"id":"2026-5","t":["mc"],"type":"agree","q":"‘In the period 1950-79, the hostility between the USA and the USSR was mainly caused by the conflict of national interests.’ Do you agree with this statement? Explain your view.","kw":["mainly","conflict of national interests","hostility","1950-79"],"focus":"Compare national interests (security, spheres of influence, economic) with ideology and other factors (arms race dynamics, misperception) in 1950-79.","b":[["National interests",["Security: Soviet buffer in Eastern Europe; US bases around USSR","Spheres of influence: Korea 1950, Hungary 1956, Cuba 1962, Middle East","Strategic balance: arms race, missiles in Turkey/Cuba","Sino-Soviet split and US–China ties 1972 show interest over ideology"]],["Ideological conflict",["Containment and domino theory; Vietnam War","Soviet support for national liberation movements","Propaganda in both blocs"]],["Other factors",["Mutual misperception and fear; nuclear arms dynamic","Leaders' personalities (Khrushchev)"]]],"s":[["Introduction","Stand: agree to a large extent."],["Body 1 · Security interests",""],["Body 2 · Spheres of influence",""],["Body 3 · Ideology",""],["Body 4 · Weighing","Examples where interest overrode ideology."],["Conclusion",""]],"g":["What did each superpower want for its own security?","Was the Vietnam War more about ideology or interest?","Why did the US befriend communist China in 1972?","Did détente happen because interests changed?"],"ei":"Between 1950 and 1979, hostility between the USA and the USSR was mainly caused by conflicting national interests, especially security and spheres of influence. Ideology intensified mistrust, but the superpowers' willingness to compromise when their interests required it shows that national interest was the main cause.","ep":"The Cuban Missile Crisis shows conflict of national interests. In 1962, the USSR placed missiles in Cuba partly to balance US missiles in Turkey and protect its ally. The US saw missiles 150 km from Florida as a direct threat to its security. The crisis was solved by a deal about missiles — withdrawal from Cuba and later from Turkey — which shows it was about strategic interest rather than ideology.","w":["No official comment yet — keep to 1950-79 and weigh factors."]},{"id":"2026-6","t":["soc"],"type":"discuss","q":"Discuss the most important role played by the United Nations in dealing with environmental and medical problems in the last three decades of the 20th century.","kw":["most important role","environmental and medical problems","last three decades"],"focus":"Identify several UN roles (coordinator, fund provider, standard-setter, educator/awareness-raiser, service provider) in 1970-2000, then argue which was MOST important.","b":[["Roles in environmental problems",["Coordinator/convenor: Stockholm Conference 1972 → UNEP; Earth Summit Rio 1992 (Agenda 21)","Standard-setter: Montreal Protocol 1987 on ozone; Kyoto Protocol 1997 (UNFCCC)","Researcher: IPCC 1988 reports"]],["Roles in medical problems",["Service provider/coordinator: WHO smallpox eradication 1980","Expanded Programme on Immunization 1974: child vaccination rose to about 80% by 1990","UNAIDS 1996 against HIV/AIDS","Primary health care: Alma-Ata Declaration 1978"]],["Which is most important?",["Coordinating international cooperation — made treaties and campaigns possible","Alternative: standard-setter (Montreal Protocol success)"]]],"s":[["Introduction","List roles; claim one (e.g. coordinator of global action) as most important."],["Body 1 · Coordinator in environment",""],["Body 2 · Coordinator in health",""],["Body 3 · Other roles","Fund provider, researcher, educator."],["Body 4 · Why coordinator is most important",""],["Conclusion",""]],"g":["What roles could the UN play (name them as nouns)?","Which UN conferences shaped environmental policy?","What did the WHO achieve by 1980?","Why is one role more important than the others?","Are your examples within 1970-2000?"],"ei":"In the last three decades of the 20th century, the United Nations played several roles in dealing with environmental and medical problems: coordinator, standard-setter, fund provider and educator. Its most important role was as a coordinator of global cooperation, because without it, landmark achievements such as the Montreal Protocol and the eradication of smallpox would not have been possible.","ep":"The UN's role as coordinator was most important in dealing with the ozone problem. After scientists showed that CFCs were destroying the ozone layer, UNEP organised negotiations that produced the Vienna Convention in 1985 and the Montreal Protocol in 1987. Almost every country eventually ratified it, and CFC production fell sharply in the 1990s. This shows that the UN could bring rich and poor countries together to solve a global environmental problem.","w":["No official comment yet — make sure to argue the ‘most important’ role, not just list roles."]},{"id":"2026-7","t":["ww","x"],"type":"select","q":"Select one of the following events and discuss its importance to the development of the stated region in the related period of the first half of the 20th century. (i) The Bosnian Crisis and its importance to the development of Europe (1908-23) (ii) The September 18th Incident and its importance to the development of Asia (1931-45)","kw":["Select one","importance","development of the stated region"],"focus":"Choose one event; explain its short- and long-term importance to the region across the whole stated period.","b":[["(i) Bosnian Crisis 1908",["Austria-Hungary annexed Bosnia; Russia humiliated; Serbia angered","Strengthened Austro-German alliance; Russia rearmed","Led to Balkan Wars 1912-13 and Sarajevo assassination 1914 → WWI","After war: collapse of Austria-Hungary, Yugoslavia created; Paris Peace Settlement to 1923"]],["(ii) September 18th (Mukden) Incident 1931",["Japan occupied Manchuria; Manchukuo 1932","League failed; Japan left League 1933 → collective security weakened","Militarists dominated Japan; full-scale war with China 1937","Pacific War 1941; Japanese occupation of SE Asia → decolonisation"]]],"s":[["Introduction","Name the event and state its importance: a starting point for a chain of conflicts that reshaped the region."],["Body 1 · Immediate importance","Short-term effects."],["Body 2 · Medium-term importance","Escalation to wider war."],["Body 3 · Long-term importance","Changes to the region by the end of the period."],["Conclusion","Judge overall importance."]],"g":["What happened in the event itself?","What happened next because of it?","How did it change the region by the end date?","Were other factors also important?"],"ei":"The September 18th Incident of 1931 was of great importance to the development of Asia from 1931 to 1945. It began Japan's military expansion, weakened collective security, led to full-scale war with China in 1937, and ultimately to the Pacific War, which changed the political map of Asia.","ep":"The Incident weakened collective security in Asia. After the Japanese army seized Manchuria and set up Manchukuo in 1932, the League sent the Lytton Commission, which condemned Japan. Instead of withdrawing, Japan left the League in 1933. No sanctions were imposed. This showed that aggression could succeed, encouraging Japan's further expansion into northern China.","w":["No official comment yet — focus on importance, not narration."]}];

const ic=(k,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const LOGO=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 16c8-4 16-4 24 2v36c-8-6-16-6-24-2z" fill="#3b6cff"/><path d="M56 16c-8-4-16-4-24 2v36c8-6 16-6 24-2z" fill="#ff5f9e"/><path d="M32 18v36" stroke="#1e2345" stroke-width="2.5"/><path d="M14 26c4-1.5 8-1 12 1M14 33c4-1.5 8-1 12 1M38 27c4-2 8-2.5 12-1M38 34c4-2 8-2.5 12-1" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="m47 4 2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#ffd23f" stroke="#1e2345" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
const tic=(t)=>`<span class="ticon" style="--c:${COL[t]}">${ic(t)}</span>`;

const TOPICS=[
 {theme:"Theme A · Modernisation and Transformation in 20th-century Asia",items:[
  ["hkp","Hong Kong: Political & Institutional Changes"],
  ["hke","Hong Kong: Development as an International City"],
  ["cn1","China: Reforms & Revolutions (early 20th c.)"],
  ["cn2","China: Maoist & Post-Mao Modernisation"],
  ["jp","Changes in Japan"],
  ["sea","Southeast Asia: Independence & Regional Cooperation"]]},
 {theme:"Theme B · Conflicts and Cooperation in the 20th-century World",items:[
  ["ww","The Two World Wars & the Peace Settlements"],
  ["mc","Major Conflicts after WWII & Attempts at Peace"],
  ["eco","International Economic Co-operation"],
  ["soc","International Social & Cultural Co-operation"]]},
 {theme:"Cross-topic",items:[["x","Cross-topic & Choice-of-Country Questions"]]}
];
const TNAME=Object.fromEntries(TOPICS.flatMap(g=>g.items));
const TYPES={
 agree:["Agree / Validity","Take a clear stand in the introduction. Discuss evidence for AND against the statement, weigh them, and finish with a judgement that answers the key word (e.g. ‘primarily’, ‘more than’)."],
 extent:["To what extent / How far","Show both sides — how far it is true and how far it is not — then state a clear degree (e.g. ‘to a large extent’) and justify it."],
 relimp:["Relative importance","Explain the named factor, then the other factors, then COMPARE them directly. Separate paragraphs without a comparison will not reach the top bands."],
 trace:["Trace and explain","Divide the period into stages with turning points. For each stage, describe the features (trace) and give reasons (explain). Keep the two tasks balanced."],
 compare:["Compare","Use the same criteria for both sides and compare in every paragraph (similarities and differences). Avoid two separate stories."],
 examine:["Examine","Break the topic into clear aspects, factors or stages. Explain each with specific evidence and show how it links to the question."],
 analyse:["Analyse","Name the roles, factors or threats as clear labels, then explain each with evidence and show cause and effect."],
 discuss:["Discuss","Identify several points (characteristics, factors or roles), explain each with evidence, and reach an overall view."],
 assess:["Assess effectiveness / significance","Weigh achievements against limitations (or significance against limits) and give a clear overall verdict."],
 how:["How / In what ways","Explain the ways in which something affected something else. This is not a ‘relative importance’ question — focus on the effects."],
 inwhatways:["In what ways","Set out the different ways or roles, each with evidence and a clear effect. Don’t switch to a ‘to what extent’ answer."],
 why:["Why","Explain causes with clear cause-and-effect links. If the question says ‘but not earlier’, explain that part too."],
 elaborate:["Elaborate","Support and develop the statement with examples, showing the links it describes (e.g. cause and effect in both directions)."],
 illustrate:["Illustrate","Show the statement is true through well-chosen, specific examples, organised clearly (by stage or by area)."],
 describe:["Describe and discuss","First describe the situation clearly, then discuss change and continuity or whatever the second task asks."],
 explain:["Explain","Give reasons and show how events developed, with clear links between cause and result."],
 select:["Choose one option","Pick the option you know best, name it clearly in the introduction, then follow the command word for that option."]
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function highlight(q,kws){
  let t=esc(q);
  const ks=[...kws].sort((a,b)=>b.length-a.length);
  const ranges=[];const low=q.toLowerCase();
  ks.forEach(k=>{const i=low.indexOf(k.toLowerCase());if(i<0)return;const e=i+k.length;if(ranges.some(r=>i<r[1]&&e>r[0]))return;ranges.push([i,e]);});
  ranges.sort((a,b)=>b[0]-a[0]);
  let out=q;ranges.forEach(([i,e])=>{out=out.slice(0,i)+"\u0001"+out.slice(i,e)+"\u0002"+out.slice(e);});
  return esc(out).replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
}
function formatQ(q){ // break (a)(b) options onto lines
  return q.replace(/\s(\((?:[a-d]|i{1,3}|iv)\))\s/g,"\n$1 ");
}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={topic:store.get("topic","hkp"),search:"",type:"",view:"list",qid:null,step:1};
let ticks=store.get("ticks",{});let seen=store.get("seen",{});
const app=document.getElementById("app");
const byTopic=t=>t==="all"?QS:QS.filter(q=>q.t.includes(t));
function code(q){const [y,n]=q.id.split("-");return {y,n}}

const CHEERS=["Nice work — you've planned the whole essay!","Great thinking. Now try writing your own intro.","You've got this. One paragraph at a time!","Plan done! Time to write."];
function renderList(){
  const list=byTopic(state.topic).filter(q=>(!state.type||q.type===state.type)&&(!state.search||q.q.toLowerCase().includes(state.search.toLowerCase())));
  const title=state.topic==="all"?"All questions":TNAME[state.topic];
  app.innerHTML=`
  <header class="top">
    <div class="brand"><div class="logo">${LOGO}</div>
      <div><div class="eyebrow">HKDSE History · Paper 2 · 2012–2026</div>
      <h1>Paper 2 Essay Coach</h1>
      <p>Pick a topic, choose a question and build your essay step by step. Stuck? Hit Continue for hints and examples.</p></div></div>
    <div class="stat"><b>${QS.length}</b>past-paper questions</div>
  </header>
  <section class="themes" aria-label="Choose a topic">
    ${TOPICS.map((g,gi)=>`<div class="theme"><h2><span class="pill">${["Theme A","Theme B","Mix it up"][gi]}</span>${esc(g.theme.replace(/^Theme [AB] · /,""))}</h2><div class="topics">
      ${g.items.map(([k,n])=>`<button class="topic" style="--c:${COL[k]}" data-topic="${k}" aria-pressed="${state.topic===k}">${tic(k)}<span><span class="tname">${n}</span><span class="tmeta">${byTopic(k).length} questions</span></span></button>`).join("")}
    </div></div>`).join("")}
    <button class="allbtn" data-topic="all" aria-pressed="${state.topic==="all"}">Show all ${QS.length} questions</button>
  </section>
  <div class="listhead" id="listtop">
    <h2>${tic(state.topic)}${esc(title)}</h2>
    <div class="filters">
      <input id="search" type="search" placeholder="Search questions…" value="${esc(state.search)}" aria-label="Search questions">
      <select id="typef" aria-label="Filter by question type"><option value="">All question types</option>
        ${[...new Set(byTopic(state.topic).map(q=>q.type))].map(t=>`<option value="${t}" ${state.type===t?"selected":""}>${TYPES[t][0]}</option>`).join("")}
      </select>
    </div>
  </div>
  ${list.length?`<ul class="qlist">${list.map(q=>{const c=code(q);const col=COL[state.topic==="all"?q.t[0]:state.topic];return `<li><button class="qrow" style="--c:${col}" data-q="${q.id}">
      <span class="qcode"><b>${c.y}</b>Q${c.n}</span>
      <span><span class="qtext">${esc(q.q)}</span>
      <span class="tags"><span class="tag type">${TYPES[q.type][0]}</span>${q.t.filter(t=>t!==state.topic).map(t=>`<span class="tag">${esc(TNAME[t].split(":")[0])}</span>`).join("")}${seen[q.id]?`<span class="tag done">✓ Step ${seen[q.id]} reached</span>`:""}</span></span>
    </button></li>`}).join("")}</ul>`:`<div class="empty">No questions match. Clear the search or pick another question type.</div>`}
  <p class="foot">Questions from HKDSE History Paper 2, 2012–2026. Brainstorm points, structures, guiding questions and sample paragraphs are study aids, not official answers. 2026 questions have no published examiner comments yet.</p>`;
  app.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;state.type="";state.search="";store.set("topic",state.topic);renderList();document.getElementById("listtop").scrollIntoView({behavior:"smooth",block:"start"})});
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>openQ(b.dataset.q,1));
  const s=document.getElementById("search");s.oninput=()=>{state.search=s.value;const pos=s.selectionStart;renderList();const n=document.getElementById("search");n.focus();n.setSelectionRange(pos,pos)};
  document.getElementById("typef").onchange=e=>{state.type=e.target.value;renderList()};
}
function openQ(id,step){
  state.view="q";state.qid=id;state.step=Math.max(step||1,1);
  seen[id]=Math.max(seen[id]||0,state.step);store.set("seen",seen);
  try{history.replaceState(null,"","#q"+id)}catch(e){}
  renderQ();window.scrollTo({top:0});
}
function renderQ(){
  const q=QS.find(x=>x.id===state.qid);const c=code(q);const T=TYPES[q.type];
  const ctx=byTopic(state.topic);const i=ctx.findIndex(x=>x.id===q.id);
  const prev=i>0?ctx[i-1]:null,next=i>=0&&i<ctx.length-1?ctx[i+1]:null;
  const tk=ticks[q.id]||[];const main=state.topic!=="all"&&q.t.includes(state.topic)?state.topic:q.t[0];
  const stepNames=["Brainstorm & plan","Guiding questions","Worked example"];
  const pct=Math.round(100*tk.length/q.g.length);
  app.innerHTML=`
  <button class="back" id="back">${ic("back")} ${esc(state.topic==="all"?"All questions":TNAME[state.topic])}</button>
  <article class="paper" style="--c:${COL[main]}">
    <div class="qhead">${tic(main)}<span class="yr">${c.y} · Question ${c.n}</span>${q.t.map(t=>`<span class="tchip" style="--c:${COL[t]}">${esc(TNAME[t])}</span>`).join("")}</div>
    <div class="qtext">${highlight(formatQ(q.q),q.kw).replace(/\n/g,"<br>")}</div>
    <div class="focus"><span class="ic">${ic("target")}</span><div><b>What the question really asks</b>${esc(q.focus)}</div></div>
    <div class="typetip">${ic("bulb")}<span><strong>${T[0]}:</strong> ${T[1]}</span></div>
  </article>
  <nav class="steps" aria-label="Steps">
    ${stepNames.map((n,k)=>`<span class="step ${state.step>=k+1?"on":"locked"}"><span class="n">${state.step>k+1?"✓":k+1}</span>${n}</span>`).join("")}
  </nav>
  <section class="panel">
    <div class="phead"><span class="pi" style="background:#f59e0b">${ic("bulb")}</span><div><h3>Brainstorm points</h3><p>Ideas and evidence to use. Keep every point tied to the highlighted key words.</p></div></div>
    <div class="bgrid">${q.b.map(([h,pts])=>`<div class="bcard"><h4>${esc(h)}</h4><ul>${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}</div>
  </section>
  <section class="panel">
    <div class="phead"><span class="pi" style="background:#3b6cff">${ic("list")}</span><div><h3>Essay structure</h3><p>Follow this plan paragraph by paragraph.</p></div></div>
    <ol class="outline">${q.s.map(([h,d])=>`<li><div><div class="h">${esc(h)}</div>${d?`<div class="d">${esc(d)}</div>`:""}</div></li>`).join("")}</ol>
    <div class="peel">Each body paragraph:
      <span class="p" style="background:#ff5f45">Point</span>${ic("arrow")}<span class="p" style="background:#f59e0b">Evidence</span>${ic("arrow")}<span class="p" style="background:#3b6cff">Explain</span>${ic("arrow")}<span class="p" style="background:#10b39a">Link</span></div>
    ${state.step===1?`<div class="actions"><button class="btn" id="cont">Continue: I’m still stuck ${ic("arrow")}</button><span class="hint">Get guiding questions to think it through.</span></div>`:""}
  </section>
  ${state.step>=2?`<section class="panel" id="s2">
    <div class="phead"><span class="pi" style="background:#8b5cf6">${ic("q")}</span><div><h3>Guiding questions</h3><p>Jot down a quick answer to each, then tick it off.</p></div></div>
    <ul class="guides">${q.g.map((g,k)=>`<li><label><input type="checkbox" data-k="${k}" ${tk.includes(k)?"checked":""}><span>${esc(g)}</span></label></li>`).join("")}</ul>
    <div class="bar"><i id="barfill" style="width:${pct}%"></i></div>
    <div class="progress" id="prog">${tk.length} of ${q.g.length} answered</div>
    <div class="cheer" id="cheer" ${tk.length===q.g.length?"":"hidden"}>${ic("star")} ${CHEERS[q.id.length%CHEERS.length]}</div>
    ${state.step===2?`<div class="actions"><button class="btn" id="cont">Continue: show me an example ${ic("arrow")}</button><span class="hint">See a sample intro, a model paragraph and mistakes to avoid.</span></div>`:""}
  </section>`:""}
  ${state.step>=3?`<section class="panel" id="s3">
    <div class="phead"><span class="pi" style="background:#10b39a">${ic("pen")}</span><div><h3>Worked example</h3><p>Use these as models, then write your own version in your own words.</p></div></div>
    <div class="slabel">Sample introduction</div><p class="sample">${esc(q.ei)}</p>
    <div class="slabel">Model body paragraph</div><p class="sample body">${esc(q.ep)}</p>
    <div class="slabel">Watch out for these mistakes</div>
    <ul class="warns">${q.w.map(w=>`<li>${ic("warn")}<span>${esc(w)}</span></li>`).join("")}</ul>
  </section>`:""}
  <nav class="qnav">
    ${prev?`<button data-q="${prev.id}"><small>← Previous</small>${code(prev).y} Q${code(prev).n}</button>`:"<span></span>"}
    ${next?`<button data-q="${next.id}" style="text-align:right"><small>Next →</small>${code(next).y} Q${code(next).n}</button>`:""}
  </nav>`;
  document.getElementById("back").onclick=()=>{state.view="list";try{history.replaceState(null,"","#t-"+state.topic)}catch(e){};renderList();};
  const cb=document.getElementById("cont");
  if(cb)cb.onclick=()=>{state.step++;seen[q.id]=Math.max(seen[q.id]||0,state.step);store.set("seen",seen);renderQ();const t=document.getElementById("s"+state.step);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});};
  app.querySelectorAll(".guides input").forEach(inp=>inp.onchange=()=>{
    const k=+inp.dataset.k;let a=ticks[q.id]||[];a=inp.checked?[...new Set([...a,k])]:a.filter(x=>x!==k);ticks[q.id]=a;store.set("ticks",ticks);
    document.getElementById("prog").textContent=`${a.length} of ${q.g.length} answered`;
    document.getElementById("barfill").style.width=Math.round(100*a.length/q.g.length)+"%";
    document.getElementById("cheer").hidden=a.length!==q.g.length;});
  app.querySelectorAll(".qnav [data-q]").forEach(b=>b.onclick=()=>openQ(b.dataset.q,1));
}
(function init(){
  const h=(location.hash||"").slice(1);
  if(h.startsWith("q")&&QS.find(x=>x.id===h.slice(1))){const q=QS.find(x=>x.id===h.slice(1));if(!q.t.includes(state.topic)&&state.topic!=="all")state.topic=q.t[0];openQ(q.id,1);return;}
  if(h.startsWith("t-")&&(TNAME[h.slice(2)]||h.slice(2)==="all"))state.topic=h.slice(2);
  if(!TNAME[state.topic]&&state.topic!=="all")state.topic="hkp";
  renderList();
})();
</script>
</body></html>
